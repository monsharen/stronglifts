<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Health Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #000000;
    --panel: #1c1c1e;
    --panel-2: #2c2c2e;
    --panel-3: #3a3a3c;
    --line: rgba(84, 84, 88, .5);
    --chalk: #ffffff;
    --dim: rgba(235, 235, 245, .6);
    --dim-2: rgba(235, 235, 245, .3);
    --volt: #30d158;
    --volt-ink: #000000;
    --blue: #0a84ff;
    --fail: #ff453a;
    --warn: #ff9f0a;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html { height: 100%; }
  body {
    background: var(--bg);
    color: var(--chalk);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px 16px calc(150px + env(safe-area-inset-bottom)); }

  h1, h2, h3, .display { font-weight: 700; letter-spacing: -.015em; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0 14px;
    margin-bottom: 8px;
  }
  header h1 { font-size: 31px; font-weight: 800; letter-spacing: -.02em; }
  header h1 .bar { color: inherit; }
  header .tag { color: var(--dim); font-size: 12px; }
  .h-left { display: flex; align-items: center; gap: 6px; }
  .back {
    background: none; border: none; cursor: pointer;
    color: var(--blue); font-family: inherit; font-size: 30px; font-weight: 400;
    padding: 0 6px 4px 0; line-height: 1;
  }
  .back:active { opacity: .5; }
  .tabs { display: flex; gap: 2px; background: var(--panel); border-radius: 9px; padding: 2px; }
  .tab {
    background: none; border: none; cursor: pointer;
    font-family: inherit; color: var(--dim);
    font-size: 13px; font-weight: 600;
    padding: 5px 14px; border-radius: 7px;
  }
  .tab.active { color: var(--chalk); background: var(--panel-3); box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }

  /* ---------- stats ---------- */
  .tiles { display: flex; gap: 8px; margin-bottom: 8px; }
  .tile {
    flex: 1; background: var(--panel); border-radius: var(--radius);
    padding: 12px 6px; text-align: center;
  }
  .tile .num { font-weight: 700; font-size: 21px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tile .lbl { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .tile.tap { cursor: pointer; }
  .tile.tap:active { background: var(--panel-2); }
  .chart-card {
    background: var(--panel); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
  }
  .chart-card.tap { cursor: pointer; }
  .chart-card.tap:active { background: var(--panel-2); }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .chart-head h3 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .chart-head .cur { font-weight: 600; font-size: 15px; text-align: right; margin-left: 12px; font-variant-numeric: tabular-nums; }
  .chart-head .cur .best { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .chart-card svg { display: block; width: 100%; height: auto; }
  .chart-dates { display: flex; justify-content: space-between; color: var(--dim-2); font-size: 11px; margin-top: 6px; }

  .bw-form { display: flex; gap: 8px; margin-top: 12px; }
  .bw-form input {
    flex: 1; min-height: 46px; min-width: 0;
    background: var(--panel-2); border: none; border-radius: 10px;
    color: var(--chalk); font-family: inherit; font-weight: 600; font-size: 19px;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .bw-form input:focus { outline: 2px solid var(--blue); }
  .bw-form input::placeholder { color: var(--dim-2); }
  .bw-form button {
    flex: 0 0 auto; padding: 0 18px;
    background: var(--panel-2); border: none; border-radius: 10px;
    color: var(--blue); font-family: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .bw-form button:active { background: var(--panel-3); }
  .data-actions { display: flex; gap: 8px; margin-top: 12px; }
  .data-actions button {
    flex: 1; min-height: 46px;
    background: var(--panel-2); border: none; border-radius: 10px;
    color: var(--blue); font-family: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .data-actions button:active { background: var(--panel-3); }
  .data-actions button.active { color: var(--volt); box-shadow: inset 0 0 0 1.5px var(--volt); }

  /* ---------- home: next workout card ---------- */
  .next-card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 16px 16px 6px;
    position: relative;
    overflow: hidden;
  }
  .next-card::before {
    content: attr(data-letter);
    position: absolute; right: -10px; top: -34px;
    font-weight: 800; font-size: 150px; line-height: 1;
    color: rgba(48, 209, 88, .05);
    pointer-events: none;
  }
  .next-card .kicker { color: var(--dim); font-size: 12px; }
  .next-card h2 { font-size: 28px; font-weight: 700; line-height: 1.15; margin: 2px 0 12px; }
  .next-card h2 .letter { color: var(--volt); }
  .preview-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 11px 0;
    border-top: 1px solid var(--line);
  }
  .preview-row .ex { font-weight: 600; font-size: 15px; }
  .preview-row .scheme { color: var(--dim); font-size: 12px; margin-left: 8px; font-weight: 400; }
  .preview-row .kg .scheme { margin-left: 0; margin-right: 8px; }
  .preview-row .kg { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  .preview-row .kg.deload { color: var(--fail); }
  .preview-row .kg.up { color: var(--volt); }

  .btn {
    display: block; width: 100%;
    font-family: inherit; font-weight: 600; font-size: 17px;
    padding: 15px;
    border: none; border-radius: var(--radius);
    cursor: pointer;
    margin-top: 14px;
  }
  .btn-volt { background: var(--volt); color: #000; }
  .btn-volt:active { opacity: .75; }
  .btn-ghost { background: var(--panel); color: var(--fail); font-size: 15px; padding: 13px; }
  .btn-ghost:active { background: var(--panel-2); }

  /* ---------- history ---------- */
  .section-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 24px 4px 8px;
    color: var(--dim);
    font-size: 13px; text-transform: uppercase; letter-spacing: .02em;
  }
  .hist-card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 10px;
  }
  .hist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .hist-head .when { color: var(--dim); font-size: 13px; }
  .hist-head .badge {
    font-weight: 600; font-size: 13px;
    background: var(--panel-2);
    padding: 3px 10px; border-radius: 7px;
  }
  .hist-head .badge .letter { color: var(--volt); }
  .hist-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hist-row .reps { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .hist-row .ok { color: var(--volt); }
  .hist-row .nok { color: var(--fail); }
  .hist-del {
    background: none; border: none; color: var(--blue); font-family: inherit;
    font-size: 13px; cursor: pointer;
    padding: 8px 0 0;
  }
  .hist-del:active { opacity: .5; }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; font-size: 14px; }

  /* ---------- session view ---------- */
  .sess-head { margin-bottom: 16px; }
  .sess-head .kicker { color: var(--dim); font-size: 12px; }
  .sess-head h2 { font-size: 28px; font-weight: 700; line-height: 1.15; }
  .sess-head h2 .letter { color: var(--volt); }

  .ex-card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .ex-top h3 { font-size: 19px; font-weight: 600; }
  .ex-top .scheme { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: var(--dim); margin-top: -4px; margin-bottom: 10px; }
  .hint.deload { color: var(--fail); }
  .hint.up { color: var(--volt); }

  .weight-ctl { display: flex; align-items: stretch; gap: 8px; margin-bottom: 14px; }
  .weight-ctl button {
    flex: 0 0 54px;
    background: var(--panel-2); border: none; border-radius: 12px;
    color: var(--chalk); font-family: inherit; font-size: 24px; font-weight: 400;
    cursor: pointer;
  }
  .weight-ctl button:active { background: var(--panel-3); }
  .weight-ctl .wfield { flex: 1; position: relative; }
  .weight-ctl input {
    width: 100%; height: 100%; min-height: 54px;
    background: var(--panel-2); border: none; border-radius: 12px;
    color: var(--chalk); font-family: inherit; font-weight: 700; font-size: 26px;
    text-align: center; font-variant-numeric: tabular-nums;
    padding-right: 30px;
  }
  .weight-ctl input:focus { outline: 2px solid var(--blue); }
  .weight-ctl .unit {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--dim-2); font-size: 12px; pointer-events: none;
  }

  .sub-label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .02em; margin: 14px 0 8px; }
  .wu-sets { display: flex; flex-wrap: wrap; gap: 8px; }
  .wu-set { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1 0 52px; max-width: 76px; }
  .wu-btn {
    width: 100%; aspect-ratio: 1; max-width: 62px;
    border-radius: 50%;
    border: none;
    background: var(--panel-2);
    color: var(--dim);
    font-family: inherit; font-weight: 600; font-size: 18px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .wu-set.checked .wu-btn { background: var(--volt); color: #000; }
  .wu-w { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .wu-none { color: var(--dim); font-size: 13px; line-height: 1.5; }

  .sets { display: flex; gap: 8px; }
  .set-btn {
    flex: 1; aspect-ratio: 1; max-width: 74px;
    border-radius: 50%;
    border: none;
    background: var(--panel-2);
    color: var(--dim);
    font-family: inherit; font-weight: 600; font-size: 20px;
    cursor: pointer;
    transition: background .12s, color .12s, box-shadow .12s;
    font-variant-numeric: tabular-nums;
  }
  .set-btn.done { background: var(--volt); color: #000; }
  .set-btn.partial { background: var(--panel-2); color: var(--volt); box-shadow: inset 0 0 0 2px var(--volt); }
  .set-btn.zero { background: var(--panel-2); color: var(--fail); box-shadow: inset 0 0 0 2px var(--fail); }
  .sets.single .set-btn { flex: 0 0 74px; }

  .sess-actions { margin-top: 22px; }
  .note { color: var(--dim-2); font-size: 12px; text-align: center; margin-top: 12px; line-height: 1.5; }

  .video-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--blue); text-decoration: none;
    font-size: 13px; font-weight: 500;
    padding: 6px 0;
  }
  .video-link .play {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--panel-2); color: var(--blue); font-size: 8px;
    padding-left: 1px;
  }
  .video-link:active { opacity: .5; }

  /* ---------- rest timer ---------- */
  .rest-bar {
    position: fixed; z-index: 10;
    bottom: calc(76px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    width: min(448px, calc(100% - 32px));
    background: rgba(28, 28, 30, .88);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .55);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .rest-start {
    flex: 1;
    background: none; border: none; cursor: pointer;
    color: var(--chalk);
    font-family: inherit;
    font-size: 15px; font-weight: 600;
    padding: 8px 0;
  }
  .rest-start .play { color: var(--volt); margin-right: 8px; }
  .rest-time {
    font-weight: 700; font-size: 28px; line-height: 1;
    min-width: 84px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .rest-msg { flex: 1; color: var(--dim); font-size: 12px; }
  .rest-stop {
    background: var(--panel-2); border: none; border-radius: 10px;
    color: var(--chalk); font-family: inherit;
    font-size: 14px; font-weight: 600;
    padding: 11px 16px; cursor: pointer;
  }
  .rest-stop:active { background: var(--panel-3); }
  .rest-bar.over { box-shadow: 0 8px 30px rgba(255, 69, 58, .3); }
  .rest-bar.over .rest-time, .rest-bar.over .rest-msg { color: var(--fail); }
  @keyframes rest-pulse { 50% { box-shadow: 0 8px 30px rgba(255, 69, 58, .25); } }

  /* ---------- summary: rings, tab bar ---------- */
  .kicker-date { color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: .04em; margin-bottom: -1px; }
  .rings-row { display: flex; align-items: center; gap: 22px; padding: 4px 2px; }
  .rings { width: 126px; flex: 0 0 126px; }
  .ring-stats { display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .ring-stat { display: flex; flex-direction: column; }
  .r-lbl { color: var(--dim); font-size: 12px; }
  .r-val { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .r-goal { font-size: 14px; font-weight: 500; opacity: .55; }
  .card-chev { color: var(--dim-2); font-size: 16px; font-weight: 600; margin-left: 8px; }
  .tabbar {
    position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-around;
    background: rgba(22, 22, 24, .92);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(84, 84, 88, .35);
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
  }
  .tabbar button {
    background: none; border: none; cursor: pointer; color: var(--dim-2);
    font-family: inherit; font-size: 10px; font-weight: 500;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    flex: 1; max-width: 110px; padding: 2px 0;
  }
  .tabbar button svg { width: 25px; height: 25px; }
  .tabbar button.on { color: var(--volt); }

  /* ---------- reminders ---------- */
  .tog-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .tog-row:first-child { border-top: none; padding-top: 0; }
  .tog-row .t-name { font-size: 15px; font-weight: 500; }
  .tog-row .t-sub { color: var(--dim); font-size: 12px; }
  .tog { flex: 0 0 51px; height: 31px; border-radius: 16px; border: none; background: var(--panel-3); position: relative; transition: background .18s; }
  .tog::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); transition: left .18s;
  }
  .tog.on { background: var(--volt); }
  .tog.on::after { left: 22px; }

  /* ---------- meals ---------- */
  .cal-num { font-weight: 700; font-size: 38px; line-height: 1.1; margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .cal-num .cal-lbl { font-size: 12px; color: var(--dim); font-weight: 400; letter-spacing: 0; margin-left: 8px; }
  .cal-num.warn { color: var(--warn); }
  .cal-num.over { color: var(--fail); }
  .cal-bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin: 10px 0 14px; }
  .cal-fill { height: 100%; background: var(--volt); border-radius: 4px; transition: width .25s; }
  .cal-fill.warn { background: var(--warn); }
  .cal-fill.over { background: var(--fail); }
  .meal-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .meal-btn {
    min-height: 56px; border-radius: 12px; border: none; background: var(--panel-2);
    color: var(--chalk); cursor: pointer; padding: 8px;
    font-family: inherit; font-weight: 600; font-size: 15px;
    transition: background .12s, color .12s;
  }
  .meal-btn .kc { display: block; font-weight: 400; font-size: 11px; color: var(--dim); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .meal-btn.on { background: var(--volt); color: #000; }
  .meal-btn.on .kc { color: rgba(0, 0, 0, .6); }
  .snack-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  .snack-row .s-name { font-weight: 600; font-size: 15px; }
  .snack-row .scheme { color: var(--dim); font-size: 12px; font-weight: 400; }
  .snack-btn {
    flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%;
    border: none; background: var(--panel-2); color: var(--dim);
    font-family: inherit; font-weight: 600; font-size: 20px; cursor: pointer;
    transition: color .12s, box-shadow .12s;
    font-variant-numeric: tabular-nums;
  }
  .snack-btn.on { color: var(--volt); box-shadow: inset 0 0 0 2px var(--volt); }
  .cfg-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .cfg-item label { display: block; color: var(--dim); font-size: 11px; margin-bottom: 4px; }
  .cfg-item input {
    width: 100%; min-height: 40px;
    background: var(--panel-2); border: none; border-radius: 10px;
    color: var(--chalk); font-family: inherit; font-weight: 600; font-size: 16px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .cfg-item input:focus { outline: 2px solid var(--blue); }

  /* ---------- celebrations ---------- */
  .kudos {
    position: fixed; inset: 0; z-index: 100; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .kudos .k-main {
    font-weight: 800; font-size: 40px;
    letter-spacing: -.02em; color: var(--volt); text-align: center; line-height: 1.1;
    background: rgba(28, 28, 30, .95);
    border-radius: 18px;
    padding: 12px 26px 14px;
    max-width: 86vw;
    box-shadow: 0 12px 44px rgba(0, 0, 0, .6);
    animation: k-pop 1.5s cubic-bezier(.2,1.6,.3,1) forwards;
  }
  .kudos .k-sub {
    font-size: 13px; font-weight: 500; color: var(--chalk); text-align: center;
    background: rgba(28, 28, 30, .95); border-radius: 10px;
    padding: 5px 14px; margin-top: 10px; max-width: 86vw;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
    animation: k-sub 1.5s ease-out forwards;
  }
  .kudos.small .k-main { font-size: 24px; padding: 8px 18px 9px; animation-duration: .85s; }
  .kudos.small .k-sub { animation-duration: .85s; }
  @keyframes k-pop {
    0% { transform: scale(.15) rotate(-6deg); opacity: 0; }
    16% { transform: scale(1.18) rotate(2deg); opacity: 1; }
    28% { transform: scale(1) rotate(0); }
    78% { transform: scale(1); opacity: 1; }
    100% { transform: translateY(-46px) scale(.9); opacity: 0; }
  }
  @keyframes k-sub {
    0% { opacity: 0; transform: translateY(10px); }
    22% { opacity: 1; transform: none; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
  .confetti i { position: absolute; top: -14px; width: 6px; height: 10px; border-radius: 2px; opacity: .95; animation: conf-fall linear forwards; }
  @keyframes conf-fall { to { transform: translateY(105vh) rotate(720deg); opacity: .6; } }
  .meal-btn.on, .set-btn.done, .wu-set.checked .wu-btn, .snack-btn.on { animation: pop .18s ease-out; }
  @keyframes pop { 40% { transform: scale(1.1); } }
  .pr-card {
    background: var(--panel); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 12px; text-align: center;
  }
  .pr-card .pr-title { font-weight: 700; font-size: 20px; color: var(--volt); }
  .pr-card .pr-lifts { font-size: 14px; margin-top: 3px; color: var(--dim); }
  .medal-shelf { font-size: 15px; letter-spacing: .15em; }
  .ach-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .ach {
    background: var(--panel); border-radius: 12px;
    padding: 12px 8px; text-align: center;
    opacity: .35; filter: grayscale(1);
  }
  .ach.got { opacity: 1; filter: none; }
  .ach .a-icon { font-size: 26px; line-height: 1.3; }
  .ach .a-name { font-weight: 600; font-size: 12px; margin-top: 3px; letter-spacing: -.01em; }
  .ach .a-desc { color: var(--dim); font-size: 10px; margin-top: 2px; line-height: 1.35; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/* ================= StrongLifts 5x5 rules ================= */

const EXERCISES = {
  squat:    { name: "Squat",          sets: 5, reps: 5, inc: 2.5, start: 20 },
  bench:    { name: "Bench Press",    sets: 5, reps: 5, inc: 2.5, start: 20 },
  row:      { name: "Barbell Row",    sets: 5, reps: 5, inc: 2.5, start: 30 },
  ohp:      { name: "Overhead Press", sets: 5, reps: 5, inc: 2.5, start: 20 },
  deadlift: { name: "Deadlift",       sets: 1, reps: 5, inc: 5,   start: 40 },
};
const WORKOUTS = { A: ["squat", "bench", "row"], B: ["squat", "ohp", "deadlift"] };
const VIDEOS = {
  A: "https://www.youtube.com/watch?v=EP2g3Sj3qSw",
  B: "https://www.youtube.com/watch?v=ro3Mh9o7JPU",
};
const MIN_WEIGHT = 20;        // empty bar
const DELOAD_AFTER = 3;       // failed sessions at same weight
const DELOAD_FACTOR = 0.9;

const store = {
  load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
    catch { return fallback; }
  },
  save(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
  drop(key) { localStorage.removeItem(key); },
};

const sessions = () => store.load("sl.sessions", []); // oldest first

function nextWorkoutType() {
  const hist = sessions();
  if (!hist.length) return "A";
  return hist[hist.length - 1].type === "A" ? "B" : "A";
}

function isSuccess(entry) {
  const def = EXERCISES[entry.ex];
  return entry.setReps.length === def.sets && entry.setReps.every(r => r === def.reps);
}

/* History of one exercise, oldest → newest */
function exerciseHistory(ex) {
  const out = [];
  for (const s of sessions())
    for (const e of s.entries)
      if (e.ex === ex) out.push(e);
  return out;
}

function roundToPlate(w) {
  return Math.max(MIN_WEIGHT, Math.round(w / 2.5) * 2.5);
}

/* Returns { weight, why, fails } per StrongLifts progression rules.
   fails = consecutive failed sessions at the recommended weight so far. */
function recommend(ex) {
  const def = EXERCISES[ex];
  const hist = exerciseHistory(ex);
  if (!hist.length) return { weight: def.start, why: "start", fails: 0 };

  const last = hist[hist.length - 1];
  if (isSuccess(last)) return { weight: last.weight + def.inc, why: "up", fails: 0 };

  let fails = 0;
  for (let i = hist.length - 1; i >= 0; i--) {
    const e = hist[i];
    if (e.weight === last.weight && !isSuccess(e)) fails++;
    else break;
  }
  if (fails >= DELOAD_AFTER) return { weight: roundToPlate(last.weight * DELOAD_FACTOR), why: "deload", fails };
  return { weight: last.weight, why: "repeat", fails };
}

/* ================= app registry =================
   The dashboard builds itself from this list. To add a new app:
   add an entry here, its routes in ROUTES, and its view in render(). */
/* Fitness-style bottom tab bar drives navigation. To add a new app:
   add a tab here, its routes in ROUTES, and its view in render(). */
const TAB_ICONS = {
  rings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="4.5"/></svg>`,
  barbell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8.5 12h7"/><rect x="4.5" y="7.5" width="3" height="9" rx="1.2"/><rect x="16.5" y="7.5" width="3" height="9" rx="1.2"/><path d="M2 12h1.5M20.5 12H22"/></svg>`,
  scale: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5.5"/><path d="M12 10.5l2.8-2.8"/></svg>`,
  meals: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v5.5M4.5 3v3.5a2.5 2.5 0 0 0 5 0V3M7 11v10"/><path d="M16.5 3c1.8 2.2 1.8 6.3 0 8.5V21"/></svg>`,
  ruler: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8.5" width="18" height="7" rx="2"/><path d="M7.5 8.5v3.5M12 8.5v3.5M16.5 8.5v3.5"/></svg>`,
};
const TABS = [
  { route: "#/", label: "Summary", icon: TAB_ICONS.rings, match: h => h === "#/" || h === "#/awards" },
  { route: "#/stronglifts", label: "StrongLifts", icon: TAB_ICONS.barbell, match: h => h.startsWith("#/stronglifts") },
  { route: "#/weight", label: "Weight", icon: TAB_ICONS.scale, match: h => h === "#/weight" },
  { route: "#/meals", label: "Meals", icon: TAB_ICONS.meals, match: h => h === "#/meals" },
  { route: "#/body", label: "Body", icon: TAB_ICONS.ruler, match: h => h === "#/body" },
];

function tabbarHTML() {
  return `<nav class="tabbar">${TABS.map(t =>
    `<button class="${t.match(route) ? "on" : ""}" onclick="navigate('${t.route}')">${t.icon}<span>${t.label}</span></button>`).join("")}</nav>`;
}

/* ================= app state / routing ================= */

let draft = store.load("sl.draft", null);

const ROUTES = ["#/", "#/stronglifts", "#/stronglifts/stats", "#/weight", "#/meals", "#/body", "#/awards"];
function parseRoute(h) {
  if (h === "#stats") return "#/stronglifts/stats"; // pre-dashboard deep link
  return ROUTES.includes(h) ? h : "#/";
}
let route = parseRoute(location.hash);
if (draft && route === "#/") route = "#/stronglifts"; // resume mid-workout on open

function navigate(r) {
  if (r !== "#/meals") mealsYesterday = false;
  if (location.hash === r) { route = r; render(); window.scrollTo(0, 0); }
  else location.hash = r;
}
window.addEventListener("hashchange", () => {
  route = parseRoute(location.hash);
  render();
  window.scrollTo(0, 0);
});

function newDraft() {
  const type = nextWorkoutType();
  return {
    type,
    startedAt: new Date().toISOString(),
    entries: WORKOUTS[type].map(ex => {
      const rec = recommend(ex);
      return { ex, weight: rec.weight, why: rec.why, fails: rec.fails, setReps: Array(EXERCISES[ex].sets).fill(null) };
    }),
  };
}

function saveDraft() { store.save("sl.draft", draft); }

/* ================= rendering ================= */

const app = document.getElementById("app");
const fmtKg = w => (w % 1 === 0 ? w : w.toFixed(1)) + " kg";
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const fmtClock = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function whyLabel(rec) {
  const fails = rec.fails || 0;
  switch (rec.why) {
    case "up": return "+weight — last session completed";
    case "repeat": return `attempt ${fails + 1} of ${DELOAD_AFTER} at this weight — deload after ${DELOAD_AFTER} fails`;
    case "deload": return `deload 10% — failed ${DELOAD_AFTER}× at this weight`;
    default: return "starting weight";
  }
}

function render() {
  app.innerHTML = (
    route === "#/stronglifts" ? (draft ? sessionHTML() : homeHTML())
    : route === "#/stronglifts/stats" ? statsHTML()
    : route === "#/weight" ? weightHTML()
    : route === "#/meals" ? mealsHTML()
    : route === "#/body" ? bodyHTML()
    : route === "#/awards" ? awardsHTML()
    : dashHTML()
  ) + tabbarHTML();
  updateBadge();
}

function appHeaderHTML(title, right, back = false) {
  return `<header>
    <div class="h-left">
      ${back ? `<button class="back" onclick="navigate('#/')" aria-label="Back to summary">‹</button>` : ""}
      <h1>${title}</h1>
    </div>
    ${right}
  </header>`;
}

function slHeaderHTML() {
  const right = draft
    ? `<span class="tag">5×5 log</span>`
    : `<nav class="tabs">
        <button class="tab ${route === "#/stronglifts" ? "active" : ""}" onclick="navigate('#/stronglifts')">Log</button>
        <button class="tab ${route === "#/stronglifts/stats" ? "active" : ""}" onclick="navigate('#/stronglifts/stats')">Stats</button>
      </nav>`;
  return appHeaderHTML("StrongLifts", right);
}

function homeHTML() {
  const type = nextWorkoutType();
  const rows = WORKOUTS[type].map(ex => {
    const def = EXERCISES[ex];
    const rec = recommend(ex);
    const cls = rec.why === "deload" ? "deload" : rec.why === "up" ? "up" : "";
    const attempt = rec.why === "repeat" ? `<span class="scheme">try ${rec.fails + 1}/${DELOAD_AFTER}</span>` : "";
    return `<div class="preview-row">
      <span class="ex">${def.name}<span class="scheme">${def.sets}×${def.reps}</span></span>
      <span class="kg ${cls}">${attempt}${fmtKg(rec.weight)}</span>
    </div>`;
  }).join("");

  const hist = sessions().slice().reverse();
  const histHTML = hist.length
    ? hist.map((s, ri) => {
        const idx = sessions().length - 1 - ri;
        const rows = s.entries.map(e => {
          const def = EXERCISES[e.ex];
          const ok = isSuccess(e);
          const reps = e.setReps.map(r => r === null ? "–" : r).join("/");
          return `<div class="hist-row">
            <span>${def.name} <span class="reps">@ ${fmtKg(e.weight)}</span></span>
            <span class="reps">${reps} <span class="${ok ? "ok" : "nok"}">${ok ? "✓" : "✗"}</span></span>
          </div>`;
        }).join("");
        return `<div class="hist-card">
          <div class="hist-head">
            <span class="badge">Workout <span class="letter">${s.type}</span></span>
            <span class="when">${fmtDate(s.startedAt)}</span>
          </div>
          ${rows}
          <button class="hist-del" onclick="deleteSession(${idx})">delete</button>
        </div>`;
      }).join("")
    : `<div class="empty">No sessions yet. Lift something heavy.</div>`;

  const pr = prBanner
    ? `<div class="pr-card">
        <div class="pr-title">🎆 New PR</div>
        <div class="pr-lifts">${prBanner.join(" · ")}</div>
      </div>`
    : "";
  prBanner = null;

  return `${slHeaderHTML()}
    ${pr}
    <div class="next-card" data-letter="${type}">
      <div class="kicker">Next up</div>
      <h2>Workout <span class="letter">${type}</span></h2>
      ${rows}
      <a class="video-link" href="${VIDEOS[type]}" target="_blank" rel="noopener"><span class="play">▶</span>Watch workout instructions</a>
    </div>
    <button class="btn btn-volt" onclick="startSession()">Start workout ${type}</button>
    <div class="section-title"><span>History</span><span>${hist.length} session${hist.length === 1 ? "" : "s"}</span></div>
    ${histHTML}`;
}

/* Plates per side for a total on a standard 20 kg bar; null = not loadable */
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
function plateBreakdown(total) {
  let side = (total - 20) / 2;
  if (side < 0) return null;
  const out = [];
  for (const p of PLATES) while (side >= p - 1e-9) { out.push(p); side -= p; }
  return side > 1e-9 ? null : out;
}

function plateLineHTML(weight) {
  if (weight < 20) return `<div class="hint" style="margin-top:-8px;">below the empty bar (20 kg)</div>`;
  const plates = plateBreakdown(weight);
  if (plates === null) return `<div class="hint" style="margin-top:-8px;">not loadable exactly with standard plates on a 20 kg bar</div>`;
  if (!plates.length) return `<div class="hint" style="margin-top:-8px;">empty bar — no plates</div>`;
  return `<div class="hint" style="margin-top:-8px;">per side: ${plates.join(" · ")} kg</div>`;
}

function sessionHTML() {
  const cards = draft.entries.map((e, i) => {
    const def = EXERCISES[e.ex];
    const sets = e.setReps.map((r, si) => {
      let cls = "", label = "–";
      if (r !== null) {
        label = r;
        cls = r === def.reps ? "done" : r === 0 ? "zero" : "partial";
      }
      return `<button class="set-btn ${cls}" onclick="tapSet(${i},${si})">${label}</button>`;
    }).join("");
    const hintCls = e.why === "deload" ? "deload" : e.why === "up" ? "up" : "";
    return `<div class="ex-card">
      <div class="ex-top">
        <h3>${def.name}</h3>
        <span class="scheme">${def.sets}×${def.reps}</span>
      </div>
      <div class="hint ${hintCls}">${whyLabel(e)}</div>
      <div class="weight-ctl">
        <button onclick="bumpWeight(${i},-2.5)" aria-label="decrease">−</button>
        <div class="wfield">
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" value="${e.weight}"
                 onchange="setWeight(${i}, this.value)">
          <span class="unit">KG</span>
        </div>
        <button onclick="bumpWeight(${i},2.5)" aria-label="increase">+</button>
      </div>
      ${plateLineHTML(e.weight)}
      ${warmupHTML(e, i)}
      <div class="sub-label">Work sets · ${def.sets}×${def.reps}</div>
      <div class="sets ${def.sets === 1 ? "single" : ""}">${sets}</div>
    </div>`;
  }).join("");

  return `${slHeaderHTML()}
    <div class="sess-head">
      <div class="kicker">${fmtDate(draft.startedAt)}</div>
      <h2>Workout <span class="letter">${draft.type}</span></h2>
      <a class="video-link" href="${VIDEOS[draft.type]}" target="_blank" rel="noopener"><span class="play">▶</span>Watch workout instructions</a>
    </div>
    ${cards}
    <div class="sess-actions">
      <button class="btn btn-volt" onclick="finishSession()">Finish &amp; save</button>
      <button class="btn btn-ghost" onclick="cancelSession()">Discard session</button>
      <div class="note">Tap a circle once for all reps, tap again to count down. Logging a set starts the rest timer. Progress is kept if you close the page.</div>
    </div>
    ${restBarHTML()}`;
}

/* ================= warm-up ================= */

/* StrongLifts warm-up: 2×5 empty bar (deadlift: 1×5 with light plates,
   no empty bar), then 10–20 kg jumps of 3 then 2 reps up to work weight. */
function warmupPlan(ex, work) {
  const isDL = ex === "deadlift";
  const base = isDL ? 40 : 20;
  if (work <= base) return [];
  const r25 = w => Math.round(w / 2.5) * 2.5;
  const rows = isDL ? [{ w: base, reps: 5 }] : [{ w: base, reps: 5 }, { w: base, reps: 5 }];
  const gap = work - base;
  const n = Math.max(1, Math.ceil(gap / 20));
  for (let i = 1; i < n; i++) {
    rows.push({ w: r25(base + (gap / n) * i), reps: i <= (n - 1) / 2 ? 3 : 2 });
  }
  return rows;
}

function warmupHTML(e, ei) {
  const plan = warmupPlan(e.ex, e.weight);
  let body;
  if (!plan.length) {
    body = `<div class="wu-none">${e.ex === "deadlift"
      ? "No warm-up needed — the deadlift starts loaded at 40 kg, and that is your work weight."
      : "No warm-up needed — your work weight is the empty bar, so the work sets are the warm-up."}</div>`;
  } else {
    body = `<div class="wu-sets">` + plan.map((row, ri) => {
      const checked = e.wu && e.wu[ri];
      return `<div class="wu-set ${checked ? "checked" : ""}">
        <button class="wu-btn" onclick="tapWarmup(${ei},${ri})">${row.reps}</button>
        <span class="wu-w">${row.w === 20 ? "bar only" : fmtKg(row.w)}</span>
      </div>`;
    }).join("") + `</div>`;
  }
  return `<div class="sub-label">Warm-up</div>${body}`;
}

function ensureWu(e) {
  const plan = warmupPlan(e.ex, e.weight);
  if (!e.wu || e.wu.length !== plan.length) e.wu = plan.map(() => false);
}

function tapWarmup(ei, ri) {
  const e = draft.entries[ei];
  ensureWu(e);
  e.wu[ri] = !e.wu[ri];
  saveDraft();
  render();
}

/* ================= rest timer ================= */

function restGuide() {
  // StrongLifts guideline: ~3 min between sets, 5 min after a failed set
  const t = draft.lastSet;
  if (t) {
    const e = draft.entries[t.ei];
    if (e) {
      const reps = e.setReps[t.si];
      if (reps !== null && reps < EXERCISES[e.ex].reps) return 300;
    }
  }
  return 180;
}

function restBarHTML() {
  if (!draft.rest) {
    return `<div class="rest-bar"><button class="rest-start" onclick="startRest()"><span class="play">▶</span>Start rest timer</button></div>`;
  }
  const sec = Math.max(0, Math.floor((Date.now() - draft.rest.start) / 1000));
  const over = sec > draft.rest.guide;
  return `<div class="rest-bar ${over ? "over" : ""}" id="rest-bar">
    <span class="rest-time" id="rest-elapsed">${fmtClock(sec)}</span>
    <span class="rest-msg" id="rest-msg">${over ? "too long — go lift" : "guide " + fmtClock(draft.rest.guide)}</span>
    <button class="rest-stop" onclick="stopRest()">Stop</button>
  </div>`;
}

/* Audio must be unlocked by a user gesture (iOS); armAudio is called from taps. */
let audioCtx = null;
function armAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch { /* no audio support */ }
}

function beep() {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t0 = audioCtx.currentTime;
  [0, 0.25].forEach(dt => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.12, t0 + dt);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dt + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + dt);
    osc.stop(t0 + dt + 0.2);
  });
}

/* ================= celebrations ================= */

function chime(kind) { // "tick" | "win" | "fanfare"
  if (!audioCtx || audioCtx.state !== "running") return;
  const notes = kind === "fanfare" ? [523, 659, 784, 1047] : kind === "win" ? [659, 988] : [880];
  const t0 = audioCtx.currentTime;
  notes.forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = f;
    const t = t0 + i * 0.11;
    gain.gain.setValueAtTime(kind === "tick" ? 0.05 : 0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.3);
  });
}

function confetti(n) {
  const colors = ["#30d158", "#ff9f0a", "#0a84ff", "#ff453a", "#ffd60a", "#bf5af2"];
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  for (let i = 0; i < n; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * 0.5 + "s";
    p.style.animationDuration = 1.2 + Math.random() * 1.2 + "s";
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 3200);
}

function celebrate(big) {
  armAudio();
  confetti(big ? 90 : 35);
  chime(big ? "fanfare" : "win");
  if (navigator.vibrate) navigator.vibrate(big ? [60, 40, 60] : 30);
}

/* Big bouncy overlay text, Candy Crush style. Queued so bursts play in sequence. */
const kudosQueue = [];
let kudosActive = false;

function kudos(main, sub = "", small = false) {
  if (small && kudosQueue.length >= 3) return; // rapid taps shouldn't build a parade
  kudosQueue.push({ main, sub, small });
  pumpKudos();
}

function pumpKudos() {
  if (kudosActive || !kudosQueue.length) return;
  kudosActive = true;
  const k = kudosQueue.shift();
  const el = document.createElement("div");
  el.className = "kudos" + (k.small ? " small" : "");
  el.innerHTML = `<div class="k-main">${k.main}</div>${k.sub ? `<div class="k-sub">${k.sub}</div>` : ""}`;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); kudosActive = false; pumpKudos(); }, k.small ? 850 : 1500);
}

/* Escalating hype ladder — later sets in a session earn bigger words */
const HYPE = ["Nice!", "Sweet!", "Strong!", "Smooth!", "Crushed it!", "Beast mode!", "Divine!", "LEGENDARY!"];
const hypeAt = i => HYPE[Math.min(i, HYPE.length - 1)];
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const MEAL_HYPE = ["Logged!", "Noted!", "Tracked!", "On it!", "Counted!"];

function lifetimeVol() {
  let v = 0;
  for (const s of sessions())
    for (const e of s.entries)
      for (const r of e.setReps) v += r * e.weight;
  return v;
}

/* Snapshot → act → juiceAfter: fires extra fanfares when a logging action
   crosses a milestone (lifetime tonne, level-up, weekly medal). */
function juiceSnapshot() {
  return {
    medal: medalFor(weeklyPoints()[weekKeyOf(new Date())] || 0),
    tonnes: Math.floor(lifetimeVol() / 1000),
  };
}

function juiceAfter(before) {
  const after = juiceSnapshot();
  if (after.tonnes > before.tonnes) {
    confetti(60);
    kudos(`${after.tonnes} tonnes!`, `WOW — you've now lifted ${fmtVolume(Math.round(lifetimeVol()))} in your lifetime`);
  }
  if (after.medal && after.medal !== before.medal) {
    kudos(`${after.medal} week!`, "weekly medal secured — see the shelf on your summary");
  }
}

function startRest() {
  armAudio();
  draft.rest = { start: Date.now(), guide: restGuide() };
  saveDraft();
  render();
}

function stopRest() {
  draft.rest = null;
  saveDraft();
  render();
}

function tickRest() {
  if (!draft || !draft.rest) return;
  const el = document.getElementById("rest-elapsed");
  if (!el) return;
  const sec = Math.max(0, Math.floor((Date.now() - draft.rest.start) / 1000));
  const over = sec > draft.rest.guide;
  el.textContent = fmtClock(sec);
  document.getElementById("rest-msg").textContent = over ? "too long — go lift" : "guide " + fmtClock(draft.rest.guide);
  document.getElementById("rest-bar").classList.toggle("over", over);
  if (over && !draft.rest.buzzed) {
    draft.rest.buzzed = true;
    saveDraft();
    if (navigator.vibrate) navigator.vibrate(200);
    beep();
  }
}
setInterval(tickRest, 500);

/* ================= stats ================= */

/* Per-exercise series oldest → newest: { weight, ok, date } */
function exerciseSeries(ex) {
  const out = [];
  for (const s of sessions())
    for (const e of s.entries)
      if (e.ex === ex) out.push({ weight: e.weight, ok: isSuccess(e), date: s.startedAt });
  return out;
}

/* Powerlifting total: squat + bench + deadlift, one point per session.
   A lift missing from a session carries over from the last session that had it;
   points start once all three lifts have been performed at least once. */
const TOTAL_LIFTS = ["squat", "bench", "deadlift"];

function totalSeries() {
  const latest = {};
  const out = [];
  for (const s of sessions()) {
    let ok = true;
    for (const e of s.entries) {
      if (TOTAL_LIFTS.includes(e.ex)) {
        latest[e.ex] = e.weight;
        if (!isSuccess(e)) ok = false;
      }
    }
    if (TOTAL_LIFTS.every(ex => latest[ex] !== undefined)) {
      const total = Math.round(TOTAL_LIFTS.reduce((sum, ex) => sum + latest[ex], 0) * 10) / 10;
      out.push({ weight: total, ok, date: s.startedAt });
    }
  }
  return out;
}

/* Total weight moved per session: every logged rep × its weight, all exercises */
function volumeSeries() {
  return sessions().map(s => {
    let vol = 0;
    for (const e of s.entries)
      for (const r of e.setReps) vol += r * e.weight;
    return { weight: Math.round(vol), ok: s.entries.every(isSuccess), date: s.startedAt };
  });
}

/* Warm-up volume for one entry. Ticked warm-ups count as recorded; if none
   were ticked but work sets were logged, assume the standard plan was done —
   that's how history back-fills, since the plan derives from the work weight. */
function entryWarmupVol(e) {
  const plan = warmupPlan(e.ex, e.weight);
  if (!plan.length) return 0;
  if (e.wu && e.wu.some(t => t))
    return plan.reduce((v, row, i) => v + (e.wu[i] ? row.w * row.reps : 0), 0);
  return e.setReps.some(r => r > 0)
    ? plan.reduce((v, row) => v + row.w * row.reps, 0)
    : 0;
}

const sessionWarmupVol = s => s.entries.reduce((v, e) => v + entryWarmupVol(e), 0);

/* Aligned with volumeSeries, one value per session */
function warmupSeries() {
  return sessions().map(s => ({ weight: Math.round(sessionWarmupVol(s)) }));
}

function fmtVolume(kg) {
  return kg >= 1000 ? (kg / 1000).toFixed(1).replace(/\.0$/, "") + " t" : kg + " kg";
}

/* Stocks/Health-style chart: gradient area under the line, hairline grid,
   axis labels on the right, dots for discrete samples (red ring = failed,
   orange ring = drinks-affected), optional dotted auxiliary series. */
let chartSeq = 0;
const CHART_FONT = `-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;

function chartSVG(pts, prIdx = -1, fmtLabel = w => w, aux = null, color = "#30d158") {
  const W = 320, H = 110, P = { l: 8, r: 44, t: prIdx >= 0 ? 26 : 12, b: 8 };
  const ws = pts.map(p => p.weight).concat(aux ? aux.map(a => a.weight) : []);
  let min = Math.min(...ws), max = Math.max(...ws);
  if (min === max) { min -= 2.5; max += 2.5; }
  const pad = (max - min) * 0.1;
  min -= pad; max += pad;
  const x = i => pts.length === 1 ? W / 2 : P.l + (W - P.l - P.r) * (i / (pts.length - 1));
  const y = w => P.t + (H - P.t - P.b) * (1 - (w - min) / (max - min));
  const gid = "cg" + (++chartSeq);

  const gridW = [Math.max(...ws), Math.min(...ws)];
  const grid = gridW.map(w => `
    <line x1="${P.l}" y1="${y(w)}" x2="${W - P.r + 4}" y2="${y(w)}" stroke="rgba(255,255,255,.09)" stroke-width="1"/>
    <text x="${W - P.r + 8}" y="${y(w) + 3}" text-anchor="start" fill="rgba(235,235,245,.5)" font-size="9" font-family="${CHART_FONT}">${fmtLabel(w)}</text>`).join("");

  const area = pts.length > 1
    ? `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity=".26"/>
        <stop offset="1" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="M ${pts.map((p, i) => `${x(i).toFixed(1)} ${y(p.weight).toFixed(1)}`).join(" L ")} L ${x(pts.length - 1).toFixed(1)} ${H - P.b} L ${x(0).toFixed(1)} ${H - P.b} Z" fill="url(#${gid})"/>`
    : "";
  const auxLine = aux && aux.length > 1 && aux.length === pts.length
    ? `<polyline points="${aux.map((a, i) => `${x(i)},${y(a.weight)}`).join(" ")}" fill="none" stroke="rgba(235,235,245,.4)" stroke-width="1.5" stroke-dasharray="2 4"/>`
    : "";
  const line = pts.length > 1
    ? `<polyline points="${pts.map((p, i) => `${x(i)},${y(p.weight)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
    : "";
  const dots = pts.map((p, i) => {
    const stroke = p.warn ? "#ff9f0a" : p.ok ? color : "#ff453a";
    const fill = p.warn || !p.ok ? "#1c1c1e" : color;
    return `<circle cx="${x(i)}" cy="${y(p.weight)}" r="3" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  }).join("");

  const pr = prIdx >= 0
    ? `<circle cx="${x(prIdx)}" cy="${y(pts[prIdx].weight)}" r="7" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="2 2"/>
       <text x="${x(prIdx)}" y="${y(pts[prIdx].weight) - 11}" text-anchor="middle" fill="${color}" font-size="9" font-weight="600" font-family="${CHART_FONT}">PR</text>`
    : "";

  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${area}${auxLine}${line}${dots}${pr}</svg>`;
}

/* Epley estimated 1RM from a 5-rep working weight */
const e1rm = (w, reps) => Math.round(w * (1 + reps / 30) * 10) / 10;

function statsHTML() {
  const all = sessions();
  let main;
  if (!all.length) {
    main = `<div class="empty">No workout data yet. Log a session first.</div>`;
  } else {
    let vol = 0, reps = 0;
    for (const s of all)
      for (const e of s.entries)
        for (const r of e.setReps) { reps += r; vol += r * e.weight; }

    const wuTotal = all.reduce((v, s) => v + sessionWarmupVol(s), 0);
    const tiles = `<div class="tiles">
      <div class="tile"><div class="num">${all.length}</div><div class="lbl">Sessions</div></div>
      <div class="tile"><div class="num">${fmtVolume(Math.round(vol))}</div><div class="lbl">Volume</div></div>
      <div class="tile"><div class="num">${fmtVolume(Math.round(wuTotal))}</div><div class="lbl">Warm-up</div></div>
      <div class="tile"><div class="num">${reps}</div><div class="lbl">Reps</div></div>
    </div>`;

    const charts = Object.keys(EXERCISES).map(ex => {
      const pts = exerciseSeries(ex);
      if (!pts.length) return "";
      const def = EXERCISES[ex];
      const cur = pts[pts.length - 1].weight;
      const okWeights = pts.filter(p => p.ok).map(p => p.weight);
      const bestOk = okWeights.length ? Math.max(...okWeights) : null;
      let prIdx = -1;
      if (bestOk !== null)
        for (let i = pts.length - 1; i >= 0; i--)
          if (pts[i].ok && pts[i].weight === bestOk) { prIdx = i; break; }
      const sub = bestOk !== null
        ? `PR ${fmtKg(bestOk)} · e1RM ~${fmtKg(e1rm(bestOk, def.reps))}`
        : `best ${fmtKg(Math.max(...pts.map(p => p.weight)))} (not completed)`;
      return `<div class="chart-card">
        <div class="chart-head">
          <h3>${def.name}</h3>
          <span class="cur">${fmtKg(cur)}<span class="best">${sub}</span></span>
        </div>
        ${chartSVG(pts, prIdx)}
        <div class="chart-dates">
          <span>${fmtDate(pts[0].date)}</span>
          <span>${pts.length} session${pts.length === 1 ? "" : "s"}</span>
          <span>${fmtDate(pts[pts.length - 1].date)}</span>
        </div>
      </div>`;
    }).join("");

    const totalPts = totalSeries();
    let totalCard = "";
    if (totalPts.length) {
      const cur = totalPts[totalPts.length - 1].weight;
      const okTotals = totalPts.filter(p => p.ok).map(p => p.weight);
      const bestOk = okTotals.length ? Math.max(...okTotals) : null;
      let prIdx = -1;
      if (bestOk !== null)
        for (let i = totalPts.length - 1; i >= 0; i--)
          if (totalPts[i].ok && totalPts[i].weight === bestOk) { prIdx = i; break; }
      const sub = bestOk !== null
        ? `PR ${fmtKg(bestOk)}`
        : `best ${fmtKg(Math.max(...totalPts.map(p => p.weight)))} (not completed)`;
      totalCard = `<div class="section-title"><span>Competition total · SQ + BP + DL</span></div>
      <div class="chart-card">
        <div class="chart-head">
          <h3>Total</h3>
          <span class="cur">${fmtKg(cur)}<span class="best">${sub}</span></span>
        </div>
        ${chartSVG(totalPts, prIdx)}
        <div class="chart-dates">
          <span>${fmtDate(totalPts[0].date)}</span>
          <span>${totalPts.length} session${totalPts.length === 1 ? "" : "s"}</span>
          <span>${fmtDate(totalPts[totalPts.length - 1].date)}</span>
        </div>
        <div class="wu-none" style="margin-top: 8px;">Combined working weight of squat, bench press and deadlift — the powerlifting total you compete with. A lift not in a session carries over from the last time you did it.</div>
      </div>`;
    }

    const volPts = volumeSeries();
    let volCard = "";
    if (volPts.length) {
      const cur = volPts[volPts.length - 1].weight;
      const best = Math.max(...volPts.map(p => p.weight));
      let bestIdx = -1;
      for (let i = volPts.length - 1; i >= 0; i--)
        if (volPts[i].weight === best) { bestIdx = i; break; }
      volCard = `<div class="section-title"><span>Weight moved per session</span></div>
      <div class="chart-card">
        <div class="chart-head">
          <h3>Session volume</h3>
          <span class="cur">${fmtVolume(cur)}<span class="best">best ${fmtVolume(best)}</span></span>
        </div>
        ${chartSVG(volPts, bestIdx, w => (w / 1000).toFixed(1) + " t", warmupSeries())}
        <div class="chart-dates">
          <span>${fmtDate(volPts[0].date)}</span>
          <span>${volPts.length} session${volPts.length === 1 ? "" : "s"}</span>
          <span>${fmtDate(volPts[volPts.length - 1].date)}</span>
        </div>
        <div class="wu-none" style="margin-top: 8px;">Total weight moved in each workout — every logged rep × its weight. The dotted line is your warm-up sets: you lift that weight too.</div>
      </div>`;
    }

    main = `${tiles}
      ${totalCard}
      ${volCard}
      <div class="section-title"><span>Working weight over time</span></div>
      ${charts}`;
  }

  return `${slHeaderHTML()}
    ${main}`;
}

/* ================= dashboard ================= */

/* Fitness-style weekly activity rings: workouts, weigh-in days, win days */
function ringsSVG(fracs) {
  const size = 128, c = size / 2;
  const ring = (radius, frac, color) => {
    const circ = 2 * Math.PI * radius;
    return `<circle cx="${c}" cy="${c}" r="${radius}" fill="none" stroke="${color}" stroke-opacity=".16" stroke-width="13"/>
      <circle cx="${c}" cy="${c}" r="${radius}" fill="none" stroke="${color}" stroke-width="13" stroke-linecap="round"
        stroke-dasharray="${(Math.max(.001, Math.min(1, frac)) * circ).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`;
  };
  return `<svg viewBox="0 0 ${size} ${size}" class="rings">${ring(55, fracs[0], "#30d158")}${ring(40, fracs[1], "#0a84ff")}${ring(25, fracs[2], "#ff9f0a")}</svg>`;
}

const RING_GOALS = { workouts: 3, weighins: 5, wins: 5 };

function weekRingStats() {
  const wk = weekKeyOf(new Date());
  const cfg = mealsCfg(), days = mealDays();
  return {
    workouts: sessions().filter(s => weekKeyOf(s.startedAt) === wk).length,
    weighins: new Set(bodyweights().filter(b => weekKeyOf(b.date) === wk).map(b => dayKeyOf(b.date))).size,
    wins: Object.keys(days).filter(k => weekKeyOf(parseDayKey(k)) === wk && dayKcal(days[k], cfg) <= cfg.budget).length,
  };
}

function ringsCardHTML() {
  const r = weekRingStats();
  const stat = (label, val, goal, color) =>
    `<div class="ring-stat"><span class="r-lbl">${label}</span><span class="r-val" style="color:${color};">${val}<span class="r-goal">/${goal}</span></span></div>`;
  return `<div class="chart-card" id="rings-card">
    <div class="rings-row">
      ${ringsSVG([r.workouts / RING_GOALS.workouts, r.weighins / RING_GOALS.weighins, r.wins / RING_GOALS.wins])}
      <div class="ring-stats">
        ${stat("Workouts", r.workouts, RING_GOALS.workouts, "#30d158")}
        ${stat("Weigh-in days", r.weighins, RING_GOALS.weighins, "#0a84ff")}
        ${stat("Win days", r.wins, RING_GOALS.wins, "#ff9f0a")}
      </div>
    </div>
  </div>`;
}

function dashHTML() {
  const all = sessions();
  const bw = bodyweights();

  let vol = 0;
  for (const s of all)
    for (const e of s.entries)
      for (const r of e.setReps) vol += r * e.weight;

  const b = bmi();
  const bmiTile = b !== null
    ? `<div class="tile"><div class="num">${b}</div><div class="lbl">BMI</div></div>`
    : `<div class="tile tap" onclick="navigate('#/weight')"><div class="num">–</div><div class="lbl">BMI · set height</div></div>`;
  const tiles = `<div class="tiles">
    <div class="tile"><div class="num">${fmtVolume(Math.round(vol))}</div><div class="lbl">Lifted</div></div>
    <div class="tile"><div class="num">${bw.length ? bw[bw.length - 1].kg : "–"}</div><div class="lbl">Weight kg</div></div>
    ${bmiTile}
    <div class="tile"><div class="num">${all.length}</div><div class="lbl">Workouts</div></div>
  </div>`;

  const volPts = volumeSeries();
  const lifted = volPts.length ? `<div class="chart-card tap" onclick="navigate('#/stronglifts/stats')">
    <div class="chart-head">
      <h3 style="color:#30d158;">Weight Lifted</h3>
      <span class="cur">${fmtVolume(volPts[volPts.length - 1].weight)}<span class="best">last workout</span><span class="card-chev">›</span></span>
    </div>
    ${volPts.length > 1 ? chartSVG(volPts, -1, w => (w / 1000).toFixed(1) + " t", warmupSeries()) : ""}
    <div class="chart-dates"><span>— work sets</span><span>┄ warm-up sets</span></div>
  </div>` : "";

  const bwPts = bwSeries();
  const logged = bwPts.length ? `<div class="chart-card tap" onclick="navigate('#/weight')">
    <div class="chart-head">
      <h3 style="color:#0a84ff;">Weight Logged</h3>
      <span class="cur">${fmtKg(bwPts[bwPts.length - 1].weight)}<span class="best">bodyweight</span><span class="card-chev">›</span></span>
    </div>
    ${bwPts.length > 1 ? chartSVG(bwPts, -1, w => w, null, "#0a84ff") : ""}
  </div>` : "";

  const mealPts = mealsSeries();
  const calories = mealPts.length ? `<div class="chart-card tap" onclick="navigate('#/meals')">
    <div class="chart-head">
      <h3 style="color:#ff9f0a;">Calories</h3>
      <span class="cur">${mealPts[mealPts.length - 1].weight} kcal<span class="best">${mealPts.filter(p => p.ok).length} ⭐ win days</span><span class="card-chev">›</span></span>
    </div>
    ${mealPts.length > 1 ? chartSVG(mealPts, -1, w => w, null, "#ff9f0a") : ""}
  </div>` : "";

  const waistPts = measSeries("waist");
  const waist = waistPts.length ? `<div class="chart-card tap" onclick="navigate('#/body')">
    <div class="chart-head">
      <h3 style="color:#bf5af2;">Waist</h3>
      <span class="cur">${waistPts[waistPts.length - 1].weight} cm<span class="best">${fmtDelta(seriesChange(waistPts, 30))} in 30 days</span><span class="card-chev">›</span></span>
    </div>
    ${waistPts.length > 1 ? chartSVG(waistPts, -1, w => w, null, "#bf5af2") : ""}
  </div>` : "";

  const analytics = (lifted || logged || calories || waist)
    ? lifted + logged + calories + waist
    : `<div class="chart-card"><div class="wu-none">Nothing to show yet — log a workout in StrongLifts, a weigh-in in Weight or a meal in Meals, and your combined analytics appear here.</div></div>`;

  const nudges = dueNudges();
  const nudgeBanner = nudges.length
    ? `<div class="section-title"><span>Due today</span></div>
      <div class="chart-card" id="nudges">${nudges.map(n => `<div class="tog-row" onclick="navigate('${n.route}')">
        <span><span class="t-name">${n.name}</span><br><span class="t-sub">${n.sub}</span></span>
        <span class="t-sub">→</span>
      </div>`).join("")}</div>`
    : "";

  const dateKick = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }).toUpperCase();
  return `<header>
      <div>
        <div class="kicker-date">${dateKick}</div>
        <h1>Summary</h1>
      </div>
    </header>
    ${ringsCardHTML()}
    ${tiles}
    ${nudgeBanner}
    ${progressCardHTML()}
    <div class="section-title"><span>Across your apps</span></div>
    ${analytics}
    ${recapCardHTML()}
    ${remindersCardHTML()}
    <div class="section-title"><span>Your data</span></div>
    <div class="chart-card">
      <div class="wu-none">All app data is stored on this device and browser only. Copy a backup here, then import it in another browser — for example to move your history into the home-screen app.</div>
      <div class="data-actions">
        <button onclick="exportData()">Copy backup</button>
        <button onclick="importData()">Import backup</button>
      </div>
    </div>`;
}

/* ---------- backup / transfer ---------- */

async function exportData() {
  const payload = JSON.stringify({
    app: "stronglifts-log",
    exportedAt: new Date().toISOString(),
    sessions: sessions(),
    bw: bodyweights(),
    height: heightCm(),
    goal: goalKg(),
    raceStart: store.load("sl.raceStart", null),
    meals: mealDays(),
    mealsCfg: store.load("sl.mealsCfg", null),
    chests: store.load("sl.chests", null),
    meas: measurements(),
  });
  try {
    await navigator.clipboard.writeText(payload);
    alert("Backup copied to clipboard.\n\nOpen the app in the other browser, go to Summary and tap Import backup.");
  } catch {
    prompt("Clipboard unavailable — copy this backup text manually:", payload);
  }
}

async function importData() {
  let raw = null;
  try { raw = await navigator.clipboard.readText(); } catch { /* fall through to prompt */ }
  if (!raw || !raw.trim().startsWith("{")) raw = prompt("Paste your backup here:");
  if (!raw) return;

  let data;
  try { data = JSON.parse(raw); } catch { data = null; }
  if (!data || !Array.isArray(data.sessions)) {
    alert("That doesn't look like a backup — nothing was imported.");
    return;
  }

  // Merge by union, never overwrite: sessions keyed by startedAt, bodyweight by date
  const all = sessions();
  const seen = new Set(all.map(s => s.startedAt));
  let addedSessions = 0;
  for (const s of data.sessions) {
    if (s && s.startedAt && Array.isArray(s.entries) && !seen.has(s.startedAt)) {
      all.push(s);
      seen.add(s.startedAt);
      addedSessions++;
    }
  }
  all.sort((a, b) => new Date(a.startedAt) - new Date(b.startedAt));
  store.save("sl.sessions", all);

  const bw = bodyweights();
  const seenBw = new Set(bw.map(b => b.date));
  let addedBw = 0;
  for (const b of (Array.isArray(data.bw) ? data.bw : [])) {
    if (b && b.date && typeof b.kg === "number" && !seenBw.has(b.date)) {
      bw.push(b);
      seenBw.add(b.date);
      addedBw++;
    }
  }
  bw.sort((a, b) => new Date(a.date) - new Date(b.date));
  store.save("sl.bw", bw);

  if (typeof data.height === "number" && !heightCm()) store.save("sl.height", data.height);
  if (typeof data.goal === "number" && !goalKg()) store.save("sl.goal", data.goal);
  if (typeof data.raceStart === "string" && !localStorage.getItem("sl.raceStart")) store.save("sl.raceStart", data.raceStart);

  if (data.meals && typeof data.meals === "object") {
    const days = mealDays();
    let added = 0;
    for (const k of Object.keys(data.meals)) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && !days[k]) { days[k] = data.meals[k]; added++; }
    }
    if (added) store.save("sl.meals", days);
  }
  if (data.mealsCfg && !localStorage.getItem("sl.mealsCfg")) store.save("sl.mealsCfg", data.mealsCfg);
  if (data.chests && !localStorage.getItem("sl.chests")) store.save("sl.chests", data.chests);

  if (Array.isArray(data.meas)) {
    const ms = measurements();
    const seenMs = new Set(ms.map(m => m.date));
    let addedMs = 0;
    for (const m of data.meas) {
      if (m && m.date && !seenMs.has(m.date)) { ms.push(m); addedMs++; }
    }
    if (addedMs) {
      ms.sort((a, b) => new Date(a.date) - new Date(b.date));
      store.save("sl.meas", ms);
    }
  }

  render();
  alert(`Import complete: ${addedSessions} new session${addedSessions === 1 ? "" : "s"}, ${addedBw} new bodyweight entr${addedBw === 1 ? "y" : "ies"}.`);
}

/* ================= weight app ================= */

const bodyweights = () => store.load("sl.bw", []); // oldest first: { date, kg }
const heightCm = () => store.load("sl.height", null);

/* BMI from the latest weigh-in; null until height and a weigh-in exist */
function bmi() {
  const h = heightCm(), bw = bodyweights();
  if (!h || !bw.length) return null;
  return Math.round(bw[bw.length - 1].kg / ((h / 100) ** 2) * 10) / 10;
}

function saveHeight() {
  const inp = document.getElementById("height-input");
  const h = parseFloat(String(inp.value).replace(",", "."));
  if (isNaN(h) || h < 50 || h > 250) { inp.focus(); return; }
  store.save("sl.height", Math.round(h));
  render();
}

const goalKg = () => store.load("sl.goal", null);

function saveGoal() {
  const inp = document.getElementById("goal-input");
  const g = parseFloat(String(inp.value).replace(",", "."));
  if (isNaN(g) || g <= 0) { inp.focus(); return; }
  store.save("sl.goal", Math.round(g * 10) / 10);
  render();
}

/* Goal, pace over the trailing ~4 weeks, and a projected arrival date */
function goalCardHTML(bw) {
  const goal = goalKg();
  if (!goal || !bw.length) return "";
  const cur = bw[bw.length - 1].kg;
  const left = Math.round((cur - goal) * 10) / 10;
  const d28 = bwChange(bw, 28);
  const pace = d28 === null ? null : Math.round(d28 / 4 * 100) / 100; // kg/week
  let eta;
  if (left <= 0) eta = "Goal reached — you're in maintenance territory. 🎉";
  else if (pace === null) eta = "Log a few more weeks of weigh-ins to project an arrival date.";
  else if (pace >= -0.05) eta = "No downward trend right now — the ETA needs a losing pace. Tomorrow is a fresh day.";
  else {
    const weeks = left / -pace;
    const dt = new Date(Date.now() + weeks * 7 * 86400000);
    eta = `≈ ${Math.round(weeks)} week${Math.round(weeks) === 1 ? "" : "s"} at this pace — around ${dt.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" })}.`;
  }
  return `<div class="chart-card">
    <div class="chart-head">
      <h3 style="color:#0a84ff;">Goal ${fmtKg(goal)}</h3>
      <span class="cur">${left > 0 ? left + " kg left" : "reached 🎉"}<span class="best">${pace !== null ? (pace > 0 ? "+" : "") + pace + " kg/week" : "pace –"}</span></span>
    </div>
    <div class="wu-none">${eta}</div>
  </div>`;
}

/* Change vs the last entry at least `days` days older than the newest; null if history is shorter */
function bwChange(bw, days) {
  const cutoff = new Date(bw[bw.length - 1].date).getTime() - days * 86400000;
  let base = null;
  for (const b of bw) {
    if (new Date(b.date).getTime() <= cutoff) base = b;
    else break;
  }
  return base ? Math.round((bw[bw.length - 1].kg - base.kg) * 10) / 10 : null;
}

const fmtDelta = d => d === null ? "–" : d === 0 ? "±0" : (d > 0 ? "+" : "") + d;

function dayKeyOf(dateLike) {
  const d = new Date(dateLike);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

/* Bodyweight points, with weigh-ins up to two days after a Drinks day (from
   the meals app) flagged warn — drinks make the scale wobble before it settles. */
function bwSeries() {
  const drinks = drinkDayKeys();
  return bodyweights().map(b => {
    let warn = false;
    for (let off = 0; off <= 2 && !warn; off++) {
      const d = new Date(b.date);
      d.setDate(d.getDate() - off);
      if (drinks.has(dayKeyOf(d))) warn = true;
    }
    return { weight: b.kg, ok: true, warn, date: b.date };
  });
}

function ghostSeries(g) {
  const t0 = parseDayKey(g.w[0][0]).getTime();
  const kg0 = g.w[0][1];
  return g.w.map(([d, kg]) => ({
    day: Math.round((parseDayKey(d).getTime() - t0) / 86400000),
    loss: Math.round((kg0 - kg) * 100) / 100,
  }));
}

/* Your current run: day 0 = first weigh-in of the run. Starting a new run
   makes the race restart from the next weigh-in — regimes get restarted. */
const raceStart = () => store.load("sl.raceStart", null);

function startNewRun() {
  if (!confirm("Start a new run? The ghost race resets — your next weigh-in becomes day 0. History stays untouched.")) return;
  store.save("sl.raceStart", new Date().toISOString());
  render();
}

function raceCurSeries() {
  const rs = raceStart();
  const bw = rs ? bodyweights().filter(b => b.date >= rs) : bodyweights();
  if (bw.length < 2) return [];
  const t0 = new Date(bw[0].date).getTime();
  return bw.map(b => ({
    day: Math.max(0, Math.round((new Date(b.date).getTime() - t0) / 86400000)),
    loss: Math.round((bw[0].kg - b.kg) * 100) / 100,
  }));
}

function ghostLossAt(ghost, day) {
  if (day <= 0) return 0;
  if (day >= ghost[ghost.length - 1].day) return null; // beyond the ghost's run
  let prev = ghost[0];
  for (const p of ghost) {
    if (p.day >= day) {
      const span = p.day - prev.day || 1;
      return prev.loss + (p.loss - prev.loss) * ((day - prev.day) / span);
    }
    prev = p;
  }
  return null;
}

function raceSVG(cur, ghost) {
  const W = 320, H = 140, P = { l: 36, r: 10, t: 10, b: 18 };
  const maxDay = Math.max(ghost[ghost.length - 1].day, cur.length ? cur[cur.length - 1].day : 0, 7);
  const losses = [...ghost.map(p => p.loss), ...cur.map(p => p.loss)];
  const top = Math.max(...losses, 1);
  const maxLoss = top * 1.08;
  const minLoss = Math.min(0, ...losses);
  const x = d => P.l + (W - P.l - P.r) * (d / maxDay);
  const y = l => P.t + (H - P.t - P.b) * (1 - (l - minLoss) / (maxLoss - minLoss));
  const line = (pts, attrs) => `<polyline points="${pts.map(p => `${x(p.day).toFixed(1)},${y(p.loss).toFixed(1)}`).join(" ")}" fill="none" ${attrs}/>`;
  const paceEnd = Math.min(maxDay, maxLoss / 0.1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    <line x1="${P.l}" y1="${y(0)}" x2="${W - P.r}" y2="${y(0)}" stroke="rgba(255,255,255,.09)" stroke-width="1"/>
    <text x="${P.l - 5}" y="${y(top) + 3}" text-anchor="end" fill="rgba(235,235,245,.5)" font-size="9" font-family="${CHART_FONT}">−${top.toFixed(1)}</text>
    <text x="${P.l - 5}" y="${y(0) + 3}" text-anchor="end" fill="rgba(235,235,245,.5)" font-size="9" font-family="${CHART_FONT}">0</text>
    <text x="${W - P.r}" y="${H - 4}" text-anchor="end" fill="rgba(235,235,245,.5)" font-size="9" font-family="${CHART_FONT}">day ${maxDay}</text>
    <polyline points="${x(0)},${y(0)} ${x(paceEnd).toFixed(1)},${y(paceEnd * 0.1).toFixed(1)}" fill="none" stroke="#ff9f0a" stroke-width="1" stroke-dasharray="2 4"/>
    ${line(ghost, 'stroke="rgba(235,235,245,.4)" stroke-width="1.5" stroke-dasharray="5 4"')}
    ${cur.length ? line(cur, 'stroke="#30d158" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"') : ""}
  </svg>`;
}

function raceCardHTML() {
  const key = GHOSTS[ghostChoice()] ? ghostChoice() : "2022";
  const g = GHOSTS[key];
  const gpts = ghostSeries(g);
  const cur = raceCurSeries();
  const gLast = gpts[gpts.length - 1];

  let status;
  if (!cur.length) {
    status = "Log at least two weigh-ins and your curve races the ghost from day 0.";
  } else {
    const you = cur[cur.length - 1];
    const gl = ghostLossAt(gpts, you.day);
    if (gl === null) {
      status = `The ${key} ghost finished at −${gLast.loss} kg on day ${gLast.day}; you're on day ${you.day} at −${you.loss} kg. The track is yours now.`;
    } else {
      const diff = Math.round((you.loss - gl) * 10) / 10;
      status = diff >= 0
        ? `Day ${you.day}: you're ${diff} kg ahead of ${key}-you 👻 — keep it up.`
        : `Day ${you.day}: ${-diff} kg behind ${key}-you 👻 — the ghost averaged ${(gLast.loss / (gLast.day / 7)).toFixed(1)} kg/week.`;
    }
  }

  const picker = Object.keys(GHOSTS).map(k =>
    `<button class="${k === key ? "active" : ""}" onclick="pickGhost('${k}')">${k}</button>`).join("");

  return `<div class="section-title"><span>Ghost race · vs ${g.label}</span></div>
    <div class="chart-card">
      ${raceSVG(cur, gpts)}
      <div class="chart-dates">
        <span style="color:#30d158;">— you</span>

function logBodyweight() {
  const inp = document.getElementById("bw-input");
  const w = parseFloat(inp.value.replace(",", "."));
  if (isNaN(w) || w <= 0) { inp.focus(); return; }
  const bw = bodyweights();
  const now = new Date().toISOString();
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  const entry = { date: now, kg: Math.round(w * 10) / 10 };
  const before = juiceSnapshot();
  const prevKg = bw.length ? bw[bw.length - 1].kg : null;
  const wasMin = bw.length ? Math.min(...bw.map(b => b.kg)) : Infinity;
  if (bw.length && sameDay(bw[bw.length - 1].date, now)) bw[bw.length - 1] = entry;
  else bw.push(entry);
  store.save("sl.bw", bw);
  armAudio();
  chime("tick");
  if (navigator.vibrate) navigator.vibrate(15);
  const delta = prevKg === null ? null : Math.round((entry.kg - prevKg) * 10) / 10;
  const deltaTxt = delta === null ? "" : delta === 0 ? "same as last time" : `${delta > 0 ? "+" : ""}${delta} kg vs last`;
  const goal = goalKg();
  if (goal && entry.kg <= goal && (prevKg === null || prevKg > goal)) {
    celebrate(true);
    kudos("🎉 Goal!", `${fmtKg(entry.kg)} — you made it to ${fmtKg(goal)}`);
  } else if (entry.kg < wasMin && bw.length >= 5) {
    celebrate(true);
    kudos("New low!", `${fmtKg(entry.kg)} — lightest ever logged`);
  } else {
    kudos("Logged!", deltaTxt || "first entry on the books", true);
  }
  juiceAfter(before);
  render();
}

function deleteBwEntry(idx) {
  const bw = bodyweights();
  if (!bw[idx] || !confirm(`Remove the entry from ${fmtDate(bw[idx].date)}?`)) return;
  bw.splice(idx, 1);
  store.save("sl.bw", bw);
  render();
}

/* ================= meals app ================= */

/* No exact calories — each slot carries a rough estimate. Days are keyed
   "YYYY-MM-DD" (local); unlogged days simply don't exist, and that's fine. */
const MEAL_SLOTS = [
  { key: "b",  name: "Breakfast" },
  { key: "l",  name: "Lunch" },
  { key: "f",  name: "Fika" },
  { key: "d",  name: "Dinner" },
  { key: "dr", name: "Drinks" },
];
const SNACK_MAX = 5;

/* Merged with defaults so saved configs pick up newly added slots */
const MEALS_CFG_DEFAULTS = { budget: 2500, b: 500, l: 700, f: 300, d: 900, dr: 200, sn: 150 };
const mealsCfg = () => ({ ...MEALS_CFG_DEFAULTS, ...store.load("sl.mealsCfg", {}) });
const mealDays = () => store.load("sl.meals", {}); // { "YYYY-MM-DD": { b, l, d, dr, sn } }

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dayKcal(day, cfg = mealsCfg()) {
  return MEAL_SLOTS.reduce((sum, s) => sum + (day[s.key] ? cfg[s.key] : 0), 0) + (day.sn || 0) * cfg.sn;
}

/* Oldest → newest; ok = stayed within budget (a "win day") */
function mealsSeries() {
  const cfg = mealsCfg(), days = mealDays();
  return Object.keys(days).sort().map(k => {
    const kcal = dayKcal(days[k], cfg);
    return { weight: kcal, ok: kcal <= cfg.budget, date: k };
  });
}

/* Sporadic logging is expected — so yesterday stays editable for backfill */
let mealsYesterday = false;
const mealsKey = () => mealsYesterday ? dayKeyOf(new Date(Date.now() - 86400000)) : todayKey();
function mealsPick(y) { mealsYesterday = y; render(); }

function editMealDay(mutate) {
  const days = mealDays(), t = mealsKey();
  const day = days[t] || {};
  const cfg = mealsCfg();
  const wasSecured = !!day.d && dayKcal(day, cfg) <= cfg.budget;
  mutate(day);
  if (Object.values(day).some(v => v)) days[t] = day;
  else delete days[t]; // everything unticked again — day was never logged
  store.save("sl.meals", days);
  render();
  // Dinner ticked with budget intact = the day's star is secured; occasionally jackpot-sized
  const secured = !!day.d && dayKcal(day, cfg) <= cfg.budget;
  if (secured && !wasSecured) {
    celebrate(Math.random() < 1 / 8);
    const left = cfg.budget - dayKcal(day, cfg);
    kudos("⭐ Win day!", `dinner banked with ${left} kcal to spare${isBonusDay(mealsKey()) ? " · 🎰 counts double this week!" : ""}`);
  }
}

function toggleMeal(key) {
  const before = juiceSnapshot();
  let added = false;
  editMealDay(d => { d[key] = d[key] ? 0 : 1; added = !!d[key]; });
  if (added) { armAudio(); chime("tick"); kudos(pickOne(MEAL_HYPE), "", true); }
  juiceAfter(before);
}

function tapSnack() {
  const before = juiceSnapshot();
  let n = 0;
  editMealDay(d => { d.sn = ((d.sn || 0) + 1) % (SNACK_MAX + 1); n = d.sn; });
  if (n) { armAudio(); chime("tick"); kudos(`Snack ×${n}`, "", true); }
  juiceAfter(before);
}

function saveMealsCfg() {
  const cfg = mealsCfg();
  for (const [id, key] of [["cfg-budget", "budget"], ["cfg-b", "b"], ["cfg-l", "l"], ["cfg-f", "f"], ["cfg-d", "d"], ["cfg-dr", "dr"], ["cfg-sn", "sn"]]) {
    const v = parseInt(document.getElementById(id).value, 10);
    if (!isNaN(v) && v > 0) cfg[key] = v;
  }
  store.save("sl.mealsCfg", cfg);
  render();
}

/* Day-keys with drinks logged — bodyweight wobbles for a few days after these */
function drinkDayKeys() {
  const days = mealDays();
  return new Set(Object.keys(days).filter(k => days[k].dr));
}

function mealsHTML() {
  const cfg = mealsCfg();
  const days = mealDays();
  const day = days[mealsKey()] || {};
  const kcal = dayKcal(day, cfg);
  const left = cfg.budget - kcal;
  const logged = Object.values(day).some(v => v);
  const pct = Math.min(100, Math.round(kcal / cfg.budget * 100));
  const level = kcal > cfg.budget ? "over" : kcal >= cfg.budget * 0.8 ? "warn" : "ok";

  const slotBtns = MEAL_SLOTS.map(s => `<button class="meal-btn ${day[s.key] ? "on" : ""}" onclick="toggleMeal('${s.key}')">
      ${s.name}<span class="kc">~${cfg[s.key]} kcal</span>
    </button>`).join("");

  let statusLine;
  if (!logged) statusLine = "Nothing ticked yet — skipping breakfast already puts you ahead.";
  else if (left < 0) statusLine = `Over budget by ${-left} kcal — tomorrow is a fresh day.`;
  else if (level === "warn") statusLine = `Getting close — ${left} kcal left. A light dinner keeps the ⭐.`;
  else if (!day.b) statusLine = `⭐ On track for a win day — breakfast skipped leaves room for dinner.`;
  else statusLine = `⭐ On track for a win day.`;

  const series = mealsSeries();
  const wins = series.filter(p => p.ok).length;
  const tiles = `<div class="tiles">
    <div class="tile"><div class="num ${level === "over" ? "nok" : ""}">${left >= 0 ? left : "+" + -left}</div><div class="lbl">kcal ${left >= 0 ? "left today" : "over today"}</div></div>
    <div class="tile"><div class="num">${wins} ⭐</div><div class="lbl">Win days</div></div>
    <div class="tile"><div class="num">${series.length}</div><div class="lbl">Days logged</div></div>
  </div>`;

  const chart = series.length > 1 ? `<div class="section-title"><span>Calories per logged day</span></div>
    <div class="chart-card">
      ${chartSVG(series, -1, w => w, null, "#ff9f0a")}
      <div class="chart-dates">
        <span>${fmtDate(series[0].date)}</span>
        <span>green ⭐ under · red over budget</span>
        <span>${fmtDate(series[series.length - 1].date)}</span>
      </div>
    </div>` : "";

  const histRows = Object.keys(days).sort().reverse().slice(0, 14).map(k => {
    const d = days[k], dk = dayKcal(d, cfg), win = dk <= cfg.budget;
    const parts = MEAL_SLOTS.filter(s => d[s.key]).map(s => s.name === "Drinks" ? "Drinks" : s.name[0]);
    if (d.sn) parts.push("S×" + d.sn);
    return `<div class="hist-row">
      <span>${fmtDate(k)}</span>

   Everything derives from logged data, never stored — history back-fills. */

const parseDayKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };

/* Mystery ×2 days: deterministic date hash, ~1 day in 8. Deterministic so
   history scores consistently and a reload can't reroll today. */
function hashStr(s) {
  let h = 0;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0;
  return Math.abs(h);
}
const isBonusDay = k => hashStr("hl" + k) % 8 === 0;

function winCount() {
  const cfg = mealsCfg(), days = mealDays();
  return Object.keys(days).filter(k => dayKcal(days[k], cfg) <= cfg.budget).length;
}

const chestsReady = () => Math.floor(winCount() / 5) - chestState().opened;

function openChest() {

/* Monday day-key of the week a date falls in */
function weekKeyOf(dateLike) {
  const d = new Date(dateLike);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return dayKeyOf(d);
}

/* Weekly medal points; a win day on a 🎰 mystery day counts double */
const MEDAL_PTS = { workout: 20, win: 15, weighin: 5 };
const winPoints = k => MEDAL_PTS.win * (isBonusDay(k) ? 2 : 1);

function weeklyPoints() {
  const pts = {};
  const add = (k, v) => { pts[k] = (pts[k] || 0) + v; };
  for (const s of sessions()) add(weekKeyOf(s.startedAt), MEDAL_PTS.workout);
  for (const b of bodyweights()) add(weekKeyOf(b.date), MEDAL_PTS.weighin);
  const cfg = mealsCfg(), days = mealDays();
  for (const k of Object.keys(days))
    if (dayKcal(days[k], cfg) <= cfg.budget) add(weekKeyOf(parseDayKey(k)), winPoints(k));
  return pts;
}

const MEDALS = [{ pts: 100, icon: "🥇" }, { pts: 60, icon: "🥈" }, { pts: 30, icon: "🥉" }];
const medalFor = p => (MEDALS.find(m => p >= m.pts) || {}).icon || null;
