/* All achievements are derived from logged data — nothing to store, nothing to lose. */
function achCtx() {
  const best = {};
  let vol = 0;
  const all = sessions();
  for (const s of all)
    for (const e of s.entries) {
      for (const r of e.setReps) vol += r * e.weight;
      if (isSuccess(e)) best[e.ex] = Math.max(best[e.ex] || 0, e.weight);
    }
  const cfg = mealsCfg(), days = mealDays();
  const keys = Object.keys(days).sort();
  let wins = 0, fikaWins = 0, bounce = 0, prevOver = false;
  const weekWins = {};
  for (const k of keys) {
    const win = dayKcal(days[k], cfg) <= cfg.budget;
    if (win) {
      wins++;
      if (days[k].f) fikaWins++;
      if (prevOver) bounce++;
      const wk = weekKeyOf(parseDayKey(k));
      weekWins[wk] = (weekWins[wk] || 0) + 1;
    }
    prevOver = !win;
  }
  const golds = Object.values(weeklyPoints()).filter(p => p >= 100).length;
  return {
    best, vol, sessions: all.length, wins, weighins: bodyweights().length,
    fikaWins, bounce, golds, bestWeekWins: Math.max(0, ...Object.values(weekWins)),
  };
}

/* Change vs the last point at least `days` older than the newest */
function seriesChange(pts, days) {
  if (!pts.length) return null;
  const cutoff = new Date(pts[pts.length - 1].date).getTime() - days * 86400000;
  let base = null;
  for (const p of pts) {
    if (new Date(p.date).getTime() <= cutoff) base = p;
    else break;
  }
  return base ? Math.round((pts[pts.length - 1].weight - base.weight) * 10) / 10 : null;
}

function logMeasurements() {
  const vals = {};
  let any = false;
  for (const f of MEAS_FIELDS) {
    const v = parseFloat(String(document.getElementById("ms-" + f.key).value).replace(",", "."));
    if (!isNaN(v) && v > 0) { vals[f.key] = Math.round(v * 10) / 10; any = true; }
  }
  if (!any) return;
  const ms = measurements();
  const now = new Date().toISOString();
  if (ms.length && new Date(ms[ms.length - 1].date).toDateString() === new Date(now).toDateString())
    Object.assign(ms[ms.length - 1], vals, { date: now });
  else ms.push({ date: now, ...vals });
  store.save("sl.meas", ms);
  armAudio();
  chime("tick");
  kudos("Measured!", MEAS_FIELDS.filter(f => vals[f.key]).map(f => `${f.name} ${vals[f.key]}`).join(" · "), true);

/* ================= monthly recap ================= */

function monthRecap() {
  const now = new Date();
  const mStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const mEnd = new Date(now.getFullYear(), now.getMonth(), 1); // exclusive
  const inM = iso => { const t = new Date(iso); return t >= mStart && t < mEnd; };

  const sess = sessions().filter(s => inM(s.startedAt));
  let vol = 0;
  for (const s of sess)
    for (const e of s.entries)
      for (const r of e.setReps) vol += r * e.weight;

  // PRs set during the month: best completed weight beating everything before it
  const prevBest = {}, monthBest = {};
  for (const s of sessions())
    for (const e of s.entries) {
      if (!isSuccess(e)) continue;
      const t = new Date(s.startedAt);
      if (t < mStart) prevBest[e.ex] = Math.max(prevBest[e.ex] || 0, e.weight);
      else if (t < mEnd) monthBest[e.ex] = Math.max(monthBest[e.ex] || 0, e.weight);
    }
  const prs = Object.keys(monthBest)
    .filter(ex => monthBest[ex] > (prevBest[ex] || 0))
    .map(ex => `${EXERCISES[ex].name} ${fmtKg(monthBest[ex])}`);

  const bw = bodyweights();
  const before = bw.filter(b => new Date(b.date) < mStart);
  const inMonth = bw.filter(b => inM(b.date));
  const startKg = inMonth.length ? (before.length ? before[before.length - 1].kg : inMonth[0].kg) : null;
  const wDelta = startKg === null ? null : Math.round((inMonth[inMonth.length - 1].kg - startKg) * 10) / 10;

  const cfg = mealsCfg(), days = mealDays();
  const wins = Object.keys(days).filter(k => {
    const d = parseDayKey(k);
    return d >= mStart && d < mEnd && dayKcal(days[k], cfg) <= cfg.budget;
  }).length;

  const weeks = weeklyPoints();
  const medals = Object.keys(weeks).sort()
    .filter(k => { const d = parseDayKey(k); return d >= mStart && d < mEnd; })
    .map(k => medalFor(weeks[k])).filter(Boolean);

  return {
    label: mStart.toLocaleDateString(undefined, { month: "long", year: "numeric" }),
    sessions: sess.length, vol: Math.round(vol), prs, wDelta, wins, medals,
    has: !!(sess.length || inMonth.length || wins),
  };
}

const reminders = () => store.load("sl.reminders", { workout: false, weighin: false, last: {} });

const daysSince = iso => Math.floor((Date.now() - new Date(iso)) / 86400000);

/* Whole calendar days between a date and today (midnight-to-midnight) */
function calDaysSince(iso) {
  const a = new Date(iso); a.setHours(0, 0, 0, 0);
  const b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 86400000);
}

/* What's gently overdue right now, per the user's reminder settings */
function dueNudges() {
  const r = reminders();
  const out = [];
  if (r.workout) {
    if (draft) {
      out.push({ id: "workout", name: "Workout in progress", sub: "finish and save it", route: "#/stronglifts" });
    } else {
      const all = sessions();
      if (all.length) {
        const d = daysSince(all[all.length - 1].startedAt);
        if (d >= 3) out.push({ id: "workout", name: `Workout ${nextWorkoutType()} is waiting`, sub: `last session ${d} days ago`, route: "#/stronglifts" });
      }
    }
  }
  if (r.weighin && new Date().getHours() < 12) {
    // Morning-only: weigh-ins happen before breakfast, so a nudge later in the
    // day is moot. And only after two missed days — one gap is never nagged.
    const bw = bodyweights();
    const missed = bw.length ? calDaysSince(bw[bw.length - 1].date) : Infinity;
    if (missed >= 2) {
      out.push(bw.length
        ? { id: "weighin", name: "Weigh-in due", sub: `${missed} days since last — step on the scale before breakfast`, route: "#/weight" }
        : { id: "weighin", name: "Start your weight log", sub: "step on the scale before breakfast", route: "#/weight" });
    }
  }
  return out;
}

async function toggleReminder(kind) {
  const r = reminders();
  r[kind] = !r[kind];
  store.save("sl.reminders", r);
  if (r[kind] && "Notification" in window && Notification.permission === "default") {
    try { await Notification.requestPermission(); } catch { /* user dismissed */ }
  }
  render();
}

function updateBadge() {
  try {
    if (!navigator.setAppBadge) return;
    const n = dueNudges().length;
    if (n) navigator.setAppBadge(n); else navigator.clearAppBadge();
  } catch { /* badging unsupported */ }
}

/* At most one silent notification per reminder per day */
async function notifyNudges() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const r = reminders();
  const today = new Date().toDateString();
  r.last = r.last || {};
  for (const n of dueNudges()) {
    if (r.last[n.id] === today) continue;
    r.last[n.id] = today;
    store.save("sl.reminders", r);
    try {
      const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
      const opts = { body: `${n.name} — ${n.sub}`, tag: "hl-" + n.id, silent: true, icon: "icon-192.png" };
      if (reg) await reg.showNotification("HEALTH LOG", opts);
      else new Notification("HEALTH LOG", opts);
    } catch { /* notifications unavailable */ }
  }
}

setInterval(() => { if (document.hidden) notifyNudges(); }, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

function remindersCardHTML() {
  const r = reminders();
  const row = (kind, name, sub) => `<div class="tog-row" onclick="toggleReminder('${kind}')">
    <span><span class="t-name">${name}</span><br><span class="t-sub">${sub}</span></span>
    <span class="tog ${r[kind] ? "on" : ""}"></span>
  </div>`;
  const blocked = "Notification" in window && Notification.permission === "denied" && (r.workout || r.weighin);
  const hint = blocked
    ? "Notifications are blocked in your browser settings — you'll still get dashboard nudges and the app-icon badge."
    : "Gentle by design: a nudge on this dashboard and an app-icon badge when something is due, plus at most one silent notification per reminder per day. No schedules, no nagging.";
  return `<div class="section-title"><span>Reminders</span></div>
  <div class="chart-card">
    ${row("workout", "Workout reminder", "when it's been 3+ days since your last session")}
    ${row("weighin", "Weigh-in reminder", "mornings only, after two missed days — weigh in before breakfast")}
    <div class="wu-none" style="margin-top: 8px;">${hint}</div>
  </div>`;
}

/* ================= actions ================= */

function startSession() {
  draft = newDraft();
  saveDraft();
  navigate("#/stronglifts");
}

function tapSet(ei, si) {
  const e = draft.entries[ei];
  const target = EXERCISES[e.ex].reps;
  const cur = e.setReps[si];
  e.setReps[si] = cur === null ? target : cur === 0 ? null : cur - 1;
  draft.lastSet = { ei, si };
  if (e.setReps[si] === null) {
    draft.rest = null;
  } else {
    armAudio();
    draft.rest = { start: Date.now(), guide: restGuide() };
    if (e.setReps[si] === target) {
      chime("tick");
      if (navigator.vibrate) navigator.vibrate(15);
      const done = draft.entries.reduce((n, en) => n + en.setReps.filter(r => r === EXERCISES[en.ex].reps).length, 0);
      const sessVol = draft.entries.reduce((v, en) => v + en.setReps.reduce((x, r) => x + (r || 0), 0) * en.weight, 0);
      kudos(hypeAt(done - 1), done % 3 === 0 ? `${fmtVolume(Math.round(sessVol))} moved this session` : "", true);
    }
  }
  saveDraft();
  render();
}

function bumpWeight(ei, delta) {
  const e = draft.entries[ei];
  e.weight = Math.max(0, Math.round((e.weight + delta) * 10) / 10);
  saveDraft();
  render();
}

function setWeight(ei, val) {
  const w = parseFloat(String(val).replace(",", "."));
  draft.entries[ei].weight = isNaN(w) || w < 0 ? 0 : Math.round(w * 10) / 10;
  saveDraft();
  render();
}

/* Lifts in this session that beat every previously completed weight */
function sessionPRs(sess) {
  const prevBest = {};
  for (const s of sessions())
    for (const e of s.entries)
      if (isSuccess(e)) prevBest[e.ex] = Math.max(prevBest[e.ex] || 0, e.weight);
  return sess.entries
    .filter(e => isSuccess(e) && e.weight > (prevBest[e.ex] || 0))
    .map(e => `${EXERCISES[e.ex].name} ${fmtKg(e.weight)}`);
}

let prBanner = null; // shown once on the next home render

function finishSession() {
  const untouched = draft.entries.every(e => e.setReps.every(r => r === null));
  if (untouched && !confirm("No sets logged. Save anyway?")) return;
  const all = sessions();
  // Unlogged sets count as 0 reps (not done)
  draft.entries.forEach(e => { e.setReps = e.setReps.map(r => r === null ? 0 : r); });
  draft.finishedAt = new Date().toISOString();
  const before = juiceSnapshot();
  const prs = sessionPRs(draft);
  const sessVol = draft.entries.reduce((v, e) => v + e.setReps.reduce((x, r) => x + r, 0) * e.weight, 0);
  all.push(draft);
  store.save("sl.sessions", all);
  store.drop("sl.draft");
  draft = null;
  if (prs.length) { prBanner = prs; celebrate(true); }
  else celebrate(false);
  kudos("Workout done!", `${fmtVolume(Math.round(sessVol))} this session · ${fmtVolume(Math.round(lifetimeVol()))} lifetime`);
  juiceAfter(before);
  navigate("#/stronglifts");
}

function cancelSession() {
  if (!confirm("Discard this session?")) return;
  store.drop("sl.draft");
  draft = null;
  navigate("#/stronglifts");
}

function deleteSession(idx) {
  if (!confirm("Delete this session from history? Future recommendations will no longer count it.")) return;
  const all = sessions();
  all.splice(idx, 1);
  store.save("sl.sessions", all);
  render();
}

render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* offline support unavailable */ });
}
</script>
