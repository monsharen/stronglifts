/* ================= progress: weekly medals =================
   Everything derives from logged data, never stored — history back-fills. */

const parseDayKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };

/* Mystery ×2 days: deterministic date hash, ~1 day in 8. Deterministic so
   history scores consistently and a reload can't reroll today. */
function hashStr(s) {
  let h = 0;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0;
  return Math.abs(h);
}
const isBonusDay = k => hashStr("hl" + k) % 8 === 0;

function winCount() {
  const cfg = mealsCfg(), days = mealDays();
  return Object.keys(days).filter(k => dayKcal(days[k], cfg) <= cfg.budget).length;
}

/* Monday day-key of the week a date falls in */
function weekKeyOf(dateLike) {
  const d = new Date(dateLike);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return dayKeyOf(d);
}

/* Weekly medal points; a win day on a 🎰 mystery day counts double */
const MEDAL_PTS = { workout: 20, win: 15, weighin: 5 };
const winPoints = k => MEDAL_PTS.win * (isBonusDay(k) ? 2 : 1);

function weeklyPoints(cutoff = Infinity) {
  const pts = {};
  const add = (k, v) => { pts[k] = (pts[k] || 0) + v; };
  for (const s of sessions()) if (new Date(s.startedAt) <= cutoff) add(weekKeyOf(s.startedAt), MEDAL_PTS.workout);
  for (const s of swims()) if (new Date(s.date) <= cutoff) add(weekKeyOf(s.date), MEDAL_PTS.workout);
  for (const s of runData()) if (new Date(s.date) <= cutoff) add(weekKeyOf(s.date), MEDAL_PTS.workout);
  for (const b of bodyweights()) if (new Date(b.date) <= cutoff) add(weekKeyOf(b.date), MEDAL_PTS.weighin);
  const cfg = mealsCfg(), days = mealDays();
  for (const k of Object.keys(days))
    if (parseDayKey(k).getTime() <= cutoff && dayKcal(days[k], cfg) <= cfg.budget) add(weekKeyOf(parseDayKey(k)), winPoints(k));
  return pts;
}

const MEDALS = [{ pts: 100, icon: "🥇" }, { pts: 60, icon: "🥈" }, { pts: 30, icon: "🥉" }];
const medalFor = p => (MEDALS.find(m => p >= m.pts) || {}).icon || null;
const MEDAL_TIER = { "🥇": "gold", "🥈": "silver", "🥉": "bronze" };

/* ---------- 3D medal coins: CSS transforms, no libraries ---------- */

function coinHTML(tier, glyph, size, opts = {}) {
  const T = Math.max(6, size * 0.09); // coin thickness
  const N = 6;
  const edges = [];
  for (let i = 0; i <= N; i++)
    edges.push(`<div class="cedge" style="transform: translateZ(${(-T / 2 + T * i / N).toFixed(1)}px);"></div>`);
  const back = opts.date
    ? `<span style="font-size:${Math.round(size * 0.2)}px; text-align:center; line-height:1.35;">HL<br><small style="font-size:${Math.max(8, Math.round(size * 0.082))}px; font-weight:600; letter-spacing:.05em;">${opts.date}</small></span>`
    : `<span style="font-size:${Math.round(size * 0.3)}px;">HL</span>`;
  return `<div class="coin-scene" style="width:${size}px;height:${size}px;">
    <div class="coin3d ${tier} spin" ${opts.id ? `id="${opts.id}"` : ""} ${opts.onclick ? `onclick="${opts.onclick}"` : ""} style="width:${size}px;height:${size}px;">
      ${edges.join("")}
      <div class="cface front" style="transform: translateZ(${(T / 2).toFixed(1)}px);"><span style="font-size:${Math.round(size * 0.42)}px;">${glyph}</span></div>
      <div class="cface back" style="transform: translateZ(${(-T / 2).toFixed(1)}px) rotateY(180deg);">${back}</div>
    </div>
  </div>`;
}

/* Drag to rotate: pauses the idle spin, clamps tilt, follows the finger */
function coinDragInit(el) {
  let rx = 12, ry = 0, start = null;
  el.addEventListener("pointerdown", e => {
    el.classList.remove("spin");
    start = { x: e.clientX, y: e.clientY, rx, ry };
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener("pointermove", e => {
    if (!start) return;
    ry = start.ry + (e.clientX - start.x) * 0.6;
    rx = Math.max(-45, Math.min(45, start.rx - (e.clientY - start.y) * 0.4));
    el.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
  el.addEventListener("pointerup", () => { start = null; });
  el.addEventListener("pointercancel", () => { start = null; });
}

function showcase(tier, glyph, name, desc, date) {
  const overlay = document.createElement("div");
  overlay.className = "showcase";
  overlay.innerHTML = `<div class="sc-inner">
    ${coinHTML(tier, glyph, 190, { id: "sc-coin", date })}
    <div class="sc-name">${name}</div>
    <div class="sc-desc">${desc}</div>
    <div class="sc-hint">drag the medal to rotate · the date achieved is engraved on the back</div>
  </div>`;
  overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  coinDragInit(overlay.querySelector("#sc-coin"));
  armAudio();
  chime("win");
}

function showAward(i) {
  const a = ACHIEVEMENTS[i];
  const got = a.test(achCtx());
  const d = got ? awardDate(i) : null;
  showcase(got ? (a.mat || "gold") : "locked", got ? a.icon : "🔒", a.name,
    got ? a.desc : `Locked — ${a.desc.toLowerCase()}`, d ? fmtShort(d) : null);
}

function showWeekMedal() {
  const pts = weeklyPoints()[weekKeyOf(new Date())] || 0;
  const medal = medalFor(pts);
  showcase(medal ? MEDAL_TIER[medal] : "locked", "★",
    medal ? `${TIER_NAME[medal]} week` : "No medal yet",
    medal ? "Earned from your activities, win days and weigh-ins this week." : "Log activities, win days and weigh-ins to earn a medal this week.",
    `wk of ${fmtShort(parseDayKey(weekKeyOf(new Date())))}`);
}

/* First-unlock moment: jackpot fanfare + kudos the moment an award unlocks.
   First ever run seeds the baseline silently so history doesn't re-fire. */
function checkNewAwards() {
  const ctx = achCtx();
  const passed = ACHIEVEMENTS.filter(a => a.test(ctx)).map(a => a.name);
  const raw = localStorage.getItem("sl.achSeen");
  if (raw === null) { store.save("sl.achSeen", passed); return; }
  const seen = new Set(JSON.parse(raw));
  const fresh = passed.filter(n => !seen.has(n));
  if (!fresh.length) return;
  store.save("sl.achSeen", passed);
  celebrate(true);
  for (const n of fresh) kudos("🏆 New award!", `${n} — open Awards to inspect your new medal`);
}

const TIER_NAME = { "🥇": "Gold", "🥈": "Silver", "🥉": "Bronze" };
const miniClass = pts => { const m = medalFor(pts); return m ? MEDAL_TIER[m] : "none"; };

function progressCardHTML() {
  const weeks = weeklyPoints();
  const thisWeek = weeks[weekKeyOf(new Date())] || 0;
  const medal = medalFor(thisWeek);
  const tier = medal ? MEDAL_TIER[medal] : "bronze"; // colour the bar toward what's next

  // Progress within the current rung of the ladder, in plain terms (no numbers)
  const ladder = [0, ...MEDALS.slice().reverse().map(m => m.pts)]; // [0,30,60,100]
  let lo = 0, hi = ladder[ladder.length - 1], nextName = "Gold";
  for (let i = 0; i < ladder.length - 1; i++) {
    if (thisWeek >= ladder[i] && thisWeek < ladder[i + 1]) { lo = ladder[i]; hi = ladder[i + 1]; nextName = TIER_NAME[MEDALS.find(m => m.pts === ladder[i + 1]).icon]; break; }
  }
  const atMax = thisWeek >= ladder[ladder.length - 1];
  const fillPct = atMax ? 100 : Math.round((thisWeek - lo) / (hi - lo) * 100);
  const fillTier = atMax ? "gold" : (nextName || "").toLowerCase();

  const tierLabel = medal ? `${TIER_NAME[medal]} week` : "In progress";
  const remaining = hi - thisWeek;
  const note = atMax ? "A complete week — every ring earned."
    : remaining <= MEDAL_PTS.workout ? `One more session away from ${nextName}.`
    : medal ? `On the way to ${nextName}.`
    : `Log activities, win days and weigh-ins to earn this week's medal.`;

  // Recent-weeks shelf as mini medals, last 8 finished weeks (oldest first)
  const shelf = [];
  for (let i = 8; i >= 1; i--) {
    const d = new Date(); d.setDate(d.getDate() - 7 * i);
    shelf.push(`<span class="mini ${miniClass(weeks[weekKeyOf(d)] || 0)}"></span>`);
  }

  const unlocked = ACHIEVEMENTS.filter(a => a.test(achCtx())).length;
  return `<div class="section-title"><span>Progress</span></div>
  <div class="prog-card">
    <div class="prog-head"><h3>This week</h3><span class="wk">wk of ${fmtShort(parseDayKey(weekKeyOf(new Date())))}</span></div>
    <div class="prog-hero">
      <div class="prog-medal">${coinHTML(medal ? MEDAL_TIER[medal] : "locked", "★", 84, { onclick: "showWeekMedal()", date: fmtShort(parseDayKey(weekKeyOf(new Date()))) })}</div>
      <div class="prog-info">
        <div class="prog-tier">${tierLabel}</div>
        <div class="prog-bar"><div class="prog-fill ${fillTier}" style="width: ${fillPct}%"></div></div>
        <div class="prog-note">${note}</div>
      </div>
    </div>
    ${isBonusDay(todayKey()) ? `<div class="prog-note" style="margin-top: 12px;">🎰 A win day logged today counts double toward this week's medal.</div>` : ""}

/* All achievements are derived from logged data — nothing to store, nothing to
   lose. With a cutoff, the context is "as of that moment", which is how the
   achieved-on dates engraved on medal backs are reconstructed. */
function achCtx(cutoff = Infinity) {
  const best = {};
  let vol = 0;
  const all = sessions().filter(s => new Date(s.startedAt) <= cutoff);
  for (const s of all)
    for (const e of s.entries) {
      for (const r of e.setReps) vol += r * e.weight;
      if (isSuccess(e)) best[e.ex] = Math.max(best[e.ex] || 0, e.weight);
    }
  const cfg = mealsCfg(), days = mealDays();
  const keys = Object.keys(days).filter(k => parseDayKey(k).getTime() <= cutoff).sort();
  let wins = 0, fikaWins = 0, bounce = 0, prevOver = false;
  const weekWins = {};
  for (const k of keys) {
    const win = dayKcal(days[k], cfg) <= cfg.budget;
    if (win) {
      wins++;
      if (days[k].f) fikaWins++;
      if (prevOver) bounce++;
      const wk = weekKeyOf(parseDayKey(k));
      weekWins[wk] = (weekWins[wk] || 0) + 1;
    }
    prevOver = !win;
  }
  const golds = Object.values(weeklyPoints(cutoff)).filter(p => p >= 100).length;
  const sw = swims().filter(s => new Date(s.date) <= cutoff);
  const rs = runState(cutoff);
  return {
    best, vol, sessions: all.length, wins,
    weighins: bodyweights().filter(b => new Date(b.date) <= cutoff).length,
    fikaWins, bounce, golds, bestWeekWins: Math.max(0, ...Object.values(weekWins)),
    swims: sw.length, swimKm: sw.reduce((s, e) => s + (e.m || 0), 0) / 1000,
    runs: rs.series.length, runBestW: rs.minW,
    run10k: runData().some(s => new Date(s.date) <= cutoff && s.km >= 9.9 && s.min),
  };
}

/* First moment an achieved award's test passes — binary search the event timeline */
function awardDate(i) {
  const a = ACHIEVEMENTS[i];
  if (!a.test(achCtx())) return null;
  const times = [
    ...sessions().map(s => new Date(s.startedAt).getTime()),
    ...swims().map(s => new Date(s.date).getTime()),
    ...runData().map(s => new Date(s.date).getTime()),
    ...bodyweights().map(b => new Date(b.date).getTime()),
    ...Object.keys(mealDays()).map(k => parseDayKey(k).getTime()),
  ].sort((x, y) => x - y);
  let lo = 0, hi = times.length - 1, ans = times[hi];
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (a.test(achCtx(times[mid]))) { ans = times[mid]; hi = mid - 1; }
    else lo = mid + 1;
  }
  return new Date(ans);
}

/* ================= running: adaptive 10 km programme =================
   StrongLifts logic applied to running. The app keeps an estimated 10 km
   time W (starting at the baseline); every target pace derives from it.
   Completing a full Intervals→Tempo→Long cycle drops W by 30 s. Three
   failed sessions in a row add a minute back. A logged run of ~10 km or
   more re-baselines W to the measured time when it's better — real data
   always wins over the model. */

const RUN_ORDER = ["I", "T", "L"];
const RUN_TYPES = { I: "Intervals", T: "Tempo", L: "Long run" };

const runData = () => store.load("sl.run", []); // oldest first: { date, type, ok, min?, km? }
const runCfg = () => ({ baseline: 60, goal: 50, ...store.load("sl.runCfg", {}) });

const fmtRunTime = m => `${Math.floor(m)}:${String(Math.round((m % 1) * 60)).padStart(2, "0")}`;
const fmtPace = p => fmtRunTime(p);

function runState(cutoff = Infinity) {
  const cfg = runCfg();
  let W = cfg.baseline, fails = 0, minW = cfg.baseline;
  const cycle = new Set();
  const series = [];
  const all = runData();
  for (const s of all) {
    if (new Date(s.date) > cutoff) break;
    if (s.km && s.min && s.km >= 9.9) {
      const measured = Math.round(s.min * (10 / s.km) * 10) / 10;
      if (measured < W) W = measured;
    }
    if (s.ok) {
      fails = 0;
      cycle.add(s.type);
      if (cycle.size === 3) { W = Math.round((W - 0.5) * 10) / 10; cycle.clear(); }
    } else if (++fails >= 3) { W = Math.round((W + 1) * 10) / 10; fails = 0; }
    minW = Math.min(minW, W);
    series.push({ weight: W, ok: s.ok, date: s.date });
  }
  const last = all.length ? all[all.length - 1] : null;
  const next = last ? RUN_ORDER[(RUN_ORDER.indexOf(last.type) + 1) % 3] : "I";
  return { W, next, series, minW, count: all.length };
}

function runPrescription(type, W) {
  const p = W / 10; // current estimated 10 km pace, min/km
  if (type === "I") return `6 × 800 m at ${fmtPace(p * 0.9)} /km, with 90 s jog recovery between reps. Warm up and cool down 10 min easy.`;
  if (type === "T") return `25 min steady at ${fmtPace(p)} /km — comfortably hard, you could say short sentences. 10 min easy either side.`;
  return `60 min easy at around ${fmtPace(p * 1.25)} /km — fully conversational. Slower is fine; time on feet is the point.`;
}

/* The prescribed segments for a session type at the current estimate.
   Ticking them off during the run marks what the session actually included. */
function runSegments(type, W) {
  const p = W / 10;
  if (type === "I") return [
    { name: "Warm-up", detail: "10 min easy" },
    ...Array.from({ length: 6 }, (_, i) => ({ name: `Rep ${i + 1}`, detail: `800 m · ${fmtPace(p * 0.9)}/km` })),
    { name: "Cool-down", detail: "10 min easy" },
  ];
  if (type === "T") return [
    { name: "Warm-up", detail: "10 min easy" },
    { name: "Tempo", detail: `25 min · ${fmtPace(p)}/km` },
    { name: "Cool-down", detail: "10 min easy" },
  ];
  return [{ name: "Long run", detail: `60 min · ${fmtPace(p * 1.25)}/km easy` }];
}

const runDraft = () => store.load("sl.rundraft", null);
const saveRunDraft = d => store.save("sl.rundraft", d);

function startRun() {
  const st = runState();
  saveRunDraft({
    type: st.next,
    startedAt: new Date().toISOString(),
    W: st.W,
    session: st.count + 1,
    segs: runSegments(st.next, st.W).map(s => ({ name: s.name, detail: s.detail, done: false })),
    min: "", km: "",
  });
  armAudio();
  render();
  window.scrollTo(0, 0);
}

function tapRunSeg(i) {
  const d = runDraft();
  if (!d) return;
  d.segs[i].done = !d.segs[i].done;
  saveRunDraft(d);
  if (d.segs[i].done) { chime("tick"); if (navigator.vibrate) navigator.vibrate(12); }
  render();
}

function setRunDraftField(field, val) {
  const d = runDraft();
  if (!d) return;
  d[field] = val;
  saveRunDraft(d);
}

function discardRun() {
  if (!confirm("Discard this run? Nothing will be saved.")) return;
  store.drop("sl.rundraft");
  render();
}

function finishRun() {
  const d = runDraft();
  if (!d) return;
  const doneCount = d.segs.filter(s => s.done).length;
  if (doneCount === 0 && !confirm("No segments ticked. Save anyway?")) return;
  const st = runState();
  const cfg = runCfg();
  const min = parseFloat(String(d.min).replace(",", "."));
  const km = parseFloat(String(d.km).replace(",", "."));
  const entry = {
    date: d.startedAt,
    type: d.type,
    ok: doneCount === d.segs.length,
    segs: d.segs.map(s => s.done),
    segCount: d.segs.length,
  };
  if (!isNaN(min) && min > 0) entry.min = Math.round(min * 10) / 10;
  if (!isNaN(km) && km > 0) entry.km = Math.round(km * 100) / 100;
  const before = juiceSnapshot();
  const all = runData();
  all.push(entry);
  store.save("sl.run", all);
  store.drop("sl.rundraft");
  const st2 = runState();
  if (entry.ok) { celebrate(false); kudos("Run done!", `${RUN_TYPES[entry.type]} · all ${entry.segCount} segments${entry.min ? ` · ${entry.min} min` : ""}${entry.km ? ` · ${entry.km} km` : ""}`); }
  else kudos("Saved", `${RUN_TYPES[entry.type]} · ${doneCount}/${entry.segCount} segments — every bit counts`, true);
  if (st2.W < st.W) {
    const hitGoal = st.W > cfg.goal && st2.W <= cfg.goal;
    celebrate(hitGoal);
    kudos(hitGoal ? "🎯 Goal pace!" : "Faster!", `estimated 10 km now ${fmtRunTime(st2.W)}${hitGoal ? ` — under ${fmtRunTime(cfg.goal)}!` : ""}`);
  }
  juiceAfter(before);
  render();
  window.scrollTo(0, 0);
}

function deleteRun(idx) {
  const all = runData();
  if (!all[idx] || !confirm(`Remove the ${RUN_TYPES[all[idx].type]} from ${fmtDate(all[idx].date)}?`)) return;
  all.splice(idx, 1);
  store.save("sl.run", all);
  render();
}

function saveRunCfg() {
  const cfg = runCfg();
  for (const [id, key] of [["run-cfg-baseline", "baseline"], ["run-cfg-goal", "goal"]]) {

const MEAS_FIELDS = [
  { key: "waist", name: "Waist" }, { key: "chest", name: "Chest" },
  { key: "arm", name: "Arm" }, { key: "thigh", name: "Thigh" },

const measPickKey = () => store.load("sl.measPick", "waist");
function measPick(k) { store.save("sl.measPick", k); render(); }

function measSeries(key) {
  return measurements().filter(m => m[key] != null).map(m => ({ weight: m[key], ok: true, date: m.date }));
}

/* Change vs the last point at least `days` older than the newest */
function seriesChange(pts, days) {
  if (!pts.length) return null;
  const cutoff = new Date(pts[pts.length - 1].date).getTime() - days * 86400000;
  let base = null;
  for (const p of pts) {
    if (new Date(p.date).getTime() <= cutoff) base = p;
    else break;
  }
  return base ? Math.round((pts[pts.length - 1].weight - base.weight) * 10) / 10 : null;
}

function logMeasurements() {
  const vals = {};
  let any = false;
  for (const f of MEAS_FIELDS) {
    const v = parseFloat(String(document.getElementById("ms-" + f.key).value).replace(",", "."));
    if (!isNaN(v) && v > 0) { vals[f.key] = Math.round(v * 10) / 10; any = true; }
  }
  if (!any) return;
  const ms = measurements();
  const now = new Date().toISOString();
  if (ms.length && new Date(ms[ms.length - 1].date).toDateString() === new Date(now).toDateString())
    Object.assign(ms[ms.length - 1], vals, { date: now });
  else ms.push({ date: now, ...vals });
  store.save("sl.meas", ms);
  armAudio();
  chime("tick");
  kudos("Measured!", MEAS_FIELDS.filter(f => vals[f.key]).map(f => `${f.name} ${vals[f.key]}`).join(" · "), true);
  render();
}

function deleteMeasEntry(idx) {
  const ms = measurements();
  if (!ms[idx] || !confirm(`Remove the entry from ${fmtDate(ms[idx].date)}?`)) return;
  ms.splice(idx, 1);
  store.save("sl.meas", ms);
  render();
}

  }

  const tiles = `<div class="tiles">
    <div class="tile"><div class="num">${pts.length ? pts[pts.length - 1].weight : "–"}</div><div class="lbl">${MEAS_FIELDS.find(f => f.key === pick).name} cm</div></div>
    <div class="tile"><div class="num">${fmtDelta(seriesChange(pts, 30))}</div><div class="lbl">30 days</div></div>
    <div class="tile"><div class="num">${ms.length}</div><div class="lbl">Entries</div></div>
  </div>`;

  const picker = `<div class="data-actions" style="margin-top: 0; margin-bottom: 10px;">${MEAS_FIELDS.map(f =>
    `<button class="${f.key === pick ? "active" : ""}" onclick="measPick('${f.key}')">${f.name}</button>`).join("")}</div>`;

  const chart = `<div class="chart-card">
      ${picker}
      ${pts.length > 1
        ? chartSVG(pts, -1, w => w, null, "#bf5af2") + `<div class="chart-dates">
            <span>${fmtDate(pts[0].date)}</span><span>${pts.length} entries</span><span>${fmtDate(pts[pts.length - 1].date)}</span>
          </div>`
        : `<div class="wu-none">Log ${pts.length ? "a second" : "a"} ${pick} measurement to see the trend.</div>`}
      ${form}
    </div>`;

  const rows = ms.slice(-10).reverse().map(m => {
    const idx = ms.indexOf(m);
    const parts = MEAS_FIELDS.filter(f => m[f.key] != null).map(f => `${f.name[0]} ${m[f.key]}`);
    return `<div class="hist-row">
      <span>${parts.join(" · ")}</span>
      <span class="reps">${fmtDate(m.date)} <button class="hist-del" onclick="deleteMeasEntry(${idx})" style="padding: 0 0 0 12px;">delete</button></span>
    </div>`;
  }).join("");

  return `${header}
    ${tiles}
    ${chart}
    <div class="section-title"><span>Entries</span><span>${ms.length} total${ms.length > 10 ? " · showing last 10" : ""}</span></div>
    <div class="hist-card">${rows}</div>`;
}

/* ================= monthly recap ================= */

function monthRecap() {
  const now = new Date();
  const mStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const mEnd = new Date(now.getFullYear(), now.getMonth(), 1); // exclusive
  const inM = iso => { const t = new Date(iso); return t >= mStart && t < mEnd; };

  const sess = sessions().filter(s => inM(s.startedAt));
  let vol = 0;
  for (const s of sess)
    for (const e of s.entries)
      for (const r of e.setReps) vol += r * e.weight;

  // PRs set during the month: best completed weight beating everything before it
  const prevBest = {}, monthBest = {};
  for (const s of sessions())
    for (const e of s.entries) {
      if (!isSuccess(e)) continue;
      const t = new Date(s.startedAt);
      if (t < mStart) prevBest[e.ex] = Math.max(prevBest[e.ex] || 0, e.weight);
      else if (t < mEnd) monthBest[e.ex] = Math.max(monthBest[e.ex] || 0, e.weight);
    }
  const prs = Object.keys(monthBest)
    .filter(ex => monthBest[ex] > (prevBest[ex] || 0))
    .map(ex => `${EXERCISES[ex].name} ${fmtKg(monthBest[ex])}`);

  const bw = bodyweights();
  const before = bw.filter(b => new Date(b.date) < mStart);
  const inMonth = bw.filter(b => inM(b.date));
  const startKg = inMonth.length ? (before.length ? before[before.length - 1].kg : inMonth[0].kg) : null;
  const wDelta = startKg === null ? null : Math.round((inMonth[inMonth.length - 1].kg - startKg) * 10) / 10;

  const cfg = mealsCfg(), days = mealDays();
  const wins = Object.keys(days).filter(k => {
    const d = parseDayKey(k);
    return d >= mStart && d < mEnd && dayKcal(days[k], cfg) <= cfg.budget;
  }).length;

  const monthSwims = swims().filter(s => inM(s.date));
  const swimKm = Math.round(monthSwims.reduce((s, e) => s + (e.m || 0), 0) / 100) / 10;
  const monthRuns = runData().filter(s => inM(s.date));

  const weeks = weeklyPoints();
  const medals = Object.keys(weeks).sort()
    .filter(k => { const d = parseDayKey(k); return d >= mStart && d < mEnd; })
    .map(k => medalFor(weeks[k])).filter(Boolean);

  return {
    label: mStart.toLocaleDateString(undefined, { month: "long", year: "numeric" }),
    sessions: sess.length, vol: Math.round(vol), prs, wDelta, wins, medals,
    swims: monthSwims.length, swimKm,
    runs: monthRuns.length, runKm: Math.round(monthRuns.reduce((s, e) => s + (e.km || 0), 0) * 10) / 10,
    has: !!(sess.length || inMonth.length || wins || monthSwims.length || monthRuns.length),
  };
}

function recapCardHTML() {
  const r = monthRecap();
  if (!r.has) return "";
  const rows = [];
  if (r.sessions) rows.push(`${r.sessions} workout${r.sessions === 1 ? "" : "s"} · ${fmtVolume(r.vol)} lifted`);
  if (r.swims) rows.push(`${r.swims} swim${r.swims === 1 ? "" : "s"}${r.swimKm ? ` · ${r.swimKm} km` : ""}`);
  if (r.runs) rows.push(`${r.runs} run${r.runs === 1 ? "" : "s"}${r.runKm ? ` · ${r.runKm} km` : ""}`);
  if (r.wDelta !== null) rows.push(`bodyweight ${r.wDelta > 0 ? "+" : ""}${r.wDelta} kg over the month`);
  if (r.wins) rows.push(`${r.wins} ⭐ win day${r.wins === 1 ? "" : "s"}`);
  if (r.prs.length) rows.push(`new PRs: ${r.prs.join(" · ")}`);
  return `<div class="section-title"><span>Last month</span></div>
  <div class="chart-card" id="recap-card">
    <div class="chart-head">
      <h3>${r.label}</h3>
      <span class="cur">${r.medals.join(" ")}</span>
    </div>
    ${rows.map(x => `<div class="wu-none" style="margin-top: 4px;">${x}</div>`).join("")}
    <div class="data-actions"><button onclick="copyRecap()">Copy recap</button></div>
  </div>`;
}

async function copyRecap() {
  const r = monthRecap();
  const lines = [
    `Health Log — ${r.label}`,
    `Workouts: ${r.sessions} (${fmtVolume(r.vol)} lifted)`,
    r.wDelta !== null ? `Bodyweight: ${r.wDelta > 0 ? "+" : ""}${r.wDelta} kg` : null,
    `Win days: ${r.wins}`,
    r.medals.length ? `Medals: ${r.medals.join(" ")}` : null,
    r.prs.length ? `New PRs: ${r.prs.join(", ")}` : null,
  ].filter(Boolean);
  try {
    await navigator.clipboard.writeText(lines.join("\n"));
    alert("Recap copied — paste it anywhere.");
  } catch {
    prompt("Copy your recap:", lines.join("\n"));
  }
}

/* ================= insights: what your own data says ================= */

const fmtSigned = v => (v > 0 ? "+" : "") + v;

/* Weekly weight change grouped by win-day count — does the regime show on the scale? */
function insightWins() {
  const cfg = mealsCfg(), days = mealDays();
  const bw = bodyweights();
  if (!bw.length) return null;
  const winByWeek = {}, loggedWeeks = new Set();
  for (const k of Object.keys(days)) {
    const wk = weekKeyOf(parseDayKey(k));
    loggedWeeks.add(wk);
    if (dayKcal(days[k], cfg) <= cfg.budget) winByWeek[wk] = (winByWeek[wk] || 0) + 1;
  }
  const chg = {};
  for (const wk of loggedWeeks) {
    const start = parseDayKey(wk).getTime(), end = start + 7 * 86400000;
    let prev = null, last = null;
    for (const b of bw) {
      const t = new Date(b.date).getTime();
      if (t < start) prev = b.kg;
      else if (t < end) last = b.kg;
    }
    if (prev !== null && last !== null) chg[wk] = last - prev;
  }
  const good = [], other = [];
  for (const wk of Object.keys(chg)) ((winByWeek[wk] || 0) >= 4 ? good : other).push(chg[wk]);
  if (good.length < 2 || other.length < 1) return null;
  const avg = a => Math.round(a.reduce((s, x) => s + x, 0) / a.length * 100) / 100;
  const g = avg(good), o = avg(other);
  return `Weeks with 4+ ⭐ win days: ${fmtSigned(g)} kg on the scale · other logged weeks: ${fmtSigned(o)} kg${g < o ? " — win weeks beat the rest. The regime shows." : "."}`;
}

/* Scale movement in the three days after a Drinks day */
function insightDrinks() {
  const days = mealDays();
  const bw = bodyweights();
  const samples = [];
  for (const k of Object.keys(days).filter(k => days[k].dr)) {
    const dayEnd = parseDayKey(k).getTime() + 86400000;
    const windowEnd = dayEnd + 3 * 86400000;
    let base = null, peak = null;
    for (const b of bw) {
      const t = new Date(b.date).getTime();
      if (t < dayEnd) base = b.kg;
      else if (t < windowEnd) peak = peak === null ? b.kg : Math.max(peak, b.kg);
    }
    if (base !== null && peak !== null) samples.push(peak - base);
  }
  if (samples.length < 2) return null;
  const avg = Math.round(samples.reduce((s, x) => s + x, 0) / samples.length * 100) / 100;
  return avg > 0.1
    ? `After a Drinks day the scale ran ${fmtSigned(avg)} kg over the following three days on average (${samples.length} samples) — it settles; trust the weekly trend.`
    : `Drinks days barely move your scale — ${fmtSigned(avg)} kg on average over the following three days (${samples.length} samples).`;
}

function insightsCardHTML() {
  const items = [insightWins(), insightDrinks()].filter(Boolean);
  if (!items.length) return "";
  const bulb = `<svg viewBox="0 0 24 24" fill="none" stroke="#161900" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.3 1 2.5h6c0-1.2.3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>`;
  return `<div class="section-title"><span>Insights</span></div>
    <div class="chart-card" id="insights-card" style="padding-top: 8px; padding-bottom: 8px;">
      ${items.map((x, i) => `<div class="insight-row" ${i ? 'style="border-top: 1px solid var(--line);"' : ""}>
        <span class="insight-icon">${bulb}</span>
        <span class="insight-text">${x}</span>
      </div>`).join("")}
    </div>`;
}

/* ================= reminders ================= */

const reminders = () => store.load("sl.reminders", { workout: false, weighin: false, last: {} });

const daysSince = iso => Math.floor((Date.now() - new Date(iso)) / 86400000);

/* Whole calendar days between a date and today (midnight-to-midnight) */
function calDaysSince(iso) {
  const a = new Date(iso); a.setHours(0, 0, 0, 0);
  const b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 86400000);
}

/* What's gently overdue right now, per the user's reminder settings */
function dueNudges() {
  const r = reminders();
  const out = [];
  if (r.workout) {
    if (draft) {
      out.push({ id: "workout", name: "Workout in progress", sub: "finish and save it", route: "#/stronglifts" });
    } else {
      const all = sessions();
      if (all.length) {
        const d = daysSince(all[all.length - 1].startedAt);
        if (d >= 3) out.push({ id: "workout", name: `Workout ${nextWorkoutType()} is waiting`, sub: `last session ${d} days ago`, route: "#/stronglifts" });
      }
    }
  }
  if (r.weighin && new Date().getHours() < 12) {
    // Morning-only: weigh-ins happen before breakfast, so a nudge later in the
    // day is moot. And only after two missed days — one gap is never nagged.
    const bw = bodyweights();
    const missed = bw.length ? calDaysSince(bw[bw.length - 1].date) : Infinity;
    if (missed >= 2) {
      out.push(bw.length
        ? { id: "weighin", name: "Weigh-in due", sub: `${missed} days since last — step on the scale before breakfast`, route: "#/body" }
        : { id: "weighin", name: "Start your weight log", sub: "step on the scale before breakfast", route: "#/body" });
    }
  }
  return out;
}

async function toggleReminder(kind) {
  const r = reminders();
  r[kind] = !r[kind];
  store.save("sl.reminders", r);
  if (r[kind] && "Notification" in window && Notification.permission === "default") {
    try { await Notification.requestPermission(); } catch { /* user dismissed */ }
  }
  render();
}

function updateBadge() {
  try {
    if (!navigator.setAppBadge) return;
    const n = dueNudges().length;
    if (n) navigator.setAppBadge(n); else navigator.clearAppBadge();
  } catch { /* badging unsupported */ }
}

/* At most one silent notification per reminder per day */
async function notifyNudges() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const r = reminders();
  const today = new Date().toDateString();
  r.last = r.last || {};
  for (const n of dueNudges()) {
    if (r.last[n.id] === today) continue;
    r.last[n.id] = today;
    store.save("sl.reminders", r);
    try {
      const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
      const opts = { body: `${n.name} — ${n.sub}`, tag: "hl-" + n.id, silent: true, icon: "icon-192.png" };
      if (reg) await reg.showNotification("HEALTH LOG", opts);
      else new Notification("HEALTH LOG", opts);
    } catch { /* notifications unavailable */ }
  }
}

setInterval(() => { if (document.hidden) notifyNudges(); }, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

function remindersCardHTML() {
  const r = reminders();
  const row = (kind, name, sub) => `<div class="tog-row" onclick="toggleReminder('${kind}')">
    <span><span class="t-name">${name}</span><br><span class="t-sub">${sub}</span></span>
    <span class="tog ${r[kind] ? "on" : ""}"></span>
  </div>`;
  const blocked = "Notification" in window && Notification.permission === "denied" && (r.workout || r.weighin);
  const hint = blocked
    ? "Notifications are blocked in your browser settings — you'll still get dashboard nudges and the app-icon badge."
    : "Gentle by design: a nudge on this dashboard and an app-icon badge when something is due, plus at most one silent notification per reminder per day. No schedules, no nagging.";
  return `<div class="section-title"><span>Reminders</span></div>
  <div class="chart-card">
    ${row("workout", "Workout reminder", "when it's been 3+ days since your last session")}
    ${row("weighin", "Weigh-in reminder", "mornings only, after two missed days — weigh in before breakfast")}
    <div class="wu-none" style="margin-top: 8px;">${hint}</div>
  </div>`;
}

/* ================= actions ================= */

function startSession() {
  draft = newDraft();
  saveDraft();
  navigate("#/stronglifts");
}

function tapSet(ei, si) {
  const e = draft.entries[ei];
  const target = EXERCISES[e.ex].reps;
  const cur = e.setReps[si];
  e.setReps[si] = cur === null ? target : cur === 0 ? null : cur - 1;
  draft.lastSet = { ei, si };
  if (e.setReps[si] === null) {
    draft.rest = null;
  } else {
    armAudio();
    draft.rest = { start: Date.now(), guide: restGuide() };
    if (e.setReps[si] === target) {
      chime("tick");
      if (navigator.vibrate) navigator.vibrate(15);
      const done = draft.entries.reduce((n, en) => n + en.setReps.filter(r => r === EXERCISES[en.ex].reps).length, 0);
      const sessVol = draft.entries.reduce((v, en) => v + en.setReps.reduce((x, r) => x + (r || 0), 0) * en.weight, 0);
      kudos(hypeAt(done - 1), done % 3 === 0 ? `${fmtVolume(Math.round(sessVol))} moved this session` : "", true);
    }
  }
  saveDraft();
  render();
}

function bumpWeight(ei, delta) {
  const e = draft.entries[ei];
  e.weight = Math.max(0, Math.round((e.weight + delta) * 10) / 10);
  saveDraft();
  render();
}

function setWeight(ei, val) {
  const w = parseFloat(String(val).replace(",", "."));
  draft.entries[ei].weight = isNaN(w) || w < 0 ? 0 : Math.round(w * 10) / 10;
  saveDraft();
  render();
}

/* Lifts in this session that beat every previously completed weight */
function sessionPRs(sess) {
  const prevBest = {};
  for (const s of sessions())
    for (const e of s.entries)
      if (isSuccess(e)) prevBest[e.ex] = Math.max(prevBest[e.ex] || 0, e.weight);
  return sess.entries
    .filter(e => isSuccess(e) && e.weight > (prevBest[e.ex] || 0))
    .map(e => `${EXERCISES[e.ex].name} ${fmtKg(e.weight)}`);
}

let prBanner = null; // shown once on the next home render

function finishSession() {
  const untouched = draft.entries.every(e => e.setReps.every(r => r === null));
  if (untouched && !confirm("No sets logged. Save anyway?")) return;
  const all = sessions();
  // Unlogged sets count as 0 reps (not done)
  draft.entries.forEach(e => { e.setReps = e.setReps.map(r => r === null ? 0 : r); });
  draft.finishedAt = new Date().toISOString();
  const before = juiceSnapshot();
  const prs = sessionPRs(draft);
  const sessVol = draft.entries.reduce((v, e) => v + e.setReps.reduce((x, r) => x + r, 0) * e.weight, 0);
  all.push(draft);
  store.save("sl.sessions", all);
  store.drop("sl.draft");
  draft = null;
  if (prs.length) { prBanner = prs; celebrate(true); }
  else celebrate(false);
  kudos("Workout done!", `${fmtVolume(Math.round(sessVol))} this session · ${fmtVolume(Math.round(lifetimeVol()))} lifetime`);
  juiceAfter(before);
  navigate("#/stronglifts");
}

function cancelSession() {
  if (!confirm("Discard this session?")) return;
  store.drop("sl.draft");
  draft = null;
  navigate("#/stronglifts");
}

function deleteSession(idx) {
  if (!confirm("Delete this session from history? Future recommendations will no longer count it.")) return;
  const all = sessions();
  all.splice(idx, 1);
  store.save("sl.sessions", all);
  render();
}

render();
initScrub();
checkNewAwards();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* offline support unavailable */ });
}
</script>
