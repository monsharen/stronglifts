<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HEALTH LOG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101216;
    --panel: #181b21;
    --panel-2: #1f232b;
    --line: #2b303a;
    --chalk: #e8e6df;
    --dim: #8b8f99;
    --volt: #d8ff3e;
    --volt-ink: #161900;
    --fail: #ff5a48;
    --warn: #ffb03e;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html { height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 120% 60% at 50% -10%, #1c2027 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px);
    color: var(--chalk);
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 120px; }

  h1, h2, h3, .display {
    font-family: "Big Shoulders Display", sans-serif;
    text-transform: uppercase;
    letter-spacing: .02em;
  }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 8px 0 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  header h1 { font-size: 26px; font-weight: 900; }
  header h1 .bar { color: var(--volt); }
  header .tag { color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .tabs { display: flex; gap: 16px; }
  .tab {
    background: none; border: none; cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    padding: 4px 0; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--chalk); border-bottom-color: var(--volt); }

  /* ---------- stats ---------- */
  .tiles { display: flex; gap: 10px; margin-bottom: 10px; }
  .tile {
    flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 10px; text-align: center;
  }
  .tile .num { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 26px; line-height: 1.1; }
  .tile .lbl { color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; }
  .chart-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 12px;
  }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .chart-head h3 { font-size: 20px; font-weight: 900; }
  .chart-head .cur { font-weight: 700; font-size: 14px; color: var(--volt); text-align: right; margin-left: 12px; }
  .chart-head .cur .best { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .chart-card svg { display: block; width: 100%; height: auto; }
  .chart-dates { display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; margin-top: 4px; }
  .chart-card.tap { cursor: pointer; }
  .chart-card.tap:active { background: var(--panel-2); }
  .tile.tap { cursor: pointer; }
  .tile.tap:active { background: var(--panel-2); }

  /* ---------- nudges & reminders ---------- */
  .nudge-card {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--volt);
    border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: 12px;
  }
  .nudge-card .n-row { padding: 2px 0; }
  .nudge-card .n-row::before { content: "→ "; color: var(--volt); }
  .tog-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); cursor: pointer; }
  .tog-row:first-child { border-top: none; padding-top: 0; }
  .tog-row .t-name { font-size: 13px; }
  .tog-row .t-sub { color: var(--dim); font-size: 11px; }
  .tog { flex: 0 0 44px; height: 26px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel-2); position: relative; transition: background .15s; }
  .tog::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--dim); transition: left .15s, background .15s;
  }
  .tog.on { background: var(--volt); border-color: var(--volt); }
  .tog.on::after { left: 20px; background: var(--volt-ink); }

  /* ---------- celebrations ---------- */
  .kudos {
    position: fixed; inset: 0; z-index: 100; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .kudos .k-main {
    font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 56px;
    text-transform: uppercase; letter-spacing: .02em; color: var(--volt); text-align: center; line-height: 1;
    text-shadow: 0 0 34px rgba(216,255,62,.6), 0 2px 0 rgba(0,0,0,.4);
    animation: k-pop 1.5s cubic-bezier(.2,1.6,.3,1) forwards;
  }
  .kudos .k-sub {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--chalk); text-align: center;
    background: rgba(16,18,22,.85); border-radius: 8px; padding: 4px 12px; margin-top: 10px;
    animation: k-sub 1.5s ease-out forwards;
  }
  .kudos.small .k-main { font-size: 32px; animation-duration: .85s; }
  .kudos.small .k-sub { animation-duration: .85s; }
  @keyframes k-pop {
    0% { transform: scale(.15) rotate(-6deg); opacity: 0; }
    16% { transform: scale(1.18) rotate(2deg); opacity: 1; }
    28% { transform: scale(1) rotate(0); }
    78% { transform: scale(1); opacity: 1; }
    100% { transform: translateY(-46px) scale(.9); opacity: 0; }
  }
  @keyframes k-sub {
    0% { opacity: 0; transform: translateY(10px); }
    22% { opacity: 1; transform: none; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
  .confetti i { position: absolute; top: -14px; width: 7px; height: 11px; opacity: .95; animation: conf-fall linear forwards; }
  @keyframes conf-fall { to { transform: translateY(105vh) rotate(720deg); opacity: .6; } }
  .meal-btn.on, .set-btn.done, .wu-set.checked .wu-btn, .snack-btn.on { animation: pop .18s ease-out; }
  @keyframes pop { 40% { transform: scale(1.12); } }
  .pr-card {
    background: var(--panel); border: 1px solid var(--volt); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 12px; text-align: center;
    box-shadow: 0 0 24px rgba(216,255,62,.12);
  }
  .pr-card .pr-title { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 26px; color: var(--volt); text-transform: uppercase; }
  .pr-card .pr-lifts { font-size: 13px; margin-top: 4px; }
  .medal-shelf { font-size: 15px; letter-spacing: .15em; }
  .ach-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .ach {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 8px; text-align: center;
    opacity: .38; filter: grayscale(1);
  }
  .ach.got { opacity: 1; filter: none; border-color: rgba(216,255,62,.4); }
  .ach .a-icon { font-size: 26px; line-height: 1.3; }
  .ach .a-name { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 14px; text-transform: uppercase; margin-top: 2px; }
  .ach .a-desc { color: var(--dim); font-size: 9px; margin-top: 2px; line-height: 1.35; }

  /* ---------- meals ---------- */
  .cal-num { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 42px; line-height: 1; margin-top: 4px; }
  .cal-num .cal-lbl { font-family: "IBM Plex Mono", monospace; font-weight: 400; font-size: 11px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; margin-left: 8px; }
  .cal-num.warn { color: var(--warn); }
  .cal-num.over { color: var(--fail); }
  .cal-bar { height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin: 10px 0 14px; }
  .cal-fill { height: 100%; background: var(--volt); transition: width .2s; }
  .cal-fill.warn { background: var(--warn); }
  .cal-fill.over { background: var(--fail); }
  .meal-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .meal-btn {
    min-height: 58px; border-radius: 8px; border: 2px solid var(--line); background: transparent;
    color: var(--dim); cursor: pointer; padding: 8px;
    font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 19px; text-transform: uppercase; letter-spacing: .03em;
    transition: background .1s, color .1s, border-color .1s;
  }
  .meal-btn .kc { display: block; font-family: "IBM Plex Mono", monospace; font-weight: 400; font-size: 10px; letter-spacing: .08em; margin-top: 2px; }
  .meal-btn.on { background: var(--volt); border-color: var(--volt); color: var(--volt-ink); }
  .meal-btn.on .kc { color: var(--volt-ink); }
  .snack-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  .snack-row .s-name { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 19px; text-transform: uppercase; }
  .snack-btn {
    flex: 0 0 58px; width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid var(--line); background: transparent; color: var(--dim);
    font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 22px; cursor: pointer;
    transition: border-color .1s, color .1s;
  }
  .snack-btn.on { border-color: var(--volt); color: var(--volt); }
  .cfg-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .cfg-item label { display: block; color: var(--dim); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
  .cfg-item input {
    width: 100%; min-height: 40px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--chalk); font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 18px; text-align: center;
  }
  .cfg-item input:focus { outline: 1px solid var(--volt); border-color: var(--volt); }

  /* ---------- dashboard ---------- */
  .app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .app-card {
    position: relative; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; min-height: 108px;
    color: var(--chalk); font-family: "IBM Plex Mono", monospace;
    display: flex; flex-direction: column; gap: 2px;
  }
  .app-card:active { background: var(--panel-2); }
  .app-card .arrow { position: absolute; right: 12px; top: 10px; color: var(--dim); }
  .app-card .app-name { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 22px; text-transform: uppercase; line-height: 1.1; }
  .app-card .app-name .bar { color: var(--volt); }
  .app-card .app-tag { color: var(--dim); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .app-card .app-status { margin-top: auto; padding-top: 10px; font-size: 11px; color: var(--volt); }

  .h-left { display: flex; align-items: center; gap: 10px; }
  .back {
    background: none; border: none; cursor: pointer;
    color: var(--dim); font-family: "IBM Plex Mono", monospace; font-size: 20px;
    padding: 2px 4px 2px 0; line-height: 1;
  }
  .back:active { color: var(--chalk); }

  .bw-form { display: flex; gap: 8px; margin-top: 12px; }
  .bw-form input {
    flex: 1; min-height: 48px; min-width: 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--chalk); font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 22px;
    text-align: center;
  }
  .bw-form input:focus { outline: 1px solid var(--volt); border-color: var(--volt); }
  .bw-form button {
    flex: 0 0 auto; padding: 0 18px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--chalk); font-family: "IBM Plex Mono", monospace;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  }
  .bw-form button:active { background: var(--line); }
  .data-actions { display: flex; gap: 8px; margin-top: 12px; }
  .data-actions button {
    flex: 1; min-height: 48px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--chalk); font-family: "IBM Plex Mono", monospace;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  }
  .data-actions button:active { background: var(--line); }
  .data-actions button.active { border-color: var(--volt); color: var(--volt); }

  /* ---------- home: next workout card ---------- */
  .next-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 6px;
    position: relative;
    overflow: hidden;
  }
  .next-card::before {
    content: attr(data-letter);
    position: absolute; right: -14px; top: -38px;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900; font-size: 170px; line-height: 1;
    color: rgba(216,255,62,.07);
    pointer-events: none;
  }
  .next-card .kicker { color: var(--dim); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .next-card h2 { font-size: 44px; font-weight: 900; line-height: 1; margin: 4px 0 14px; }
  .next-card h2 .letter { color: var(--volt); }
  .preview-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0;
    border-top: 1px dashed var(--line);
  }
  .preview-row .ex { font-family: "Big Shoulders Display", sans-serif; font-weight: 700; font-size: 19px; text-transform: uppercase; }
  .preview-row .scheme { color: var(--dim); font-size: 12px; margin-left: 8px; }
  .preview-row .kg .scheme { margin-left: 0; margin-right: 8px; font-weight: 400; }
  .preview-row .kg { font-weight: 700; font-size: 15px; }
  .preview-row .kg.deload { color: var(--fail); }
  .preview-row .kg.up { color: var(--volt); }

  .btn {
    display: block; width: 100%;
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900; font-size: 24px; text-transform: uppercase; letter-spacing: .04em;
    padding: 16px;
    border: none; border-radius: var(--radius);
    cursor: pointer;
    margin-top: 14px;
  }
  .btn-volt { background: var(--volt); color: var(--volt-ink); box-shadow: 0 6px 24px rgba(216,255,62,.15); }
  .btn-volt:active { transform: translateY(1px); box-shadow: none; }
  .btn-ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); font-size: 16px; font-weight: 700; padding: 12px; }

  /* ---------- history ---------- */
  .section-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 28px 0 10px;
    color: var(--dim);
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  }
  .hist-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .hist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .hist-head .when { color: var(--dim); font-size: 12px; }
  .hist-head .badge {
    font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 15px;
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 2px 9px; border-radius: 5px;
  }
  .hist-head .badge .letter { color: var(--volt); }
  .hist-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-top: 1px dashed var(--line); font-size: 13px; }
  .hist-row .reps { color: var(--dim); font-size: 12px; }
  .hist-row .ok { color: var(--volt); }
  .hist-row .nok { color: var(--fail); }
  .hist-del {
    background: none; border: none; color: var(--dim); font-family: inherit;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    padding: 6px 0 0; opacity: .6;
  }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; font-size: 13px; }

  /* ---------- session view ---------- */
  .sess-head { margin-bottom: 18px; }
  .sess-head .kicker { color: var(--dim); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .sess-head h2 { font-size: 40px; font-weight: 900; line-height: 1; }
  .sess-head h2 .letter { color: var(--volt); }

  .ex-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ex-top h3 { font-size: 24px; font-weight: 900; }
  .ex-top .scheme { color: var(--dim); font-size: 12px; }
  .hint { font-size: 11px; color: var(--dim); margin-top: -6px; margin-bottom: 10px; }
  .hint.deload { color: var(--fail); }
  .hint.up { color: var(--volt); }

  .weight-ctl { display: flex; align-items: stretch; gap: 8px; margin-bottom: 14px; }
  .weight-ctl button {
    flex: 0 0 56px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--chalk); font-family: "IBM Plex Mono", monospace; font-size: 22px; font-weight: 700;
    cursor: pointer;
  }
  .weight-ctl button:active { background: var(--line); }
  .weight-ctl .wfield { flex: 1; position: relative; }
  .weight-ctl input {
    width: 100%; height: 100%; min-height: 56px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--chalk); font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 30px;
    text-align: center;
    padding-right: 30px;
  }
  .weight-ctl input:focus { outline: 1px solid var(--volt); border-color: var(--volt); }
  .weight-ctl .unit {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--dim); font-size: 11px; pointer-events: none;
  }

  .sub-label {
    color: var(--dim); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    margin: 14px 0 8px;
  }
  .wu-sets { display: flex; flex-wrap: wrap; gap: 8px; }
  .wu-set { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1 0 52px; max-width: 76px; }
  .wu-btn {
    width: 100%; aspect-ratio: 1; max-width: 64px;
    border-radius: 50%;
    border: 2px dashed var(--line);
    background: transparent;
    color: var(--dim);
    font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 20px;
    cursor: pointer;
    transition: background .1s, color .1s, border-color .1s;
  }
  .wu-set.checked .wu-btn { background: var(--volt); border-style: solid; border-color: var(--volt); color: var(--volt-ink); }
  .wu-w { font-size: 10px; color: var(--dim); letter-spacing: .04em; }
  .wu-none { color: var(--dim); font-size: 12px; line-height: 1.5; }

  .sets { display: flex; gap: 8px; }
  .set-btn {
    flex: 1; aspect-ratio: 1; max-width: 76px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    color: var(--dim);
    font-family: "Big Shoulders Display", sans-serif; font-weight: 900; font-size: 22px;
    cursor: pointer;
    transition: background .1s, color .1s, border-color .1s;
  }
  .set-btn.done { background: var(--volt); border-color: var(--volt); color: var(--volt-ink); }
  .set-btn.partial { background: transparent; border-color: var(--volt); color: var(--volt); }
  .set-btn.zero { border-color: var(--fail); color: var(--fail); }
  .sets.single .set-btn { flex: 0 0 76px; }

  .sess-actions { margin-top: 22px; }
  .note { color: var(--dim); font-size: 11px; text-align: center; margin-top: 12px; }

  .video-link {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--dim); text-decoration: none;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 0;
  }
  .video-link .play {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--volt); font-size: 8px;
    padding-left: 1px;
  }
  .video-link:active { color: var(--chalk); }

  /* ---------- rest timer ---------- */
  .rest-bar {
    position: fixed; z-index: 10;
    bottom: calc(12px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    width: min(448px, calc(100% - 32px));
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 8px 30px rgba(0,0,0,.55);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .rest-start {
    flex: 1;
    background: none; border: none; cursor: pointer;
    color: var(--chalk);
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    padding: 8px 0;
  }
  .rest-start .play { color: var(--volt); margin-right: 8px; }
  .rest-time {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900; font-size: 32px; line-height: 1;
    min-width: 86px;
    font-variant-numeric: tabular-nums;
  }
  .rest-msg { flex: 1; color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .rest-stop {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--chalk); font-family: "IBM Plex Mono", monospace;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    padding: 12px 16px; cursor: pointer;
  }
  .rest-bar.over { border-color: var(--fail); animation: rest-pulse 1.2s ease-in-out infinite; }
  .rest-bar.over .rest-time, .rest-bar.over .rest-msg { color: var(--fail); }
  @keyframes rest-pulse {
    50% { box-shadow: 0 8px 30px rgba(255,90,72,.25); }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/* ================= StrongLifts 5x5 rules ================= */

const EXERCISES = {
  squat:    { name: "Squat",          sets: 5, reps: 5, inc: 2.5, start: 20 },
  bench:    { name: "Bench Press",    sets: 5, reps: 5, inc: 2.5, start: 20 },
  row:      { name: "Barbell Row",    sets: 5, reps: 5, inc: 2.5, start: 30 },
  ohp:      { name: "Overhead Press", sets: 5, reps: 5, inc: 2.5, start: 20 },
  deadlift: { name: "Deadlift",       sets: 1, reps: 5, inc: 5,   start: 40 },
};
const WORKOUTS = { A: ["squat", "bench", "row"], B: ["squat", "ohp", "deadlift"] };
const VIDEOS = {
  A: "https://www.youtube.com/watch?v=EP2g3Sj3qSw",
  B: "https://www.youtube.com/watch?v=ro3Mh9o7JPU",
};
const MIN_WEIGHT = 20;        // empty bar
const DELOAD_AFTER = 3;       // failed sessions at same weight
const DELOAD_FACTOR = 0.9;

const store = {
  load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
    catch { return fallback; }
  },
  save(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
  drop(key) { localStorage.removeItem(key); },
};

const sessions = () => store.load("sl.sessions", []); // oldest first

function nextWorkoutType() {
  const hist = sessions();
  if (!hist.length) return "A";
  return hist[hist.length - 1].type === "A" ? "B" : "A";
}

function isSuccess(entry) {
  const def = EXERCISES[entry.ex];
  return entry.setReps.length === def.sets && entry.setReps.every(r => r === def.reps);
}

/* History of one exercise, oldest → newest */
function exerciseHistory(ex) {
  const out = [];
  for (const s of sessions())
    for (const e of s.entries)
      if (e.ex === ex) out.push(e);
  return out;
}

function roundToPlate(w) {
  return Math.max(MIN_WEIGHT, Math.round(w / 2.5) * 2.5);
}

/* Returns { weight, why, fails } per StrongLifts progression rules.
   fails = consecutive failed sessions at the recommended weight so far. */
function recommend(ex) {
  const def = EXERCISES[ex];
  const hist = exerciseHistory(ex);
  if (!hist.length) return { weight: def.start, why: "start", fails: 0 };

  const last = hist[hist.length - 1];
  if (isSuccess(last)) return { weight: last.weight + def.inc, why: "up", fails: 0 };

  let fails = 0;
  for (let i = hist.length - 1; i >= 0; i--) {
    const e = hist[i];
    if (e.weight === last.weight && !isSuccess(e)) fails++;
    else break;
  }
  if (fails >= DELOAD_AFTER) return { weight: roundToPlate(last.weight * DELOAD_FACTOR), why: "deload", fails };
  return { weight: last.weight, why: "repeat", fails };
}

/* ================= app registry =================
   The dashboard builds itself from this list. To add a new app:
   add an entry here, its routes in ROUTES, and its view in render(). */
const APPS = [
  {
    id: "stronglifts",
    name: `STRONG<span class="bar">LIFTS</span>`,
    tagline: "5×5 barbell program",
    route: "#/stronglifts",
    status() {
      if (draft) return "Workout in progress";
      return sessions().length ? `Next: workout ${nextWorkoutType()}` : "Start your first workout";
    },
  },
  {
    id: "weight",
    name: "WEIGHT",
    tagline: "Bodyweight log",
    route: "#/weight",
    status() {
      const bw = bodyweights();
      return bw.length ? `Current ${fmtKg(bw[bw.length - 1].kg)}` : "Log your first weigh-in";
    },
  },
  {
    id: "meals",
    name: "MEALS",
    tagline: "Calorie slots",
    route: "#/meals",
    status() {
      const day = mealDays()[todayKey()];
      if (!day) return "Nothing logged today";
      const left = mealsCfg().budget - dayKcal(day);
      return left >= 0 ? `${left} kcal left today` : `${-left} kcal over today`;
    },
  },
];

/* ================= app state / routing ================= */

let draft = store.load("sl.draft", null);

const ROUTES = ["#/", "#/stronglifts", "#/stronglifts/stats", "#/weight", "#/meals", "#/awards"];
function parseRoute(h) {
  if (h === "#stats") return "#/stronglifts/stats"; // pre-dashboard deep link
  return ROUTES.includes(h) ? h : "#/";
}
let route = parseRoute(location.hash);
if (draft && route === "#/") route = "#/stronglifts"; // resume mid-workout on open

function navigate(r) {
  if (location.hash === r) { route = r; render(); window.scrollTo(0, 0); }
  else location.hash = r;
}
window.addEventListener("hashchange", () => {
  route = parseRoute(location.hash);
  render();
  window.scrollTo(0, 0);
});

function newDraft() {
  const type = nextWorkoutType();
  return {
    type,
    startedAt: new Date().toISOString(),
    entries: WORKOUTS[type].map(ex => {
      const rec = recommend(ex);
      return { ex, weight: rec.weight, why: rec.why, fails: rec.fails, setReps: Array(EXERCISES[ex].sets).fill(null) };
    }),
  };
}

function saveDraft() { store.save("sl.draft", draft); }

/* ================= rendering ================= */

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtKg = w => (w % 1 === 0 ? w : w.toFixed(1)) + " kg";
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const fmtClock = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function whyLabel(rec) {
  const fails = rec.fails || 0;
  switch (rec.why) {
    case "up": return "+weight — last session completed";
    case "repeat": return `attempt ${fails + 1} of ${DELOAD_AFTER} at this weight — deload after ${DELOAD_AFTER} fails`;
    case "deload": return `deload 10% — failed ${DELOAD_AFTER}× at this weight`;
    default: return "starting weight";
  }
}

function render() {
  app.innerHTML =
    route === "#/stronglifts" ? (draft ? sessionHTML() : homeHTML())
    : route === "#/stronglifts/stats" ? statsHTML()
    : route === "#/weight" ? weightHTML()
    : route === "#/meals" ? mealsHTML()
    : route === "#/awards" ? awardsHTML()
    : dashHTML();
  updateBadge();
}

function appHeaderHTML(title, right) {
  return `<header>
    <div class="h-left">
      <button class="back" onclick="navigate('#/')" aria-label="Back to dashboard">←</button>
      <h1>${title}</h1>
    </div>
    ${right}
  </header>`;
}

function slHeaderHTML() {
  const right = draft
    ? `<span class="tag">5×5 log</span>`
    : `<nav class="tabs">
        <button class="tab ${route === "#/stronglifts" ? "active" : ""}" onclick="navigate('#/stronglifts')">Log</button>
        <button class="tab ${route === "#/stronglifts/stats" ? "active" : ""}" onclick="navigate('#/stronglifts/stats')">Stats</button>
      </nav>`;
  return appHeaderHTML(`STRONG<span class="bar">LIFTS</span>`, right);
}

function homeHTML() {
  const type = nextWorkoutType();
  const rows = WORKOUTS[type].map(ex => {
    const def = EXERCISES[ex];
    const rec = recommend(ex);
    const cls = rec.why === "deload" ? "deload" : rec.why === "up" ? "up" : "";
    const attempt = rec.why === "repeat" ? `<span class="scheme">try ${rec.fails + 1}/${DELOAD_AFTER}</span>` : "";
    return `<div class="preview-row">
      <span class="ex">${def.name}<span class="scheme">${def.sets}×${def.reps}</span></span>
      <span class="kg ${cls}">${attempt}${fmtKg(rec.weight)}</span>
    </div>`;
  }).join("");

  const hist = sessions().slice().reverse();
  const histHTML = hist.length
    ? hist.map((s, ri) => {
        const idx = sessions().length - 1 - ri;
        const rows = s.entries.map(e => {
          const def = EXERCISES[e.ex];
          const ok = isSuccess(e);
          const reps = e.setReps.map(r => r === null ? "–" : r).join("/");
          return `<div class="hist-row">
            <span>${def.name} <span class="reps">@ ${fmtKg(e.weight)}</span></span>
            <span class="reps">${reps} <span class="${ok ? "ok" : "nok"}">${ok ? "✓" : "✗"}</span></span>
          </div>`;
        }).join("");
        return `<div class="hist-card">
          <div class="hist-head">
            <span class="badge">WORKOUT <span class="letter">${s.type}</span></span>
            <span class="when">${fmtDate(s.startedAt)}</span>
          </div>
          ${rows}
          <button class="hist-del" onclick="deleteSession(${idx})">delete</button>
        </div>`;
      }).join("")
    : `<div class="empty">No sessions yet. Lift something heavy.</div>`;

  const pr = prBanner
    ? `<div class="pr-card">
        <div class="pr-title">🎆 New PR</div>
        <div class="pr-lifts">${prBanner.join(" · ")}</div>
      </div>`
    : "";
  prBanner = null;

  return `${slHeaderHTML()}
    ${pr}
    <div class="next-card" data-letter="${type}">
      <div class="kicker">Next up</div>
      <h2>Workout <span class="letter">${type}</span></h2>
      ${rows}
      <a class="video-link" href="${VIDEOS[type]}" target="_blank" rel="noopener"><span class="play">▶</span>Watch workout instructions</a>
    </div>
    <button class="btn btn-volt" onclick="startSession()">Start workout ${type}</button>
    <div class="section-title"><span>History</span><span>${hist.length} session${hist.length === 1 ? "" : "s"}</span></div>
    ${histHTML}`;
}

function sessionHTML() {
  const cards = draft.entries.map((e, i) => {
    const def = EXERCISES[e.ex];
    const sets = e.setReps.map((r, si) => {
      let cls = "", label = "–";
      if (r !== null) {
        label = r;
        cls = r === def.reps ? "done" : r === 0 ? "zero" : "partial";
      }
      return `<button class="set-btn ${cls}" onclick="tapSet(${i},${si})">${label}</button>`;
    }).join("");
    const hintCls = e.why === "deload" ? "deload" : e.why === "up" ? "up" : "";
    return `<div class="ex-card">
      <div class="ex-top">
        <h3>${def.name}</h3>
        <span class="scheme">${def.sets}×${def.reps}</span>
      </div>
      <div class="hint ${hintCls}">${whyLabel(e)}</div>
      <div class="weight-ctl">
        <button onclick="bumpWeight(${i},-2.5)" aria-label="decrease">−</button>
        <div class="wfield">
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" value="${e.weight}"
                 onchange="setWeight(${i}, this.value)">
          <span class="unit">KG</span>
        </div>
        <button onclick="bumpWeight(${i},2.5)" aria-label="increase">+</button>
      </div>
      ${warmupHTML(e, i)}
      <div class="sub-label">Work sets · ${def.sets}×${def.reps}</div>
      <div class="sets ${def.sets === 1 ? "single" : ""}">${sets}</div>
    </div>`;
  }).join("");

  return `${slHeaderHTML()}
    <div class="sess-head">
      <div class="kicker">${fmtDate(draft.startedAt)}</div>
      <h2>Workout <span class="letter">${draft.type}</span></h2>
      <a class="video-link" href="${VIDEOS[draft.type]}" target="_blank" rel="noopener"><span class="play">▶</span>Watch workout instructions</a>
    </div>
    ${cards}
    <div class="sess-actions">
      <button class="btn btn-volt" onclick="finishSession()">Finish &amp; save</button>
      <button class="btn btn-ghost" onclick="cancelSession()">Discard session</button>
      <div class="note">Tap a circle once for all reps, tap again to count down. Logging a set starts the rest timer. Progress is kept if you close the page.</div>
    </div>
    ${restBarHTML()}`;
}

/* ================= warm-up ================= */

/* StrongLifts warm-up: 2×5 empty bar (deadlift: 1×5 with light plates,
   no empty bar), then 10–20 kg jumps of 3 then 2 reps up to work weight. */
function warmupPlan(ex, work) {
  const isDL = ex === "deadlift";
  const base = isDL ? 40 : 20;
  if (work <= base) return [];
  const r25 = w => Math.round(w / 2.5) * 2.5;
  const rows = isDL ? [{ w: base, reps: 5 }] : [{ w: base, reps: 5 }, { w: base, reps: 5 }];
  const gap = work - base;
  const n = Math.max(1, Math.ceil(gap / 20));
  for (let i = 1; i < n; i++) {
    rows.push({ w: r25(base + (gap / n) * i), reps: i <= (n - 1) / 2 ? 3 : 2 });
  }
  return rows;
}

function warmupHTML(e, ei) {
  const plan = warmupPlan(e.ex, e.weight);
  let body;
  if (!plan.length) {
    body = `<div class="wu-none">${e.ex === "deadlift"
      ? "No warm-up needed — the deadlift starts loaded at 40 kg, and that is your work weight."
      : "No warm-up needed — your work weight is the empty bar, so the work sets are the warm-up."}</div>`;
  } else {
    body = `<div class="wu-sets">` + plan.map((row, ri) => {
      const checked = e.wu && e.wu[ri];
      return `<div class="wu-set ${checked ? "checked" : ""}">
        <button class="wu-btn" onclick="tapWarmup(${ei},${ri})">${row.reps}</button>
        <span class="wu-w">${row.w === 20 ? "bar only" : fmtKg(row.w)}</span>
      </div>`;
    }).join("") + `</div>`;
  }
  return `<div class="sub-label">Warm-up</div>${body}`;
}

function ensureWu(e) {
  const plan = warmupPlan(e.ex, e.weight);
  if (!e.wu || e.wu.length !== plan.length) e.wu = plan.map(() => false);
}

function tapWarmup(ei, ri) {
  const e = draft.entries[ei];
  ensureWu(e);
  e.wu[ri] = !e.wu[ri];
  saveDraft();
  render();
}

/* ================= rest timer ================= */

function restGuide() {
  // StrongLifts guideline: ~3 min between sets, 5 min after a failed set
  const t = draft.lastSet;
  if (t) {
    const e = draft.entries[t.ei];
    if (e) {
      const reps = e.setReps[t.si];
      if (reps !== null && reps < EXERCISES[e.ex].reps) return 300;
    }
  }
  return 180;
}

function restBarHTML() {
  if (!draft.rest) {
    return `<div class="rest-bar"><button class="rest-start" onclick="startRest()"><span class="play">▶</span>Start rest timer</button></div>`;
  }
  const sec = Math.max(0, Math.floor((Date.now() - draft.rest.start) / 1000));
  const over = sec > draft.rest.guide;
  return `<div class="rest-bar ${over ? "over" : ""}" id="rest-bar">
    <span class="rest-time" id="rest-elapsed">${fmtClock(sec)}</span>
    <span class="rest-msg" id="rest-msg">${over ? "too long — go lift" : "guide " + fmtClock(draft.rest.guide)}</span>
    <button class="rest-stop" onclick="stopRest()">Stop</button>
  </div>`;
}

/* Audio must be unlocked by a user gesture (iOS); armAudio is called from taps. */
let audioCtx = null;
function armAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch { /* no audio support */ }
}

function beep() {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t0 = audioCtx.currentTime;
  [0, 0.25].forEach(dt => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.12, t0 + dt);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dt + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + dt);
    osc.stop(t0 + dt + 0.2);
  });
}

/* ================= celebrations ================= */

function chime(kind) { // "tick" | "win" | "fanfare"
  if (!audioCtx || audioCtx.state !== "running") return;
  const notes = kind === "fanfare" ? [523, 659, 784, 1047] : kind === "win" ? [659, 988] : [880];
  const t0 = audioCtx.currentTime;
  notes.forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.value = f;
    const t = t0 + i * 0.11;
    gain.gain.setValueAtTime(kind === "tick" ? 0.05 : 0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.3);
  });
}

function confetti(n) {
  const colors = ["#d8ff3e", "#ffb03e", "#e8e6df", "#ff5a48", "#7ec8ff"];
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  for (let i = 0; i < n; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * 0.5 + "s";
    p.style.animationDuration = 1.2 + Math.random() * 1.2 + "s";
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 3200);
}

function celebrate(big) {
  armAudio();
  confetti(big ? 90 : 35);
  chime(big ? "fanfare" : "win");
  if (navigator.vibrate) navigator.vibrate(big ? [60, 40, 60] : 30);
}

/* Big bouncy overlay text, Candy Crush style. Queued so bursts play in sequence. */
const kudosQueue = [];
let kudosActive = false;

function kudos(main, sub = "", small = false) {
  kudosQueue.push({ main, sub, small });
  pumpKudos();
}

function pumpKudos() {
  if (kudosActive || !kudosQueue.length) return;
  kudosActive = true;
  const k = kudosQueue.shift();
  const el = document.createElement("div");
  el.className = "kudos" + (k.small ? " small" : "");
  el.innerHTML = `<div class="k-main">${k.main}</div>${k.sub ? `<div class="k-sub">${k.sub}</div>` : ""}`;
  document.body.appendChild(el);
  setTimeout(() => { el.remove(); kudosActive = false; pumpKudos(); }, k.small ? 850 : 1500);
}

/* Escalating hype ladder — later sets in a session earn bigger words */
const HYPE = ["Nice!", "Sweet!", "Strong!", "Smooth!", "Crushed it!", "Beast mode!", "Divine!", "LEGENDARY!"];
const hypeAt = i => HYPE[Math.min(i, HYPE.length - 1)];
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const MEAL_HYPE = ["Logged!", "Noted!", "Tracked!", "On it!", "Counted!"];

function lifetimeVol() {
  let v = 0;
  for (const s of sessions())
    for (const e of s.entries)
      for (const r of e.setReps) v += r * e.weight;
  return v;
}

/* Snapshot → act → juiceAfter: fires extra fanfares when a logging action
   crosses a milestone (lifetime tonne, level-up, weekly medal). */
function juiceSnapshot() {
  return {
    level: levelInfo().n,
    medal: medalFor(weeklyPoints()[weekKeyOf(new Date())] || 0),
    tonnes: Math.floor(lifetimeVol() / 1000),
  };
}

function juiceAfter(before) {
  const after = juiceSnapshot();
  if (after.tonnes > before.tonnes) {
    confetti(60);
    kudos(`${after.tonnes} tonnes!`, `WOW — you've now lifted ${fmtVolume(Math.round(lifetimeVol()))} in your lifetime`);
  }
  if (after.level > before.level) {
    confetti(70);
    chime("fanfare");
    kudos("Level up!", `LVL ${after.level} · ${LEVELS[after.level - 1].title}`);
  }
  if (after.medal && after.medal !== before.medal) {
    kudos(`${after.medal} week!`, "weekly medal secured — see the shelf on your dashboard");
  }
}

function startRest() {
  armAudio();
  draft.rest = { start: Date.now(), guide: restGuide() };
  saveDraft();
  render();
}

function stopRest() {
  draft.rest = null;
  saveDraft();
  render();
}

function tickRest() {
  if (!draft || !draft.rest) return;
  const el = document.getElementById("rest-elapsed");
  if (!el) return;
  const sec = Math.max(0, Math.floor((Date.now() - draft.rest.start) / 1000));
  const over = sec > draft.rest.guide;
  el.textContent = fmtClock(sec);
  document.getElementById("rest-msg").textContent = over ? "too long — go lift" : "guide " + fmtClock(draft.rest.guide);
  document.getElementById("rest-bar").classList.toggle("over", over);
  if (over && !draft.rest.buzzed) {
    draft.rest.buzzed = true;
    saveDraft();
    if (navigator.vibrate) navigator.vibrate(200);
    beep();
  }
}
setInterval(tickRest, 500);

/* ================= stats ================= */

/* Per-exercise series oldest → newest: { weight, ok, date } */
function exerciseSeries(ex) {
  const out = [];
  for (const s of sessions())
    for (const e of s.entries)
      if (e.ex === ex) out.push({ weight: e.weight, ok: isSuccess(e), date: s.startedAt });
  return out;
}

/* Powerlifting total: squat + bench + deadlift, one point per session.
   A lift missing from a session carries over from the last session that had it;
   points start once all three lifts have been performed at least once. */
const TOTAL_LIFTS = ["squat", "bench", "deadlift"];

function totalSeries() {
  const latest = {};
  const out = [];
  for (const s of sessions()) {
    let ok = true;
    for (const e of s.entries) {
      if (TOTAL_LIFTS.includes(e.ex)) {
        latest[e.ex] = e.weight;
        if (!isSuccess(e)) ok = false;
      }
    }
    if (TOTAL_LIFTS.every(ex => latest[ex] !== undefined)) {
      const total = Math.round(TOTAL_LIFTS.reduce((sum, ex) => sum + latest[ex], 0) * 10) / 10;
      out.push({ weight: total, ok, date: s.startedAt });
    }
  }
  return out;
}

/* Total weight moved per session: every logged rep × its weight, all exercises */
function volumeSeries() {
  return sessions().map(s => {
    let vol = 0;
    for (const e of s.entries)
      for (const r of e.setReps) vol += r * e.weight;
    return { weight: Math.round(vol), ok: s.entries.every(isSuccess), date: s.startedAt };
  });
}

function fmtVolume(kg) {
  return kg >= 1000 ? (kg / 1000).toFixed(1).replace(/\.0$/, "") + " t" : kg + " kg";
}

function chartSVG(pts, prIdx = -1, fmtLabel = w => w) {
  const W = 320, H = 110, P = { l: 34, r: 12, t: prIdx >= 0 ? 26 : 12, b: 8 };
  const ws = pts.map(p => p.weight);
  let min = Math.min(...ws), max = Math.max(...ws);
  if (min === max) { min -= 2.5; max += 2.5; }
  const pad = (max - min) * 0.1;
  min -= pad; max += pad;
  const x = i => pts.length === 1 ? W / 2 : P.l + (W - P.l - P.r) * (i / (pts.length - 1));
  const y = w => P.t + (H - P.t - P.b) * (1 - (w - min) / (max - min));

  const gridW = [Math.max(...ws), Math.min(...ws)];
  const grid = gridW.map(w => `
    <line x1="${P.l}" y1="${y(w)}" x2="${W - P.r}" y2="${y(w)}" stroke="#2b303a" stroke-dasharray="3 4" stroke-width="1"/>
    <text x="${P.l - 6}" y="${y(w) + 3}" text-anchor="end" fill="#8b8f99" font-size="9" font-family="IBM Plex Mono, monospace">${fmtLabel(w)}</text>`).join("");

  const line = pts.length > 1
    ? `<polyline points="${pts.map((p, i) => `${x(i)},${y(p.weight)}`).join(" ")}" fill="none" stroke="#d8ff3e" stroke-width="2" stroke-linejoin="round"/>`
    : "";
  const dots = pts.map((p, i) => {
    const stroke = p.warn ? "#ffb03e" : p.ok ? "#d8ff3e" : "#ff5a48";
    const fill = p.warn || !p.ok ? "#101216" : "#d8ff3e";
    return `<circle cx="${x(i)}" cy="${y(p.weight)}" r="3.5" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
  }).join("");

  const pr = prIdx >= 0
    ? `<circle cx="${x(prIdx)}" cy="${y(pts[prIdx].weight)}" r="7.5" fill="none" stroke="#d8ff3e" stroke-width="1.5" stroke-dasharray="2 2"/>
       <text x="${x(prIdx)}" y="${y(pts[prIdx].weight) - 11}" text-anchor="middle" fill="#d8ff3e" font-size="9" font-weight="bold" font-family="IBM Plex Mono, monospace">PR</text>`
    : "";

  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${line}${dots}${pr}</svg>`;
}

/* Epley estimated 1RM from a 5-rep working weight */
const e1rm = (w, reps) => Math.round(w * (1 + reps / 30) * 10) / 10;

/* ---------- backup / transfer ---------- */

async function exportData() {
  const payload = JSON.stringify({
    app: "stronglifts-log",
    exportedAt: new Date().toISOString(),
    sessions: sessions(),
    bw: bodyweights(),
    height: heightCm(),
    meals: mealDays(),
    mealsCfg: store.load("sl.mealsCfg", null),
    chests: store.load("sl.chests", null),
  });
  try {
    await navigator.clipboard.writeText(payload);
    alert("Backup copied to clipboard.\n\nOpen the app in the other browser, go to Stats and tap Import backup.");
  } catch {
    prompt("Clipboard unavailable — copy this backup text manually:", payload);
  }
}

async function importData() {
  let raw = null;
  try { raw = await navigator.clipboard.readText(); } catch { /* fall through to prompt */ }
  if (!raw || !raw.trim().startsWith("{")) raw = prompt("Paste your backup here:");
  if (!raw) return;

  let data;
  try { data = JSON.parse(raw); } catch { data = null; }
  if (!data || !Array.isArray(data.sessions)) {
    alert("That doesn't look like a backup — nothing was imported.");
    return;
  }

  // Merge by union, never overwrite: sessions keyed by startedAt, bodyweight by date
  const all = sessions();
  const seen = new Set(all.map(s => s.startedAt));
  let addedSessions = 0;
  for (const s of data.sessions) {
    if (s && s.startedAt && Array.isArray(s.entries) && !seen.has(s.startedAt)) {
      all.push(s);
      seen.add(s.startedAt);
      addedSessions++;
    }
  }
  all.sort((a, b) => new Date(a.startedAt) - new Date(b.startedAt));
  store.save("sl.sessions", all);

  const bw = bodyweights();
  const seenBw = new Set(bw.map(b => b.date));
  let addedBw = 0;
  for (const b of (Array.isArray(data.bw) ? data.bw : [])) {
    if (b && b.date && typeof b.kg === "number" && !seenBw.has(b.date)) {
      bw.push(b);
      seenBw.add(b.date);
      addedBw++;
    }
  }
  bw.sort((a, b) => new Date(a.date) - new Date(b.date));
  store.save("sl.bw", bw);

  if (typeof data.height === "number" && !heightCm()) store.save("sl.height", data.height);

  if (data.meals && typeof data.meals === "object") {
    const days = mealDays();
    let added = 0;
    for (const k of Object.keys(data.meals)) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && !days[k]) { days[k] = data.meals[k]; added++; }
    }
    if (added) store.save("sl.meals", days);
  }
  if (data.mealsCfg && !localStorage.getItem("sl.mealsCfg")) store.save("sl.mealsCfg", data.mealsCfg);
  if (data.chests && !localStorage.getItem("sl.chests")) store.save("sl.chests", data.chests);

  render();
  alert(`Import complete: ${addedSessions} new session${addedSessions === 1 ? "" : "s"}, ${addedBw} new bodyweight entr${addedBw === 1 ? "y" : "ies"}.`);
}

const bodyweights = () => store.load("sl.bw", []); // oldest first: { date, kg }
const heightCm = () => store.load("sl.height", null);

/* BMI from the latest weigh-in; null until height and a weigh-in exist */
function bmi() {
  const h = heightCm(), bw = bodyweights();
  if (!h || !bw.length) return null;
  return Math.round(bw[bw.length - 1].kg / ((h / 100) ** 2) * 10) / 10;
}

function saveHeight() {
  const inp = document.getElementById("height-input");
  const h = parseFloat(String(inp.value).replace(",", "."));
  if (isNaN(h) || h < 50 || h > 250) { inp.focus(); return; }
  store.save("sl.height", Math.round(h));
  render();
}

/* Change vs the last entry at least `days` days older than the newest; null if history is shorter */
function bwChange(bw, days) {
  const cutoff = new Date(bw[bw.length - 1].date).getTime() - days * 86400000;
  let base = null;
  for (const b of bw) {
    if (new Date(b.date).getTime() <= cutoff) base = b;
    else break;
  }
  return base ? Math.round((bw[bw.length - 1].kg - base.kg) * 10) / 10 : null;
}

const fmtDelta = d => d === null ? "–" : d === 0 ? "±0" : (d > 0 ? "+" : "") + d;

function dayKeyOf(dateLike) {
  const d = new Date(dateLike);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

/* Bodyweight points, with weigh-ins up to two days after a Drinks day (from
   the meals app) flagged warn — drinks make the scale wobble before it settles. */
function bwSeries() {
  const drinks = drinkDayKeys();
  return bodyweights().map(b => {
    let warn = false;
    for (let off = 0; off <= 2 && !warn; off++) {
      const d = new Date(b.date);
      d.setDate(d.getDate() - off);
      if (drinks.has(dayKeyOf(d))) warn = true;
    }
    return { weight: b.kg, ok: true, warn, date: b.date };
  });
}

const ghostChoice = () => store.load("sl.ghost", "2022");
function pickGhost(k) { store.save("sl.ghost", k); render(); }

function ghostSeries(g) {
  const t0 = parseDayKey(g.w[0][0]).getTime();
  const kg0 = g.w[0][1];
  return g.w.map(([d, kg]) => ({
    day: Math.round((parseDayKey(d).getTime() - t0) / 86400000),
    loss: Math.round((kg0 - kg) * 100) / 100,
  }));
}

/* Your current run: day 0 = first logged weigh-in */
function raceCurSeries() {
  const bw = bodyweights();
  if (bw.length < 2) return [];
  const t0 = new Date(bw[0].date).getTime();
  return bw.map(b => ({
    day: Math.max(0, Math.round((new Date(b.date).getTime() - t0) / 86400000)),
    loss: Math.round((bw[0].kg - b.kg) * 100) / 100,
  }));
}

function ghostLossAt(ghost, day) {
  if (day <= 0) return 0;
  if (day >= ghost[ghost.length - 1].day) return null; // beyond the ghost's run
  let prev = ghost[0];
  for (const p of ghost) {
    if (p.day >= day) {
      const span = p.day - prev.day || 1;
      return prev.loss + (p.loss - prev.loss) * ((day - prev.day) / span);
    }
    prev = p;
  }
  return null;
}

function raceSVG(cur, ghost) {
  const W = 320, H = 140, P = { l: 36, r: 10, t: 10, b: 18 };
  const maxDay = Math.max(ghost[ghost.length - 1].day, cur.length ? cur[cur.length - 1].day : 0, 7);
  const losses = [...ghost.map(p => p.loss), ...cur.map(p => p.loss)];
  const top = Math.max(...losses, 1);
  const maxLoss = top * 1.08;
  const minLoss = Math.min(0, ...losses);
  const x = d => P.l + (W - P.l - P.r) * (d / maxDay);
  const y = l => P.t + (H - P.t - P.b) * (1 - (l - minLoss) / (maxLoss - minLoss));
  const line = (pts, attrs) => `<polyline points="${pts.map(p => `${x(p.day).toFixed(1)},${y(p.loss).toFixed(1)}`).join(" ")}" fill="none" ${attrs}/>`;
  const paceEnd = Math.min(maxDay, maxLoss / 0.1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    <line x1="${P.l}" y1="${y(0)}" x2="${W - P.r}" y2="${y(0)}" stroke="#2b303a" stroke-width="1"/>
    <text x="${P.l - 5}" y="${y(top) + 3}" text-anchor="end" fill="#8b8f99" font-size="9" font-family="IBM Plex Mono, monospace">−${top.toFixed(1)}</text>
    <text x="${P.l - 5}" y="${y(0) + 3}" text-anchor="end" fill="#8b8f99" font-size="9" font-family="IBM Plex Mono, monospace">0</text>
    <text x="${W - P.r}" y="${H - 4}" text-anchor="end" fill="#8b8f99" font-size="9" font-family="IBM Plex Mono, monospace">day ${maxDay}</text>
    <polyline points="${x(0)},${y(0)} ${x(paceEnd).toFixed(1)},${y(paceEnd * 0.1).toFixed(1)}" fill="none" stroke="#ffb03e" stroke-width="1" stroke-dasharray="2 4"/>
    ${line(ghost, 'stroke="#8b8f99" stroke-width="1.5" stroke-dasharray="5 4"')}
    ${cur.length ? line(cur, 'stroke="#d8ff3e" stroke-width="2" stroke-linejoin="round"') : ""}
  </svg>`;
}

function raceCardHTML() {
  const key = GHOSTS[ghostChoice()] ? ghostChoice() : "2022";
  const g = GHOSTS[key];
  const gpts = ghostSeries(g);
  const cur = raceCurSeries();
  const gLast = gpts[gpts.length - 1];

  let status;
  if (!cur.length) {
    status = "Log at least two weigh-ins and your curve races the ghost from day 0.";
  } else {
    const you = cur[cur.length - 1];
    const gl = ghostLossAt(gpts, you.day);
    if (gl === null) {
      status = `The ${key} ghost finished at −${gLast.loss} kg on day ${gLast.day}; you're on day ${you.day} at −${you.loss} kg. The track is yours now.`;
    } else {
      const diff = Math.round((you.loss - gl) * 10) / 10;
      status = diff >= 0
        ? `Day ${you.day}: you're ${diff} kg ahead of ${key}-you 👻 — keep it up.`
        : `Day ${you.day}: ${-diff} kg behind ${key}-you 👻 — the ghost averaged ${(gLast.loss / (gLast.day / 7)).toFixed(1)} kg/week.`;
    }
  }

  const picker = Object.keys(GHOSTS).map(k =>
    `<button class="${k === key ? "active" : ""}" onclick="pickGhost('${k}')">${k}</button>`).join("");

  return `<div class="section-title"><span>Ghost race · vs ${g.label}</span></div>
    <div class="chart-card">
      ${raceSVG(cur, gpts)}
      <div class="chart-dates">
        <span style="color:#d8ff3e;">— you</span>
        <span>┅ ghost</span>
        <span style="color:#ffb03e;">┄ 0.7 kg/w pace</span>
      </div>
      <div class="wu-none" style="margin-top: 8px;">${status} Day 0 is each run's first weigh-in; the y-axis is kg lost since then.</div>
      <div class="data-actions">${picker}</div>
    </div>`;
}

function weightHTML() {

function logBodyweight() {
  const inp = document.getElementById("bw-input");
  const w = parseFloat(inp.value.replace(",", "."));
  if (isNaN(w) || w <= 0) { inp.focus(); return; }
  const bw = bodyweights();
  const now = new Date().toISOString();
  const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
  const entry = { date: now, kg: Math.round(w * 10) / 10 };
  const before = juiceSnapshot();
  const prevKg = bw.length ? bw[bw.length - 1].kg : null;
  const wasMin = bw.length ? Math.min(...bw.map(b => b.kg)) : Infinity;
  if (bw.length && sameDay(bw[bw.length - 1].date, now)) bw[bw.length - 1] = entry;
  else bw.push(entry);
  store.save("sl.bw", bw);
  armAudio();
  chime("tick");
  if (navigator.vibrate) navigator.vibrate(15);
  const delta = prevKg === null ? null : Math.round((entry.kg - prevKg) * 10) / 10;
  const deltaTxt = delta === null ? "" : delta === 0 ? "same as last time · " : `${delta > 0 ? "+" : ""}${delta} kg vs last · `;
  if (entry.kg < wasMin && bw.length >= 5) {
    celebrate(true);
    kudos("New low!", `${fmtKg(entry.kg)} — lightest ever logged · +${XP.weighin} XP`);
  } else {
    kudos("Logged!", `${deltaTxt}+${XP.weighin} XP`, true);
  }
  juiceAfter(before);
  render();
}

function deleteBwEntry(idx) {
  const bw = bodyweights();
  if (!bw[idx] || !confirm(`Remove the entry from ${fmtDate(bw[idx].date)}?`)) return;
  bw.splice(idx, 1);
  store.save("sl.bw", bw);
  render();
}

/* ================= meals app ================= */

/* No exact calories — each slot carries a rough estimate. Days are keyed
   "YYYY-MM-DD" (local); unlogged days simply don't exist, and that's fine. */
const MEAL_SLOTS = [
  { key: "b",  name: "Breakfast" },
  { key: "l",  name: "Lunch" },
  { key: "f",  name: "Fika" },
  { key: "d",  name: "Dinner" },
  { key: "dr", name: "Drinks" },
];
const SNACK_MAX = 5;

/* Merged with defaults so saved configs pick up newly added slots */
const MEALS_CFG_DEFAULTS = { budget: 2500, b: 500, l: 700, f: 300, d: 900, dr: 200, sn: 150 };
const mealsCfg = () => ({ ...MEALS_CFG_DEFAULTS, ...store.load("sl.mealsCfg", {}) });
const mealDays = () => store.load("sl.meals", {}); // { "YYYY-MM-DD": { b, l, d, dr, sn } }

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dayKcal(day, cfg = mealsCfg()) {
  return MEAL_SLOTS.reduce((sum, s) => sum + (day[s.key] ? cfg[s.key] : 0), 0) + (day.sn || 0) * cfg.sn;
}

/* Oldest → newest; ok = stayed within budget (a "win day") */
function mealsSeries() {
  const cfg = mealsCfg(), days = mealDays();
  return Object.keys(days).sort().map(k => {
    const kcal = dayKcal(days[k], cfg);
    return { weight: kcal, ok: kcal <= cfg.budget, date: k };
  });
}

function editMealDay(mutate) {
  const days = mealDays(), t = todayKey();
  const day = days[t] || {};
  const cfg = mealsCfg();
  const wasSecured = !!day.d && dayKcal(day, cfg) <= cfg.budget;
  mutate(day);
  if (Object.values(day).some(v => v)) days[t] = day;
  else delete days[t]; // everything unticked again — day was never logged
  store.save("sl.meals", days);
  render();
  // Dinner ticked with budget intact = the day's star is secured; occasionally jackpot-sized
  const secured = !!day.d && dayKcal(day, cfg) <= cfg.budget;
  if (secured && !wasSecured) {
    celebrate(Math.random() < 1 / 8);
    const left = cfg.budget - dayKcal(day, cfg);
    kudos("⭐ Win day!", `dinner banked with ${left} kcal to spare${isBonusDay(todayKey()) ? " · 🎰 ×2 day — double XP!" : ""}`);
  }
}

function toggleMeal(key) {
  const before = juiceSnapshot();
  let added = false;
  editMealDay(d => { d[key] = d[key] ? 0 : 1; added = !!d[key]; });
  if (added) { armAudio(); chime("tick"); kudos(pickOne(MEAL_HYPE), "", true); }
  juiceAfter(before);
}

function tapSnack() {
  const before = juiceSnapshot();
  let n = 0;
  editMealDay(d => { d.sn = ((d.sn || 0) + 1) % (SNACK_MAX + 1); n = d.sn; });
  if (n) { armAudio(); chime("tick"); kudos(`Snack ×${n}`, "", true); }
  juiceAfter(before);
}

function saveMealsCfg() {
  const cfg = mealsCfg();
  for (const [id, key] of [["cfg-budget", "budget"], ["cfg-b", "b"], ["cfg-l", "l"], ["cfg-f", "f"], ["cfg-d", "d"], ["cfg-dr", "dr"], ["cfg-sn", "sn"]]) {
    const v = parseInt(document.getElementById(id).value, 10);
    if (!isNaN(v) && v > 0) cfg[key] = v;
  }
  store.save("sl.mealsCfg", cfg);
  render();
}

/* Day-keys with drinks logged — bodyweight wobbles for a few days after these */
function drinkDayKeys() {
  const days = mealDays();
  return new Set(Object.keys(days).filter(k => days[k].dr));
}

function mealsHTML() {

  else if (!day.b) statusLine = `⭐ On track for a win day — breakfast skipped leaves room for dinner.`;

        <span>${fmtDate(series[series.length - 1].date)}</span>
      </div>

  const histRows = Object.keys(days).sort().reverse().slice(0, 14).map(k => {

  const hist = histRows ? `<div class="section-title"><span>Logged days</span><span>${series.length} total</span></div>
    <div class="hist-card">${histRows}</div>` : "";

  const cfgCard = `<div class="section-title"><span>Slot estimates</span></div>
    <div class="chart-card">
      <div class="wu-none">Rough estimates per slot — no food diaries here. Missing a day is fine; only logged days count.</div>
      <div class="cfg-grid">
        <div class="cfg-item"><label>Budget</label><input inputmode="numeric" id="cfg-budget" value="${cfg.budget}"></div>
        <div class="cfg-item"><label>Breakfast</label><input inputmode="numeric" id="cfg-b" value="${cfg.b}"></div>
        <div class="cfg-item"><label>Lunch</label><input inputmode="numeric" id="cfg-l" value="${cfg.l}"></div>
        <div class="cfg-item"><label>Fika</label><input inputmode="numeric" id="cfg-f" value="${cfg.f}"></div>
        <div class="cfg-item"><label>Dinner</label><input inputmode="numeric" id="cfg-d" value="${cfg.d}"></div>
        <div class="cfg-item"><label>Drinks</label><input inputmode="numeric" id="cfg-dr" value="${cfg.dr}"></div>

      </div>

    </div>`;

  return `${appHeaderHTML("MEALS", `<span class="tag">calorie slots</span>`)}
    ${tiles}
    ${isBonusDay(todayKey()) ? `<div class="nudge-card"><div class="n-row">🎰 Mystery ×2 day — today's ⭐ is worth double XP</div></div>` : ""}
    <div class="chart-card">
      <div class="chart-head">
        <h3>Today</h3>
        <span class="cur">${kcal} / ${cfg.budget} kcal</span>
      </div>
      <div class="cal-num ${level}">${Math.abs(left)}<span class="cal-lbl">kcal ${left >= 0 ? "left" : "over"}</span></div>
      <div class="cal-bar"><div class="cal-fill ${level}" style="width: ${pct}%"></div></div>
      <div class="meal-slots">${slotBtns}</div>
      <div class="snack-row">
        <span class="s-name">Snacks<span class="scheme" style="margin-left:8px;">~${cfg.sn} kcal each</span></span>
        <button class="snack-btn ${day.sn ? "on" : ""}" onclick="tapSnack()">${day.sn || 0}</button>
      </div>
      <div class="wu-none" style="margin-top: 12px;">${statusLine}</div>
    </div>
    ${chart}
    ${hist}
    ${cfgCard}`;
}

/* ================= progress: XP, levels, weekly medals =================
   XP is derived from logged data, never stored — history back-fills itself. */

const XP = { weighin: 5, workout: 20, win: 15, combo: 10 };

const parseDayKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };

/* Mystery ×2 days: deterministic date hash, ~1 day in 8. Deterministic so
   history scores consistently and a reload can't reroll today. */
function hashStr(s) {
  let h = 0;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0;
  return Math.abs(h);
}
const isBonusDay = k => hashStr("hl" + k) % 8 === 0;

function xpBreakdown() {
  const cfg = mealsCfg(), days = mealDays();
  const winKeys = Object.keys(days).filter(k => dayKcal(days[k], cfg) <= cfg.budget);
  const workoutDays = new Set(sessions().map(s => dayKeyOf(s.startedAt)));
  const weighinDays = new Set(bodyweights().map(b => dayKeyOf(b.date)));
  const combos = winKeys.filter(k => workoutDays.has(k) && weighinDays.has(k)).length;
  const bonusWins = winKeys.filter(isBonusDay).length;
  return { weighins: bodyweights().length, workouts: sessions().length, wins: winKeys.length, combos, bonusWins };
}

/* ---------- win chests: every 5 win days fills one ---------- */

const chestState = () => store.load("sl.chests", { opened: 0, rewards: [] });
const chestXP = () => chestState().rewards.reduce((s, r) => s + r.xp, 0);
const chestsReady = () => Math.floor(xpBreakdown().wins / 5) - chestState().opened;

function openChest() {
  const chests = chestState();
  if (Math.floor(xpBreakdown().wins / 5) <= chests.opened) return;
  const xs = [25, 25, 25, 50, 50, 100];
  const trophies = ["🏆", "🎖️", "🍾", "💎", "👑", "🦄", "🔥", "🚀", "🥂", "🧨"];
  const before = juiceSnapshot();
  const reward = {
    xp: xs[Math.floor(Math.random() * xs.length)],
    trophy: trophies[Math.floor(Math.random() * trophies.length)],
    at: new Date().toISOString(),
  };
  chests.opened++;
  chests.rewards.push(reward);
  store.save("sl.chests", chests);
  celebrate(true);
  kudos(`${reward.trophy} +${reward.xp} XP`, "chest opened — loot added to your shelf");
  juiceAfter(before);
  render();
}

function totalXP() {
  const b = xpBreakdown();
  return b.weighins * XP.weighin + b.workouts * XP.workout + b.wins * XP.win
    + b.bonusWins * XP.win /* mystery-day wins count double */
    + b.combos * XP.combo + chestXP();
}

const LEVELS = [
  { xp: 0, title: "Empty Bar" }, { xp: 60, title: "Plate Loader" }, { xp: 150, title: "5×5 Apprentice" },
  { xp: 300, title: "Iron Novice" }, { xp: 500, title: "Barbell Regular" }, { xp: 750, title: "Plate Club" },
  { xp: 1050, title: "Volume Merchant" }, { xp: 1400, title: "Deload Survivor" }, { xp: 1800, title: "Iron Viking" },
  { xp: 2300, title: "Stronglifter" }, { xp: 2900, title: "Tonnage Tycoon" }, { xp: 3600, title: "Iron Legend" },
];

function levelInfo() {
  const xp = totalXP();
  let i = 0;
  while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1].xp) i++;
  const next = LEVELS[i + 1] || null;
  return { n: i + 1, title: LEVELS[i].title, xp, cur: LEVELS[i].xp, next: next && next.xp };
}

/* Monday day-key of the week a date falls in */
function weekKeyOf(dateLike) {
  const d = new Date(dateLike);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return dayKeyOf(d);
}

function weeklyPoints() {
  const pts = {};
  const add = (k, v) => { pts[k] = (pts[k] || 0) + v; };
  for (const s of sessions()) add(weekKeyOf(s.startedAt), XP.workout);
  for (const b of bodyweights()) add(weekKeyOf(b.date), XP.weighin);
  const cfg = mealsCfg(), days = mealDays();
  for (const k of Object.keys(days))
    if (dayKcal(days[k], cfg) <= cfg.budget) add(weekKeyOf(parseDayKey(k)), XP.win);
  return pts;
}

const MEDALS = [{ pts: 100, icon: "🥇" }, { pts: 60, icon: "🥈" }, { pts: 30, icon: "🥉" }];
const medalFor = p => (MEDALS.find(m => p >= m.pts) || {}).icon || null;

function progressCardHTML() {
  const lv = levelInfo();
  const span = lv.next ? lv.next - lv.cur : 1;
  const pct = lv.next ? Math.min(100, Math.round((lv.xp - lv.cur) / span * 100)) : 100;
  const weeks = weeklyPoints();
  const thisWeek = weeks[weekKeyOf(new Date())] || 0;
  const medal = medalFor(thisWeek);
  const nextMedal = MEDALS.slice().reverse().find(m => thisWeek < m.pts);
  const weekLine = medal
    ? `${medal} week secured — ${thisWeek} pts${nextMedal ? ` · ${nextMedal.pts - thisWeek} to ${nextMedal.icon}` : " · max medal!"}`
    : `${thisWeek} pts this week — ${nextMedal.pts - thisWeek} more for 🥉`;

  // Medal shelf: the last 8 finished weeks, oldest first
  const shelf = [];
  for (let i = 8; i >= 1; i--) {
    const d = new Date();
    d.setDate(d.getDate() - 7 * i);
    shelf.push(medalFor(weeks[weekKeyOf(d)] || 0) || "·");
  }

  return `<div class="section-title"><span>Progress</span></div>
  <div class="chart-card">
    <div class="chart-head">
      <h3>LVL ${lv.n} · ${lv.title}</h3>
      <span class="cur">${lv.xp} XP<span class="best">${lv.next ? lv.next - lv.xp + " to next" : "max level"}</span></span>
    </div>
    <div class="cal-bar"><div class="cal-fill" style="width: ${pct}%"></div></div>
    <div class="wu-none">${weekLine}</div>
    <div class="wu-none" style="margin-top: 6px;">Past weeks: <span class="medal-shelf">${shelf.join(" ")}</span></div>
    <div class="wu-none" style="margin-top: 6px;">Workout +${XP.workout} · win day +${XP.win} · weigh-in +${XP.weighin} · all three in one day +${XP.combo}</div>
    ${chestsReady() > 0
      ? `<button class="btn btn-volt" style="font-size: 18px; padding: 12px;" onclick="openChest()">🎁 Open win chest${chestsReady() > 1 ? ` (${chestsReady()} ready)` : ""}</button>`
      : `<div class="wu-none" style="margin-top: 6px;">🎁 Next win chest at ${(Math.floor(xpBreakdown().wins / 5) + 1) * 5} win days — you have ${xpBreakdown().wins}.</div>`}
    ${chestState().rewards.length
      ? `<div class="wu-none" style="margin-top: 6px;">Chest loot: <span class="medal-shelf">${chestState().rewards.map(r => r.trophy).join(" ")}</span> (+${chestXP()} XP)</div>`
      : ""}
    <div class="tog-row" onclick="navigate('#/awards')" style="margin-top: 8px;">
      <span class="t-name">🏆 Awards</span>
      <span class="t-sub">${ACHIEVEMENTS.filter(a => a.test(achCtx())).length} / ${ACHIEVEMENTS.length} unlocked →</span>
    </div>
  </div>`;
}

/* ================= awards ================= */

/* All achievements are derived from logged data — nothing to store, nothing to lose. */
function achCtx() {
  const best = {};
  let vol = 0;
  const all = sessions();
  for (const s of all)
    for (const e of s.entries) {
      for (const r of e.setReps) vol += r * e.weight;
      if (isSuccess(e)) best[e.ex] = Math.max(best[e.ex] || 0, e.weight);
    }
  const cfg = mealsCfg(), days = mealDays();
  const keys = Object.keys(days).sort();
  let wins = 0, fikaWins = 0, bounce = 0, prevOver = false;
  const weekWins = {};
  for (const k of keys) {
    const win = dayKcal(days[k], cfg) <= cfg.budget;
    if (win) {
      wins++;
      if (days[k].f) fikaWins++;
      if (prevOver) bounce++;
      const wk = weekKeyOf(parseDayKey(k));
      weekWins[wk] = (weekWins[wk] || 0) + 1;
    }
    prevOver = !win;
  }
  const golds = Object.values(weeklyPoints()).filter(p => p >= 100).length;
  return {
    best, vol, sessions: all.length, wins, weighins: bodyweights().length,
    fikaWins, bounce, golds, bestWeekWins: Math.max(0, ...Object.values(weekWins)),
  };
}

const liftClub = (ex, kg) => ({ icon: "🏋️", name: `${EXERCISES[ex].name} ${kg} kg`, desc: `Complete 5×5 at ${kg} kg`, test: c => (c.best[ex] || 0) >= kg });
const ACHIEVEMENTS = [
  { icon: "🎬", name: "First blood", desc: "Log your first workout", test: c => c.sessions >= 1 },
  { icon: "📅", name: "Ten sessions", desc: "Log 10 workouts", test: c => c.sessions >= 10 },
  { icon: "🗓", name: "Quarter century", desc: "Log 25 workouts", test: c => c.sessions >= 25 },
  { icon: "💯", name: "Centurion", desc: "Log 100 workouts", test: c => c.sessions >= 100 },
  liftClub("squat", 60), liftClub("squat", 80), liftClub("squat", 100), liftClub("squat", 120),
  liftClub("bench", 60), liftClub("bench", 80), liftClub("bench", 100),
  liftClub("deadlift", 100), liftClub("deadlift", 140), liftClub("deadlift", 180),
  { icon: "🚚", name: "First tonne", desc: "Lift 1 t of total volume", test: c => c.vol >= 1000 },
  { icon: "🐘", name: "Elephant herd", desc: "Lift 25 t — about 4 elephants", test: c => c.vol >= 25000 },
  { icon: "🐋", name: "Blue whale", desc: "Lift 150 t — one blue whale", test: c => c.vol >= 150000 },
  { icon: "✈️", name: "Jumbo jet", desc: "Lift 180 t — a loaded 747", test: c => c.vol >= 180000 },
  { icon: "⭐", name: "First star", desc: "Log a day under budget", test: c => c.wins >= 1 },
  { icon: "🌟", name: "Star collector", desc: "10 win days", test: c => c.wins >= 10 },
  { icon: "✨", name: "Constellation", desc: "30 win days", test: c => c.wins >= 30 },
  { icon: "🌌", name: "Galaxy brain", desc: "75 win days", test: c => c.wins >= 75 },
  { icon: "☕", name: "Fika discipline", desc: "10 win days that included fika", test: c => c.fikaWins >= 10 },
  { icon: "🧘", name: "Bounce back", desc: "Win the day right after an over day", test: c => c.bounce >= 1 },
  { icon: "🃏", name: "Full week hand", desc: "5 win days inside one week", test: c => c.bestWeekWins >= 5 },
  { icon: "🥇", name: "Gold standard", desc: "Earn a gold week", test: c => c.golds >= 1 },
  { icon: "🏆", name: "Gold hoarder", desc: "Earn 5 gold weeks", test: c => c.golds >= 5 },
  { icon: "⚖️", name: "On the record", desc: "Log 10 weigh-ins", test: c => c.weighins >= 10 },
  { icon: "📈", name: "Data devotee", desc: "Log 50 weigh-ins", test: c => c.weighins >= 50 },
];

function awardsHTML() {
  const ctx = achCtx();
  const cells = ACHIEVEMENTS.map(a => {
    const got = a.test(ctx);
    return `<div class="ach ${got ? "got" : ""}">
      <div class="a-icon">${got ? a.icon : "🔒"}</div>
      <div class="a-name">${a.name}</div>
      <div class="a-desc">${a.desc}</div>
    </div>`;
  }).join("");
  const n = ACHIEVEMENTS.filter(a => a.test(ctx)).length;
  return `${appHeaderHTML("AWARDS", `<span class="tag">${n} / ${ACHIEVEMENTS.length}</span>`)}
    <div class="ach-grid">${cells}</div>
    <div class="wu-none" style="margin-top: 12px;">Awards unlock themselves from your logs — nothing to claim, nothing to lose.</div>`;
}

/* ================= reminders ================= */

const reminders = () => store.load("sl.reminders", { workout: false, weighin: false, last: {} });

const daysSince = iso => Math.floor((Date.now() - new Date(iso)) / 86400000);

/* Whole calendar days between a date and today (midnight-to-midnight) */
function calDaysSince(iso) {
  const a = new Date(iso); a.setHours(0, 0, 0, 0);
  const b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 86400000);
}

/* What's gently overdue right now, per the user's reminder settings */
function dueNudges() {
  const r = reminders();
  const out = [];
  if (r.workout) {
    if (draft) {
      out.push({ id: "workout", text: "You have a workout in progress — finish and save it" });
    } else {
      const all = sessions();
      if (all.length) {
        const d = daysSince(all[all.length - 1].startedAt);
        if (d >= 3) out.push({ id: "workout", text: `Workout ${nextWorkoutType()} is waiting — last session ${d} days ago` });
      }
    }
  }
  if (r.weighin && new Date().getHours() < 12) {
    // Morning-only: weigh-ins happen before breakfast, so a nudge later in the
    // day is moot. And only after two missed days — one gap is never nagged.
    const bw = bodyweights();
    const missed = bw.length ? calDaysSince(bw[bw.length - 1].date) : Infinity;
    if (missed >= 2) {
      out.push({ id: "weighin", text: bw.length
        ? `${missed} days since your last weigh-in — step on the scale before breakfast`
        : "Step on the scale before breakfast to start your weight log" });
    }
  }
  return out;
}

async function toggleReminder(kind) {
  const r = reminders();
  r[kind] = !r[kind];
  store.save("sl.reminders", r);
  if (r[kind] && "Notification" in window && Notification.permission === "default") {
    try { await Notification.requestPermission(); } catch { /* user dismissed */ }
  }
  render();
}

function updateBadge() {
  try {
    if (!navigator.setAppBadge) return;
    const n = dueNudges().length;
    if (n) navigator.setAppBadge(n); else navigator.clearAppBadge();
  } catch { /* badging unsupported */ }
}

/* At most one silent notification per reminder per day */
async function notifyNudges() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const r = reminders();
  const today = new Date().toDateString();
  r.last = r.last || {};
  for (const n of dueNudges()) {
    if (r.last[n.id] === today) continue;
    r.last[n.id] = today;
    store.save("sl.reminders", r);
    try {
      const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
      const opts = { body: n.text, tag: "hl-" + n.id, silent: true, icon: "icon-192.png" };
      if (reg) await reg.showNotification("HEALTH LOG", opts);
      else new Notification("HEALTH LOG", opts);
    } catch { /* notifications unavailable */ }
  }
}

setInterval(() => { if (document.hidden) notifyNudges(); }, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

function remindersCardHTML() {
  const r = reminders();
  const row = (kind, name, sub) => `<div class="tog-row" onclick="toggleReminder('${kind}')">
    <span><span class="t-name">${name}</span><br><span class="t-sub">${sub}</span></span>
    <span class="tog ${r[kind] ? "on" : ""}"></span>
  </div>`;
  const blocked = "Notification" in window && Notification.permission === "denied" && (r.workout || r.weighin);
  const hint = blocked
    ? "Notifications are blocked in your browser settings — you'll still get dashboard nudges and the app-icon badge."
    : "Gentle by design: a nudge on this dashboard and an app-icon badge when something is due, plus at most one silent notification per reminder per day. No schedules, no nagging.";
  return `<div class="section-title"><span>Reminders</span></div>
  <div class="chart-card">
    ${row("workout", "Workout reminder", "when it's been 3+ days since your last session")}
    ${row("weighin", "Weigh-in reminder", "mornings only, after two missed days — weigh in before breakfast")}
    <div class="wu-none" style="margin-top: 8px;">${hint}</div>
  </div>`;
}

/* ================= actions ================= */

function startSession() {
  draft = newDraft();
  saveDraft();
  navigate("#/stronglifts");
}

function tapSet(ei, si) {
  const e = draft.entries[ei];
  const target = EXERCISES[e.ex].reps;
  const cur = e.setReps[si];
  e.setReps[si] = cur === null ? target : cur === 0 ? null : cur - 1;
  draft.lastSet = { ei, si };
  if (e.setReps[si] === null) {
    draft.rest = null;
  } else {
    armAudio();
    draft.rest = { start: Date.now(), guide: restGuide() };
    if (e.setReps[si] === target) {
      chime("tick");
      if (navigator.vibrate) navigator.vibrate(15);
      const done = draft.entries.reduce((n, en) => n + en.setReps.filter(r => r === EXERCISES[en.ex].reps).length, 0);
      const sessVol = draft.entries.reduce((v, en) => v + en.setReps.reduce((x, r) => x + (r || 0), 0) * en.weight, 0);
      kudos(hypeAt(done - 1), done % 3 === 0 ? `${fmtVolume(Math.round(sessVol))} moved this session` : "", true);
    }
  }
  saveDraft();
  render();
}

function bumpWeight(ei, delta) {
  const e = draft.entries[ei];
  e.weight = Math.max(0, Math.round((e.weight + delta) * 10) / 10);
  saveDraft();
  render();
}

function setWeight(ei, val) {
  const w = parseFloat(String(val).replace(",", "."));
  draft.entries[ei].weight = isNaN(w) || w < 0 ? 0 : Math.round(w * 10) / 10;
  saveDraft();
  render();
}

/* Lifts in this session that beat every previously completed weight */
function sessionPRs(sess) {
  const prevBest = {};
  for (const s of sessions())
    for (const e of s.entries)
      if (isSuccess(e)) prevBest[e.ex] = Math.max(prevBest[e.ex] || 0, e.weight);
  return sess.entries
    .filter(e => isSuccess(e) && e.weight > (prevBest[e.ex] || 0))
    .map(e => `${EXERCISES[e.ex].name} ${fmtKg(e.weight)}`);
}

let prBanner = null; // shown once on the next home render

function finishSession() {
  const untouched = draft.entries.every(e => e.setReps.every(r => r === null));
  if (untouched && !confirm("No sets logged. Save anyway?")) return;
  const all = sessions();
  // Unlogged sets count as 0 reps (not done)
  draft.entries.forEach(e => { e.setReps = e.setReps.map(r => r === null ? 0 : r); });
  draft.finishedAt = new Date().toISOString();
  const before = juiceSnapshot();
  const prs = sessionPRs(draft);
  const sessVol = draft.entries.reduce((v, e) => v + e.setReps.reduce((x, r) => x + r, 0) * e.weight, 0);
  all.push(draft);
  store.save("sl.sessions", all);
  store.drop("sl.draft");
  draft = null;
  if (prs.length) { prBanner = prs; celebrate(true); }
  else celebrate(false);
  kudos("Workout done!", `${fmtVolume(Math.round(sessVol))} this session · ${fmtVolume(Math.round(lifetimeVol()))} lifetime · +${XP.workout} XP`);
  juiceAfter(before);
  navigate("#/stronglifts");
}

function cancelSession() {
  if (!confirm("Discard this session?")) return;
  store.drop("sl.draft");
  draft = null;
  navigate("#/stronglifts");
}

function deleteSession(idx) {
  if (!confirm("Delete this session from history? Future recommendations will no longer count it.")) return;
  const all = sessions();
  all.splice(idx, 1);
  store.save("sl.sessions", all);
  render();
}

render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* offline support unavailable */ });
}
